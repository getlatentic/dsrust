# Every function and class in the pinned Python package, and what answers for it here.
#
# Checked by `scripts/check_json_repair_parity.py`, which fails when a symbol is unmapped, when a
# mapping names a Rust item that does not exist, when a signature moves under the pin, or when an
# absence has no reason written against it. A port is read once and then trusted forever; this is
# what stops a function quietly going missing.
#
# `python` is the parameter list at the pin, so a changed default shows up as drift. `note` is for
# what the Rust does differently — an empty one means the counterpart is a direct translation.

