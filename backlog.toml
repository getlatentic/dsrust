[[sprint]]
id = "s12"
name = "A request, and a model that answers it"
state = "done"
shipped = "2026-07-21"
outcome = """
What a module asks for and what comes back are values, so an attempt can differ from the one
before it and a caller can say what a single call should do.
"""
state_note = """
Shipped whole, and **b2 is closed**.

`LmRequest` carries system, turns, mode and a `Sampling` of temperature, max_tokens, n and
rollout_id. `LmResponse` carries outputs, usage, cache_hit and provider_data. Every field is
upstream's and every one does its job: all three providers send the sampling on the key their own
format names and read their own usage counters back onto one `Usage`; the OpenAI-shaped path sends
`n` and reads every choice into `outputs`; `Cached` keys entries on the whole request so
`rollout_id` breaks the key exactly as upstream's does, and `cache_hit` reports whether a reply was
replayed. The cache is on by default and process-wide, matching `LM(cache=True)` and dspy's
module-level `DSPY_CACHE`; it is a bounded LRU for the same reason upstream's is, and only `LM`
consults it, because upstream's `DummyLM` extends `BaseLM` and so is never cached either.
`LmResponse::spend` reports nothing for a replay, which is how upstream's usage tracker treats a
`cache_hit`. A `Prediction` reports what every call behind it cost, a fallback and a feedback retry
included, since a `forward` bills up to four.

b2 closed by widening the predictor walk: `NamedPredictor` lends its predictor's `Sampling`, and
`Module::set_sampling` assigns to all of them — dspy's `set_lm` semantics, with sampling on the
request where upstream puts it on a copied model. `BootstrapFewShot` asks each round after the
first as `Sampling::rollout(round)` (temperature 1.0, fresh id) and puts the teacher back
afterwards, so a second attempt is a genuinely different ask. That unblocks s11: `BestOfN` and
`Refine` need exactly this, and `BestOfN` can also read several completions from one round trip
rather than re-asking.

Also fixed here: five tests raced on the process-wide `GLOBAL` model, which failed about once in
25 full runs. `global::install_for_test` serialises them.
"""
rationale = """
b2 is half built: a module can be given its own model, and nothing can make two models disagree.
Closing it means ChatModel::chat carrying what to disagree about, which every implementation and
the bridge see — an API decision rather than an addition.

dspy has already made that decision, so this follows rather than invents. It is normalising to
forward(request: LMRequest) -> LMResponse: model, messages, temperature, max_tokens, n and
rollout_id in the request; text, outputs, usage, cache_hit and provider_data in the response.
Opt-in at 3.3, default at 3.5, legacy gone by 3.6/4.0. Porting the current untyped **kwargs
shape would be porting something with a removal date.

Pinned at 3.2.1, this crate would be building ahead of its own pin — the first time that has
happened, and worth stating rather than doing quietly. The conformance suite still answers to
3.2.1, so the request type is ours to design until upstream's arrives, and the goldens keep
measuring the bytes either way.

It also gives Rust somewhere to put what dspy.context does. Upstream scopes a temporary model
with a context manager over a ContextVar; a request that travels as a value needs no ambient
state to be overridden, which is the same trade forward_traced already made against
settings.trace.
"""
suites = []

[[sprint]]
id = "s13"
name = "The normalized LM types, in full"
state = "planned"
outcome = "Every type in dspy 3.3's LM contract exists here, with nothing modelled by a stand-in."
notes = '''
Reference: docs/lm-api-3.3.md, measured from dspy-3.3.0b1/dspy/core/types.py. That file also holds
the per-type gap table, so this sprint is transcription rather than design.

**The constraint that governs the whole sprint: the rendered bytes must not move.** The pin for
prompt bytes is 3.2.1 and this is a 3.3 *type* layer. Every conformance fixture and the upstream
suite must stay green through every commit — they are what proves a type port did not become a
behaviour change. A commit that greens by regenerating a fixture has failed.

Order, leaves first, so nothing is half-typed at any point:

  s13-1  DONE. LmUsage carries upstream's eleven fields, all optional, plus `details`. `filled()`
         is `fill_aliases`: both naming conventions populated from whichever arrived, and the
         total derived. `counted(input, output)` is the constructor providers use, since a Rust
         literal runs no validator. Anthropic's cache work now has real homes in
         `cache_read_tokens`/`cache_write_tokens`, and ollama and openai stopped reporting an
         omitted count as zero — optional counters made "one of the two is unknown" sayable.
  s13-2  HALF DONE. The types landed: LmPart with all *eleven* upstream variants (the five this
         file used to name were a summary, not the list), LmSource making one-source
         unrepresentable, and `Content` demoted from a type to a rendering rule in
         `lm/part/wire.rs`. Byte-neutrality is measured, not argued: 3.2.1's rendered image
         prompt round-trips through 3.3's own conversion unchanged, wildcard blocks included.

         What is left is the wiring, and it uncovered two gaps worth their own attention:
         (a) `adapter/blocks.rs` still yields `Vec<Value>`, so nothing constructs an LmPart yet;
         (b) no Rust caller can produce a multimodal prompt at all — nothing in the crate writes
         the `<<CUSTOM-TYPE-*-IDENTIFIER>>` sentinel that the splitter looks for, so
         `Content::Blocks` is reachable only by hand-writing one into a string value. There is
         no `dspy.Image` equivalent. That makes the whole multimodal path unexercised by any
         golden, which (c) `tests/conformance.rs` could not hold anyway: it reads turn content
         with `.as_str()` and asserts `a text-only fixture`. Widen the harness and the generator,
         add an Image case from the 3.2.1 golden captured in `lm/part/wire.rs`, and only then
         swap the splitter over — the fixture is what makes the swap provable rather than hopeful.
  s13-3  LmMessage{role, parts, name, metadata} replacing ChatTurn, and LmToolSpec.
  s13-4  LmConfig — the eight missing typed fields, the four nested configs, `extensions`, and the
         four flat aliases folded on construction. `rollout_id` moves to `cache.rollout_id` and
         widens to int-or-string, so `LmConfig::rollout` and every caller of it change.
  s13-5  LmOutput — a candidate becomes a structure. `finish_reason` and `truncated` are things a
         caller cannot currently see at all.
  s13-6  LmResponse — model, cost, response_id, provider_response, metadata; `outputs` becomes
         `Vec<LmOutput>` with at least one enforced.
  s13-7  LmRequest — model, tools, metadata; `mode` folds into `config.response_format`.

Each slice is a breaking change to a public type, so each lands on its own with the gates green
rather than as one sweep. s13-2 and s13-7 are the two that reach the adapters, and are where a
byte divergence would appear if one is going to.

Not in scope: BaseLM's own runtime, `dump_state`/`load_state` (that is s7 arriving upstream), and
`dspy.LMError` (a typed error surface, worth its own decision — this crate raises `anyhow`).
'''

