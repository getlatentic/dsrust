note = '''Absent, and its eight methods with it. It exists to let a file be indexed like a string without loading it; `from_reader` reads the whole thing instead. Measured rather than argued: 25,030 parses — five thousand generated inputs at five chunk lengths — with the wrapper as the only variable, standing it against a plain string that leaves the descriptor where it found it. No disagreement. `chunk_length` is not carried for the same reason.'''

