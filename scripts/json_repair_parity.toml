[[symbol]]
name = 'schema_repair.py::_prepare_schema_for_validation_node'
python = '(node)'
rust = 'prepare_for_validation'
note = '''Ported. It was recorded absent, on the reasoning that rewriting `items`/`additionalItems` into `prefixItems` is preparation *for jsonschema* and so the implementer's job. That was wrong on the facts: it is `json_repair`'s own code, it takes no dependency, and it runs before *every* validator call — so the schema a validator sees is never the one the caller wrote. Nor is it a difference of degree. Under 2020-12 `items` means "every item matches this schema", so a validator handed the unprepared `{"items": [...]}` reaches for `$id` on a list and raises. Python never sees that, because it prepares first.'''

