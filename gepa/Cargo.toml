[package]
name = "dsrust-gepa"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getlatentic/dsrust"
authors = ["Tosin Amuda"]
description = "A Rust reproduction of GEPA's reflective prompt-evolution engine (the gepa package dspy wraps): Pareto-front candidate selection, the evolution loop, behind an adapter trait."

[lib]
name = "gepa"

[dependencies]
pyrng = { version = "0.1.0-alpha.1", path = "../pyrng" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
