[package]
name = "dsrust"
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A faithful, byte-for-byte Rust port of DSPy: signatures, adapters, modules, providers, and optimizers, tested against DSPy itself."
readme = "../../README.md"
authors = ["Tosin Amuda"]
keywords = ["dspy", "llm", "prompt", "ai", "agents"]
categories = ["science", "api-bindings"]
exclude = ["/tests", "/examples/trajectory.rs"]
repository = "https://github.com/getlatentic/dsrust"

[lib]
name = "dsrust"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
dsrust-derive = { version = "0.1.0-alpha.1", path = "../dsrust-derive" }
gepa = { version = "0.1.0-alpha.1", path = "../dsrust-gepa", package = "dsrust-gepa" }
pyrng = { version = "0.1.0-alpha.1", path = "../pyrng" }
bytes = "1"
futures-util = { version = "0.3.33", default-features = false, features = ["alloc", "std"] }
lru = { version = "0.18.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps schemas in pydantic's insertion order; sorting keys would break byte-conformance.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.0"
# A provider call runs on a reactor: reqwest needs one, and every entry point here is async. Naming
# it makes the requirement explicit, and cargo's feature unification means a caller who writes a
# bare `tokio = "1"` still gets the `macros` and `rt-multi-thread` their `#[tokio::main]` needs.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tpe = { version = "0.1.0-alpha.1", path = "../dsrust-tpe", package = "dsrust-tpe" }
tracing = "0.1"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
