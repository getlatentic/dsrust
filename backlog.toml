[[story]]
id = "lm-retry"
sprint = "api"
title = "num_retries: dspy retries three times with backoff and this crate retries zero"
state = "done"
size = "M"
suites = ["tests/clients/test_lm.py"]
done = """
`src/lm/retry.rs`, with `LM.retry` defaulting to dspy's `num_retries=3` and `LmBuilder::num_retries`
setting it. `tests/lm_retry.rs` drives it over a real socket against a stub that refuses a fixed
number of times, because a policy that is stored and never reaches the wire looks identical to one
that works.

The oracle is not dspy — dspy has no retry code. It passes `num_retries` and
`retry_strategy="exponential_backoff_retry"` to litellm, which builds a tenacity policy, so litellm
1.93.0 and tenacity are what this was read off. Three things in there are easy to get wrong and are
reproduced deliberately: `stop_after_attempt` counts *asks*, so the default is three asks and two
retries (dspy's own docstring says "the number of times to retry", which is off by one); the wait is
`min(2^(n-1), 10)` with no jitter; and litellm overwrites the strategy dspy asked for, keeping
exponential backoff only for a rate limit and downgrading every other provider error to
`constant_retry`, whose tenacity default is no wait at all.

Two things are this crate's own and named where they happen. **Which** failures are retried comes
from dspy 3.3's `_RETRYABLE_LM_ERRORS` rather than from litellm, which retries every exception it
sees including a rejected key — `tests/lm_retry.rs` asserts a 401 is asked exactly once, and without
that case the suite would pass for a policy that retried everything. And `retry-after` is honoured.

The two questions the plan said to read upstream for, answered:

* **A retry does not vary the cache key, and a replayed failure is not a retry.** `request_cache`
  wraps the function carrying `num_retries`, so upstream's cache is outside its retry.
  `ask_provider_retrying` sits in the same place — inside the cache lookup in `LM::forward` — so a
  replayed answer is never retried and an answer a retry finally won is kept.
* **The bound is on attempts, not on total time.** `wait_exponential(max=10)` caps each wait, not
  their sum. A provider naming a large `retry-after` can therefore outlive a caller's patience, which
  is what `num_retries(1)` is for.

It also closed a defect the socket test found rather than the reading did: `LmFailure::retry_after`
and `request_id` were fields nothing ever populated. The headers were read nowhere, so a provider
saying "wait 0.25s" got the 1s curve. `src/lm/error/headers.rs` now reads dspy's
`_exception_retry_after` and `_exception_request_id` — including its four vendor spellings of a
request id — and all three providers apply them.
"""
remaining = """
Streaming is not retried. `forward_stream` bypasses the cache and the retry both, and a failure part
way through a stream is not a request that can simply be made again — the caller has already been
handed events. Upstream is in the same position and does no better.
"""
plan = """
`dspy.LM(model, num_retries=3)` is the default, and its docstring says what it covers: "retry a
request if it fails transiently due to network error, rate limiting, etc. Requests are retried with
exponential backoff." A program moving from Python loses that silently — the call fails on the
first 429 where it used to succeed on the second.

It was filed as a divergence on the reasoning that dspy delegates to litellm and this crate hands
back `LmFailure::is_retryable` instead. That describes what exists rather than justifying the gap:
`is_retryable` tells a caller a retry is safe, and then makes them write the loop.

What it needs: a bounded retry inside the LM, on exactly the four kinds `is_retryable` names,
honouring `retry_after` where the provider sent one and backing off exponentially where it did not.
Default 3, as upstream's is, and settable on the builder.

Two details worth reading upstream for rather than inventing. Whether a retry varies the cache key —
a replayed failure is not a retry. And whether the backoff is bounded in total time or only in
attempts, because a rate-limited provider can hold `retry_after` high enough that three attempts
outlive the caller's patience.

**What proves it.** Already in SUITES, and the file names `num_retries`. Triage which of its tests turn red once a
retry loop exists — that list is the specification for the loop's shape.

That triage came back empty, which is the honest answer and worth recording: every `num_retries`
assertion in `tests/clients/test_lm.py` is about the default being 3, the value reaching litellm, and
the value appearing in `dump_state()`. None of them drives a retry, because upstream has no retry to
drive. So the upstream suite cannot prove this one and `tests/lm_retry.rs` is what does.
"""

[[story]]
id = "api-4"
sprint = "api"
title = "An error's cause should be in its message, not only in its chain"
state = "done"
size = "S"
suites = ["tests/adapters/test_json_adapter.py"]
plan = """
Reported by an outside project, and it cost them a debugging cycle: `{e}` prints
"validated reply did not fit the requested type" and `{e:#}` prints ``missing field `name` ``. The
sentence a caller sees first names the category and not the cause, so the useful half is only
reachable by knowing to ask for the alternate format.

`LmFailure` was fixed this way already — `from_transport` walks `source()` and folds the chain into
the message, because reqwest's Display names the url and stops. The coercion and validation errors
want the same treatment: whatever `serde` or the signature said belongs in the message.

Audit every `anyhow::Error` this crate returns to a caller for the same shape. A context line that
categorises is worth having; one that *replaces* the cause is not.

A second shape, found running an extraction experiment against a 1B model: the reported error was
"reply has no [[ ## field ## ]] sections", which is the chat adapter's, while the wire showed the
JSON fallback had fired and it was the fallback that failed last. A caller reads the first adapter's
complaint and never learns a second was tried, which is less useful than either error alone.

**What proves it.** Upstream's adapter suites exercise the failures whose wording is wrong; none asserts the text a
caller reads. A golden of the rendered messages closes it, in the shape
`tests/exceptions_conformance.rs` already uses.
"""

done = """
Two shapes were filed. One was real, one had been fixed months ago and the record never said so,
and chasing the second found a third that nobody had filed at all.

**The cause in the message.** `crate::error::Explained` is `.context` that keeps the cause:
`{context}: {source:#}`, where `{:#}` is anyhow's own walk of the chain — the same fold
`LmFailure::from_transport` does by hand for a `reqwest::Error` whose Display names the url and
stops. The original error stays in the chain, so `downcast_ref` still finds it and a caller can
branch on a type rather than on prose. Applied at all ten sites that categorised over a cause: the
four "X response was not JSON", the three sandbox ones, the extraction ask, and
`predict/derived.rs`'s "validated reply did not fit the requested type" — the one the outside
project reported. Its unit test asserts the old `.context` behaviour beside the new one, so the
difference is the assertion rather than a claim in a comment.

**The second shape was already gone.** Filed as: the reported error is the chat adapter's while the
JSON fallback had fired and failed last. Probed rather than assumed — with the fallback on, the
surfacing error is `LM response cannot be serialized to a JSON object`, which is the JSON
adapter's. `git log -S` found why: commit `5a2cb35` (2 Aug) deleted the ad-hoc
`"reply has no [[ ## field ## ]] sections"`, and marker failures have rendered dspy's
`AdapterParseError` since. Third stale record found this way; the count is worth noticing.

**The third thing, found while writing the golden.** dspy's `TwoStepAdapter` message is
`f"Failed to parse response from the original completion: {e}"` — the *exception* — and carries the
first completion separately as `lm_response`. This crate wrote the raw reply where upstream writes
the error, so the sentence named the text and never said what was wrong with it. Fixed by raising
dspy's own `AdapterParseError` shape: `FieldMismatch` with `adapter_name = "TwoStepAdapter"`,
`lm_response = raw`, and the failure in the message.

**And that exposed a behavioural gap.** dspy's extraction is a whole `ChatAdapter()(…)` call, so it
carries that adapter's `__call__` — a reply the markers cannot read is re-asked through the JSON
adapter *against the extraction model*. This crate called `parse` directly and skipped the recovery
entirely: an extractor answering in JSON succeeds upstream and failed here. It is the same
mechanism `api-3` found missing on `XmlAdapter`, in a third place. Without it the golden could not
have been matched at all, since dspy's message names `JSONAdapter`.

**What proves it.** `scripts/generate_exceptions_fixture.py` now *runs* `TwoStepAdapter` against a
failing extraction and records what it raised, rather than constructing an `AdapterParseError` by
hand — the two things pinned are the adapter's decisions, not the exception's.
`a_failed_extraction_reports_the_failure_as_dspy_does` holds the port to it and asserts the golden's
own shape first, so a golden that stopped showing a fallback fails loudly instead of quietly
agreeing. Two controls, both run and both distinct: putting the raw reply back in the message fails
with the message naming the reply, and removing the extraction fallback fails with it naming
`ChatAdapter` where dspy names `JSONAdapter`.
"""

