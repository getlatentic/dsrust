notes = """
**The ChatAdapter half landed, and the first golden found two divergences immediately.**

`tests/conformance/parse/adapter_parse.json` records what dspy parses out of eighteen replies chosen
from `parse`'s branches rather than from what a well-behaved model emits — and which five it
refuses, since a reply the crate accepts where dspy raises reaches the caller as a wrong value
rather than an error.

  - **An indented marker.** dspy matches the header against `line.strip()` and then slices the
    *unstripped* line at that match's end, so `    [[ ## answer ## ]]` cuts four characters off what
    follows and yields `# ]]` rather than an empty rest. Upstream's off-by-the-indent, now
    reproduced — a model that indents a marker has to get the same bytes from both.
  - **Strict JSON in a structured field.** The crate left `["a", "b"]` as the text that spells it,
    on the reasoning that a structured field should be judged by the caller's own typing. That is
    true of text which only *might* be JSON and not of text which is, and dspy hands the section to
    the field's Python type, which reads it as a list. Narrowed to the unambiguous case.

A third divergence is real and needed its own story: dspy casts scalars *while parsing* and this
crate casts them during validation, which `Predict::feedback_retry` is built on. Filed as
