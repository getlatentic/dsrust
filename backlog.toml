# ---------------------------------------------------------------------------
# Backlog — triaged at sprint planning, not scheduled
# ---------------------------------------------------------------------------

[[backlog]]
id = "b1"
title = "BAML record inputs branch on the declaration, not the value"
kind = "known-divergence"
decision = "accepted"
detail = """
dspy branches on isinstance(value, BaseModel); we branch on the field's declared type. The two
agree whenever a value matches its declaration, and disagree only when a caller passes a loose
mapping to a field declared as a record. Closing it means putting per-call value provenance into
the public Adapter::format — a worse trade than the divergence. Reasoning lives at
src/adapter/baml.rs::input_value. Reopen only if a real caller hits it.
"""

[[backlog]]
id = "b2"
title = "max_rounds re-asks but nothing forces a different answer"
kind = "known-limit"
detail = """
Upstream forces divergence with lm.copy(rollout_id=round_idx, temperature=1.0). No per-call LM
override is reachable through Module::forward, so a second round re-asks identically. The loop
and its break-on-success are ported; the forcing is not. Needs a per-call LM override seam.
"""

[[backlog]]
id = "b3"
title = "Streaming, callbacks, clients"
kind = "unscoped"
detail = """
tests/streaming, tests/callback, tests/clients are untouched and unsized. Streaming in
particular may not fit the current ChatModel trait. Size before scheduling.
"""

[[backlog]]
id = "b4"
title = "Publish to crates.io"
kind = "release"
detail = """
Not blocked by scope — blocked by deciding what the 0.1 API surface promises. Adapter::format
became fallible once already; another such change after publishing is a breaking release.
"""
