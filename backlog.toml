title = "The Flex baseline and the sandbox's tool registry are answered by Python"
kind = "verification-gap"
state = "done"
detail = """
The six `tests/flex/` suites run as of 2026-08-27: 109 tests, 83 crossing into the crate, none
failing. Twelve of the twenty-six that do not cross are a gap rather than a boundary.

`test_baseline_is_predict_without_tools` and `test_baseline_is_rlm_with_tools` assert on the
generated baseline's source. The crate has `rendering::baseline_src` and no bridge function for it,
so Python answers — and the baseline is prompt bytes: a model reads the source it is asked to
improve.

The other ten assert on the sandbox's tool glue — the per-forward registry, the `dspy.Tool` wrapper
in scope for generated code, what a proposer is told about tools, what survives a save. The crate
reproduces all of it in `predict/flex/bridge.rs` and crosses none of it.

Both are named individually in conftest's `DOES_NOT_EXERCISE_RUST` rather than exempted as a
class, so closing this is deleting lines and watching the crossing count move. The precedent for
the size of the win: one `parse_module_class_name` crossing moved sixteen tests at once.

**Closed the same day, and the precedent held.** One crossing did it: `Flex._baseline_src` runs in
every `Flex.__init__`, so wiring `rendering::baseline_src` behind it moved **eleven of the twelve**
at once — the two baseline assertions and nine of the ten tool ones, which reach the registry
through a baseline that names the tools. 83 -> 94 of 109 crossing.

The crate renders the signature string itself rather than being handed upstream's, so what agrees
is the whole artifact: the `dspy.Predict` / `dspy.RLM` choice, the signature's spelling, the class
name, the `return dspy.Prediction(...)` line and the indentation between them.

Two things the wiring surfaced. A signature can name an annotation no `FieldKind` holds —
`Callable[[int], int]` is upstream's own example, and dspy renders that field into the baseline
*untyped* rather than into source that would fail to bind. A Rust caller cannot declare such a
field, so the shim falls back to dspy's own and records **no** crossing, rather than crediting
Python's answer to the crate. And the fixture guard was `startswith("upstream_test_flex")`, which
does not reach `tests/flex/test_tools.py` — it flattens to `upstream_test_tools` — so the file
holding both baseline tests was the one file the patch never applied to.

The twelfth is a boundary rather than a gap: it execs dspy's shim source and checks it against
dspy's prompt catalogue, and both are vendored here byte-for-byte and pinned by
`the_vendored_shim_is_upstreams_own` and `the_vendored_catalog_is_upstreams_own`.
"""

[[backlog]]
id = "b14"
title = "s12 was built ahead of the pin, and has no oracle at 3.2.1"
kind = "verification-gap"
state = "next"
detail = '''
`LMRequest` and `LMResponse` do not exist in dspy 3.2.1 — zero occurrences in the whole package.
Everything s12 built was modelled from a description of where upstream is going, not from source
anyone can diff against. So the request/response layer is the one part of this crate with no
conformance fixture and no upstream test, and it cannot get one while the pin is 3.2.1.

Everything byte-compared so far — adapters, `inspect_modules`, field lines, the BAML notation —
exists in 3.2.1 and was checked against it. This does not.

**Do not simply move the pin.** PyPI's latest stable is 3.2.1; the only 3.3 is `3.3.0b1`, a beta
whose API can still move before release. Benchmarking prompt bytes against a beta would make
every fixture provisional to buy verification of one layer.

The split that fits: keep **3.2.1 as the conformance pin** — it is stable, it is what users run,
and it governs every byte this crate is held to. Add **3.3.0b1 as a second reference used only
for the LM request/response shape**, so s12's field-for-field choices stop being an inference.
Two references, each answering what it is actually authoritative for.

**Confirmed from upstream, no longer inference.** The 3.3.0b1 release notes and
`dspy.ai/community/normalized-lm-api-migration/` say it directly:

  "LiteLLM imports are lazy, which keeps the core LM API less coupled to a specific provider
   bridge at import time."

and give the motive as "less OpenAI/LiteLLM-shaped logic inside adapters", with litellm's role
moving from default to compatibility fallback. Not a stated decoupling *goal*, but the direction
is upstream's own words rather than a guess.

So `b13`'s overflow map is not optional. The open-ended provider bag stops being litellm's job
and becomes the framework's — which is the position this crate has always been in, having no
litellm at all.

**The response shape we built is right.** The migration guide names `response.text`,
`response.outputs`, `response.usage`, `response.cache_hit` and `response.provider_data` — the
exact five `LmResponse` carries. One thing to check when the reference lands: upstream appears to
carry `text` *and* `outputs`, where this crate derives `text_ref()` from `outputs`.

**The timeline matches what was assumed:** 3.3 opt-in behind `dspy.context(experimental=True)`,
3.4 warnings, 3.5 typed by default, 3.6/4.0 legacy removed.

**Note on the beta.** 3.3.0b1 is the only 3.3 on PyPI and 3.2.1 is still latest stable, so the
beta has not been superseded. That strengthens keeping 3.2.1 as the byte pin rather than weakens
it — the experimental path is explicitly opt-in even in 3.3.

**What 3.3.0b1 adds, and what it means here.** From its release notes:

- **`ReActV2`** — "built around native tool calling", using `dspy.History`, `dspy.Tool` and
  `dspy.ToolCalls` in place of a trajectory string. Each turn is a structured message rather than
  "one ever-growing trajectory string", with parallel tool calls preserved by id and prior calls
  replayed as assistant/tool messages. That is a different design from our `ReAct`, not a
  revision of it — the trajectory rendering `react_trajectory.json` now pins is the *old* one,
  which is correct for the 3.2.1 pin and will not carry over.
- **`dump_state()` / `load_state()`** on the LM. That is s7's subject arriving upstream, so s7
  should be designed against 3.3 rather than invented.
- **`SandboxSerializable`** for passing richer objects (DataFrames) through RLM's sandbox — s9.
- **`dspy.LMError` classes** replacing provider-specific exceptions. This crate raises `anyhow`
  throughout; a typed error surface is a decision s11/s9 will keep bumping into.
- **Dependencies dropped: asyncer, xxhash, typeguard.** xxhash matters for `b5`: `Hasher.hash`
  was xxhash64 over pickle, and if the hash changed the seed derivation changed with it. `b5` is
  skipped on the grounds that upstream's own seed is not reproducible — recheck that at 3.3
  before treating the reasoning as still true.

None of this touches the 3.2.1 byte pin. It is the roadmap for what a second reference is for.
'''

[[backlog]]
id = "b13"
title = "Predict's **config is broader than Sampling, and carries a rule we do not implement"
kind = "known-divergence"
state = "next"
detail = '''
Claimed during the constructor audit that dspy's `**config` is covered by `with_sampling`. It is
not, on three counts. `predict.py` stores it as `self.config`, merges a per-call `config={...}`
over it, and hands the result to the adapter as `lm_kwargs` — so it is LM kwargs, but wider than
four fields.

1. **A behaviour we do not have at all.** predict.py:163

       # If temperature is unset or <=0.15, and n > 1, set temperature to 0.7 to keep randomness.
       if (temperature is None or temperature <= 0.15) and num_generations > 1:
           config["temperature"] = 0.7

   Ask for three completions at temperature 0 and dspy sends 0.7; we send what the caller set.
   Different request, different reply. This lands squarely on `Sampling::completions`, added for
   `BestOfN`, so it is reachable today.

2. **No escape hatch.** dspy forwards anything the provider takes — `top_p`, `stop`, `seed`,
   `logit_bias`, and OpenAI predicted outputs via `prediction`, which predict.py handles by name.
   `Sampling` is four fixed fields.

3. **No per-call override.** dspy's documented spelling is
   `predict(q="What is 1 + 52?", config={"rollout_id": 2, "temperature": 1.0})`. Ours is set on
   the module by `with_sampling` and cannot be varied for one call.

Item 1 is a byte divergence and should go first; it is small. Items 2 and 3 are API shape and
want deciding together, since an escape hatch and a per-call override are the same field arriving
by two routes.

**Settled by reading 3.3.0b1 rather than reasoning.** `dspy/core/types.py` defines exactly the
split this entry had proposed, so adopt its shape rather than invent one:

    class LMConfig(BaseModel):
        temperature: float | None
        max_tokens: int | None
        top_p: float | None
        stop: list[str] | None
        n: int | None
        logprobs: bool | int | None
        response_format: Any | None
        reasoning: LMReasoningConfig | None
        tool_choice: LMToolChoice | None
        cache: LMCacheConfig | None
        prompt_cache: LMPromptCacheConfig | None
        extensions: dict[str, Any]          # everything else
        model_config = ConfigDict(extra="forbid")

Eleven typed fields and one overflow map, with `extra="forbid"` so an unknown key is routed into
`extensions` by `from_kwargs` rather than landing on the model. `Sampling` is that type with four
of the eleven and no `extensions`.

And the request around it:

    class LMRequest(BaseModel):
        model: str
        messages: list[LMMessage]
        tools: list[LMToolSpec]
        config: LMConfig
        metadata: dict[str, Any]

which differs structurally from ours: `LmRequest` carries `system`/`turns`/`mode`/`sampling` and
no model, where upstream carries the model, splits tools out as their own field, and expresses
what our `OutputMode` says through `config.response_format`. **Correction:** an earlier note here said `rollout_id` is not an `LMConfig` field at 3.3 and would
arrive through `extensions`. That was wrong. `_KNOWN_CONFIG_KEYS` lists it explicitly, so it is
recognised rather than overflowed.

The two lists differ, and the difference is the interesting part. Sixteen recognised keys:

    temperature, max_tokens, top_p, stop, n, logprobs, response_format, reasoning,
    reasoning_effort, tool_choice, parallel_tool_calls, cache, rollout_id, prompt_cache,
    prompt_cache_key, extensions

Twelve declared fields:

    temperature, max_tokens, top_p, stop, n, logprobs, response_format, reasoning,
    tool_choice, cache, prompt_cache, extensions

So four recognised keys are *not* fields — `reasoning_effort`, `parallel_tool_calls`,
`rollout_id`, `prompt_cache_key`. They are input spellings folded into structured fields by the
`_normalize_*` helpers before construction, which `extra="forbid"` then requires: an unfolded key
would raise rather than attach. `reasoning_effort` demonstrably folds into `reasoning`, and
`prompt_cache_key` into `prompt_cache`.

**Unverified and worth reading before porting:** where `rollout_id` lands. `_normalize_cache_config`
is the likely home, since cache-busting is the whole of what it does — which would mean upstream
now models it as part of the cache configuration rather than as a flat sampling field, and this
crate's typed top-level `rollout_id` is placed differently. Read `_normalize_cache_config` and
`LMCacheConfig` before deciding.

**The shape, and why it is not a straight port.** Upstream's config is untyped end to end —
`**config` unannotated on `Predict`, `**kwargs` on `LM.__call__`, `{**self.kwargs, **kwargs}`
into litellm. A bag reaching the provider unchecked.

Mirroring that as `Map<String, Value>` would throw away the four fields we know and get nothing
back: the keys are provider-defined and open-ended, so no enum can close the set, but the four we
model are the ones every provider path already reads. So: keep `Sampling` typed and add an
overflow map merged into the request JSON. Typed for what we model, byte-identical for whatever
else a caller passes, and no key silently dropped — which is the failure the current fixed struct
has.

This is the one place the "use Rust properly where bytes do not force otherwise" rule points both
ways at once. The extras *do* reach bytes, so they cannot be dropped; the set cannot be
enumerated, so it cannot be fully typed. The split is the answer rather than a compromise.

**Item 1 shipped 2026-08-27.** `predict::randomness::for_completions`, held to
`predict/completion_temperature.json` — 110 pairs of model kwargs and module config recorded by
calling `_forward_preprocess` itself, 45 of which fire the rule. Faithful to the two things a
reading gets wrong: `or` is Python's, so a temperature of **0.0 is falsy** and falls through to the
model's (`temperature=0.0, n=2` under a bare model resolves to 0.7 and under a model at 0.9 sends
0.0); and the `n` chain has a third arm, `num_generations`, which has no field upstream either and
is read out of `LmConfig::extensions`. Both fields resolve *through* the model, which is why
`ChatModel::defaults` exists — dspy's `lm.kwargs`, stated so a module can read it before the
request is built. Three controls: dropping the rule, treating a zero temperature as set, and
dropping the `num_generations` arm each turn the conformance test red.

**Item 2 shipped** with the typed-LM migration: `LmConfig::extensions` is the overflow map this
entry proposed, and `LMConfig`'s eleven typed fields are ported beside it.

**Item 3 shipped the same day, which closes this entry.** `Steering::config` is an optional
`Sampling` laid over the module's — `Sampling::over`, field by field, which is what a dict merge
does for a key that is absent. It cannot express "explicitly clear this field" because
`{**self.config, **config}` cannot either: upstream has no spelling for a key that is present and
means nothing.

The **order** is the part worth testing: upstream merges and *then* asks whether to raise the
temperature, so a call asking for three completions is three however the module was configured.
`merges` in the same golden holds 180 recorded (model kwargs, module config, call config) triples,
and two controls bite — ignoring the per-call config, and applying the merge after the rule instead
of before.

`rollout_id` is in the call set on purpose: it is the one field that never reaches a provider. It
varies the cache key, which is what makes a second attempt a second call rather than a replay, and
it is the field dspy's own documented spelling of `config=` names first.
'''

