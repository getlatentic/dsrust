[[story]]
id = "parse-side-goldens"
sprint = "conformance"
title = "Nineteen fixtures pin what we send and none pin what we read"
state = "done"
progress = "All three parse goldens landed 2026-08-01, 51 cases. parse.rs survivors 35 -> 6. The differential fuzzer remains."
size = "M"
suites = []
done = """
Closed by measurement rather than by judgement: the story was opened by a mutation count and the
same run closes it. 56 cases now record what dspy's own `ChatAdapter.parse`, `JSONAdapter.parse` and
`XMLAdapter.parse` return for a reply — and which they refuse, which is 15 of them. BAML needed no
cases of its own: upstream's `BAMLAdapter` subclasses `JSONAdapter` with no `parse`, and the crate
delegates the same way.

**The four cases the survivors asked for.** Re-running the slice found seven missed and twelve
timeouts, and each one named a shape the corpus lacked. A marker whose name is not a word
(`[[ ## my-note ## ]]`) and one whose name is empty, for `split_header`'s name check. An XML tag with
an underscore in its name — Python's word class includes it, so `final_answer` opens a tag, and a
mutation reading the check as `letter != '_'` rejected exactly the names most signatures use. And a
declared field *inside* a non-word tag, which shows the scan resumes one character past the `<`
rather than swallowing what the tag wraps; the hyphenated case only showed such a tag is not itself
a field.

**The twelve timeouts were one missing guard.** Every one mutated `next_tag`, and every one made
`parse_tags` spin for the full three minutes. The loop advanced only because `next_tag` returns a
suffix of what it was given — true, and enforced by nothing. A parser reading model output is
reading input nobody wrote, and one that spins hangs the caller instead of returning a wrong value
they could notice. The loop now breaks unless the remainder actually shrank.

**Two findings the mutants surfaced that the corpus could not have.** `Adapter::name` was
unasserted, and three of five said the Rust type's name where dspy's class is `JSONAdapter`,
`XMLAdapter`, `BAMLAdapter` — the string a callback watcher reads, since upstream dispatches by type
