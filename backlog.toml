`scripts/pinned_constructors.py` asks Python instead of `ast`. Reimplementing the MRO and pydantic's
field collection in `ast` would be a second implementation of Python's own semantics, and the cases
that matter are exactly the ones it would get wrong. `assert_pinned` keeps that honest: it refuses to
answer unless the installed dspy is **byte-identical** to the submodule over every module read —
compared as bytes, not by `__version__`, which is written at build time and says nothing about the
file in front of you. The gate now runs under the venv's python for that reason.

**Two real gaps, not just labels.** `XmlAdapter` and `BamlAdapter` were unit structs, so nothing
their Python base accepts could be said. Worse than unsayable: `XMLAdapter(ChatAdapter)` inherits the
