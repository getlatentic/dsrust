# Ahead of the pin on main — see HANDOFF's "Check main, not only the pin".
# `utils/callback_context.py` is a new module on main: ACTIVE_CALL_ID moved out of callback.py, plus
# `_bind_active_call_id`, which carries the parent call id across a *thread* boundary for a
# synchronous callable.
#
# Nothing to port *here*, and the reason is a measurement rather than a preference: this crate crosses
# no thread boundary. Its only `spawn` is the deno child process (src/interpreter/deno.rs), and its
# concurrency is `buffered`/`buffer_unordered`, which poll on one task — so a `tracing` span's parent
# already reaches every point, and an instrumented future keeps it across an await (src/evaluate.rs).
#
# The narrower claim, because the broad one would be wrong: a *caller* who puts a module behind
# `tokio::spawn` — an ordinary thing for a server — does lose the linkage, and has to write
# `.in_current_span()`. tracing makes that the caller's explicit act where upstream makes it the
# library's implicit one. That is a real difference in who carries it, not an absence of the problem.

# --- ambient configuration (dspy.settings / configure / context) ---
"dsp/utils/settings.py::Settings" = { status = "divergence", rust = "context", reason = "dspy's thread-local ambient settings object. The scoped *model* is ported — `lm::context(lm).run(work)`, dspy's `with dspy.context(lm=...)`, backed by a thread-local read in preference to the process-wide one and restored when the work ends. It scopes a future rather than a block because a guard held across an await would be read by whatever the runtime polled next, which is the same reason CallId enters per poll; two interleaved scopes keeping their own model is what tests/lm_context.rs holds. The rest of the object is still explicit seams: `configure`/`settings.lm` -> lm::global::configure, `context(adapter=...)` -> Predict::adapter, `context(trace=[])` + settings.trace -> the trace passed as &mut Vec<TraceStep> through Module::forward_traced, and save/load of ambient settings not reproduced. The reason this entry used to give — that ambient state is un-idiomatic in Rust — was written before the crate had two counter-examples of its own in observe.rs and callback/context.rs" }

