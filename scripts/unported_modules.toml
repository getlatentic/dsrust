# Every dspy module the pinned submodule defines that `api_surface.py`'s PORTED_MODULES does *not*
# claim. `check_unported_modules.py` keeps the two lists exhaustive and disjoint: a module in
# neither is a gate failure, so a new upstream file cannot arrive unclassified and a ported module
# cannot be quietly listed twice.
#
# This table exists because the reason a module was out of scope used to live in a docstring
# parenthetical — "not ported (KNN, the avatar/simba optimizers)" — which no rule read and which
# went stale the day SIMBA landed. 137 public symbols sat outside every gate with no written
# justification, so the ledger's own denominator was a claim rather than a measurement.
#
# status = "backlog"       — in scope for 1.0, not ported yet. Ratcheted: the count may fall, never
#                            rise, so a new upstream module lands as backlog or as a decision.
# status = "upstream_dead" — public API that raises before doing anything in the pinned dspy, so
#                            there is no behaviour to be faithful to. `evidence` names the golden
#                            that constructed it; if upstream repairs the name, the gate goes red
#                            and the module becomes backlog again.
# status = "dead_consumer" — constructible on its own, but every module in the pinned tree that
#                            imports it is itself dead. `only_for` names them, and the gate reads
#                            the imports rather than trusting the list.
# status = "out_of_scope"  — a made decision, not a pending gap: finetuning/RL, local model
#                            serving, third-party retrieval backends, dataset downloaders, and
#                            Python-runtime plumbing with no Rust counterpart.
# status = "no_surface"    — defines no public class or function of its own. Checked, not asserted:
#                            the gate re-walks the module and fails if one appears.

[modules]

# ── no public surface of their own ────────────────────────────────────────────────────────────
"__init__.py" = { status = "no_surface", reason = "the package root: a run of star-imports that make `Predict`, `Example` and the rest reachable as `dspy.X`. Every name it lists is classified where it is defined" }
"__metadata__.py" = { status = "no_surface", reason = "assignments only — `__version__` is `3.3.0b1` here, which is the string `pins.require` matches the submodule against" }
