outcome = """
The typed-error surface dspy branches on, plus the Signature edit API and the GEPA teleprompter
config that is still thin.

Landed: ContextWindowExceeded as a named error and ReAct truncating its trajectory on it (#18/#10);
Signature append/prepend/insert (#16); GEPA auto_budget (#8).

Already true by construction, and measured rather than assumed: dspy guards `isinstance(e, LMError)`
because its `try` wraps the LM call as well as the parse. Here the call is awaited before the
fallback is consulted, so an LM error propagates and never reaches it — and ChatAdapter's `format`
cannot fail at all, so the other half of that `try` is unreachable too.

