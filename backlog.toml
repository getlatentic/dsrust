done = """
The count in the title was wrong, and wrong in the direction that mattered: not 27 unclassified but
**150 invisible**. The `[constructors]` table read 187/187 resolved while a caller could pass 337
things.

`_constructor_params` looked for a `def __init__` in the class body, so two whole kinds of
constructor were unseen. A class that **inherits** one contributes nothing — `XMLAdapter(ChatAdapter)`
defines no `__init__`, so all five of its parameters were invisible. A **pydantic model's**
constructor *is* its field list, and an annotated assignment reads as a class attribute — `Code`,
