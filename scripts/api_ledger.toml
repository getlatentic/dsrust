# Every public method of a `mapped` class, classified the same way. A class can otherwise pass the
# gate while missing half of what its Python counterpart does; this is what closes that.
#
# The existence check is looser here than for a top-level symbol: `rust` names the Rust method (or
# the free function or type that took its place) and the gate looks it up across the tree rather
# than on one type, since a method can move to a trait impl, an inherent block or a constructor.
# The classification is the load-bearing part — a recorded decision per method.

