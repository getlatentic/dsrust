"adapters/chat_adapter.py::ChatAdapter.callbacks" = { status = "divergence", reason = "dspy fires a BaseCallback at six points and all six are ported: `Callback` in src/callback.rs, fired from src/observe.rs, this adapter's format and parse included. What has no counterpart is the *per-instance list*. Upstream stores one on every Adapter through the base class and unions it with the configured ones; a Rust Adapter is a trait an implementor writes, with no shared __init__ to hold a list. So the list is per process (configure_callbacks) or per model (`LM::callbacks`), and a handler is told which adapter it is watching, which is what a per-instance list is read for here. tests/callback.rs holds the sequence to dspy's own" }
"adapters/chat_adapter.py::ChatAdapter.native_response_types" = { status = "divergence", reason = "dspy's per-adapter list of output types answered by a native provider feature rather than rendered, defaulting to [Citations, Reasoning]. Both are on that path here — adapter/native_reasoning.rs and adapter/native_citations.rs — each keyed on the model rather than on the adapter, which is where upstream keys it too: `adapt_to_native_lm_feature` is handed the lm and reads `lm.model`. What has no counterpart is the *list*, which is dspy's seam for taking a type back *off* the native path; nothing here has asked for that, and a per-adapter list with two fixed entries would be a knob with no caller. tests/citations_native.rs holds both arms of the Citations carve-out to goldens generated by running dspy" }
