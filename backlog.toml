[[sprint]]
id = "s6"
name = "Remaining optimizers"
state = "planned"
outcome = "The optimizers a real dspy user reaches for, ported on the seam s3 establishes."
rationale = """
Deliberately after s3. Porting more optimizers before their conformance story exists would
repeat the blind spot five more times.

The Optimizer trait these are written against already exists, for the same reason: five
implementations against no shared shape would have grown five bespoke ones. DynOptimizer is
what BetterTogether needs, since upstream's holds other optimizers and runs them in sequence.
"""
candidates = ["COPRO", "MIPROv2", "GEPA", "BetterTogether", "KNNFewShot"]
notes = """
The trait carries student, teacher and trainset. Upstream's Teleprompter.compile also takes
valset, which MIPROv2 uses and nothing here does yet; widening the trait is a breaking change,
so it wants doing when MIPROv2 lands and before b4 publishes an API that promises otherwise.
"""

# ---------------------------------------------------------------------------
# Backlog — triaged at sprint planning, not scheduled
# ---------------------------------------------------------------------------

[[backlog]]
id = "b1"
title = "BAML record inputs branch on the declaration, not the value"
kind = "known-divergence"
decision = "accepted"
detail = """
dspy branches on isinstance(value, BaseModel); we branch on the field's declared type. The two
agree whenever a value matches its declaration, and disagree only when a caller passes a loose
mapping to a field declared as a record. Closing it means putting per-call value provenance into
the public Adapter::format — a worse trade than the divergence. Reasoning lives at
src/adapter/baml.rs::input_value. Reopen only if a real caller hits it.
"""

[[backlog]]
id = "b2"
title = "max_rounds re-asks but nothing forces a different answer"
kind = "known-limit"
detail = """
Upstream forces divergence with lm.copy(rollout_id=round_idx, temperature=1.0). No per-call LM
override is reachable through Module::forward, so a second round re-asks identically. The loop
and its break-on-success are ported; the forcing is not. Needs a per-call LM override seam.
"""

[[backlog]]
id = "b5"
title = "A predictor traced twice for one example takes its last trace"
kind = "known-divergence"
decision = "accepted"
detail = """
When one predictor produces several traces for a single example, dspy collapses them to one demo,
choosing evenly between the last trace and a random earlier one. The choice is seeded with
Hasher.hash(tuple(demos)), which is xxhash64 over pickle.dumps — reproducing CPython pickle bytes
for dspy Example objects is not something this port can do, so src/optimize/bootstrap.rs::file
takes the last trace. That agrees with upstream whenever upstream's coin lands on the last trace.

Only reachable when a predictor is called more than once per example, which means a loop: ReAct's
per-turn predictor is the case in this crate. A pipeline whose predictors each run once never
reaches the branch, and neither does any single-predictor program.
"""

[[backlog]]
id = "b3"
title = "Streaming, callbacks, clients"
kind = "unscoped"
detail = """
tests/streaming, tests/callback, tests/clients are untouched and unsized. Streaming in
particular may not fit the current ChatModel trait. Size before scheduling.
"""

[[backlog]]
id = "b4"
title = "Publish to crates.io"
kind = "release"
detail = """
Not blocked by scope — blocked by deciding what the 0.1 API surface promises. Adapter::format
became fallible once already; another such change after publishing is a breaking release.
"""
