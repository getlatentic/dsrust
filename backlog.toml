its own async plumbing", which reads as though the async is the obstacle. It is not: Rust has
streams, and `forward_stream` already returns one. What is missing is everything above the wire.

Build the listener before the status provider. A field's chunks are what a caller actually wants,
and the adapter already knows the marker boundaries it would key on.

