[package]
name = "dsrust"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A faithful, byte-for-byte Rust port of DSPy — signatures, adapters, modules, providers, and optimizers, tested against DSPy itself."
readme = "README.md"
authors = ["Tosin Amuda"]
keywords = ["dspy", "llm", "prompt", "ai", "agents"]
categories = ["science", "api-bindings"]

[lib]
name = "dsrs"
path = "src/lib.rs"

[workspace]
members = ["derive", "bridge", "tpe", "pyrng", "gepa"]
default-members = [".", "derive", "tpe", "pyrng", "gepa"]

[dependencies]
anyhow = "1"
base64 = "0.22.1"
dsrs-derive = { version = "0.1.0", path = "derive" }
gepa = { version = "0.1.0", path = "gepa" }
pyrng = { version = "0.1.0", path = "pyrng" }
bytes = "1"
futures-util = { version = "0.3.33", default-features = false, features = ["alloc", "std"] }
lru = { version = "0.18.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps schemas in pydantic's insertion order; sorting keys would break byte-conformance.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.0"
tpe = { version = "0.1.0", path = "tpe" }
tracing = "0.1"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
