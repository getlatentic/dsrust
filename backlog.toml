position — right after the role — all along; nothing could *set* it. So this was a missing
constructor, not a missing wire path, and the story would have read as the larger thing if the wire
had not been checked first.

`a_speakers_name_reaches_the_wire` holds it, and `an_unnamed_turn_carries_no_name_key` holds the
