[[story]]
id = "bridge-answers-for-rust"
sprint = "conformance"
title = "The bridge rebuilds AdapterParseError in Python, so upstream's assertion on its text tests dspy"
state = "done"
size = "M"
suites = []
outcome = """
Closed, with the defect it was filed on demonstrated and fixed.

`rust_adapter.py` was the only site that discarded the crate's rendering. The audit found the other
five forward it verbatim, and the TwoStep wrapper matches dspy's own
`message=f"Failed to parse response from the original completion: {e}"` exactly.

**The hole was not theoretical.** Same input, `[{"reasoning": "Because."}] trailing`: dspy writes
`LM Response: {"reasoning": "Because."}` and the bridge wrote `LM Response: [{"reasoning":
"Because."}] trailing`. dspy rebinds `completion = match.group(0)` when its brace search fires; the
bridge rebuilt the message from the original reply and had no way to know. The crate's own
`FieldMismatch` carries the right one — the bridge was throwing it away.

The fix keeps the reconstruction, because dspy's callers catch `AdapterParseError` by class and read
its attributes, and replaces the rendered text with the crate's: `raised.args = (message,)`. Rust
now sends `lm_response` alongside the partial fields so the attributes are right too.

Controlled both ways, by breaking a clause in `FieldMismatch::fmt` and rebuilding:
with the fix the broken clause reaches Python; without it, it does not — dspy's formatter answers.
That is the whole finding in one line.

Gates exit 0 at 1150 tests. The upstream suite still cannot run end to end here: its API-surface
step needs `third_party/dspy`, which a worktree does not check out.
"""
plan = """
`rust_adapter.py` catches the Rust `ValueError`, pulls `message, *partial = error.args`, and
**constructs a fresh `AdapterParseError`** from `adapter_name`, `signature`, `lm_response` and
either `parsed_result` or `message`. The rendered text a caller would read is discarded at that
boundary and rebuilt by dspy's own formatter.

So `test_json_adapter_parse_raise_error_on_mismatch_fields`, which asserts that text byte for byte,
passed throughout the period when this crate's `FieldMismatch` was appending the wrong clause — it
omitted `Actual output fields parsed from the LM response: []` for an empty parse, under a comment
claiming upstream did the same. The upstream suite could not have caught it. Two independent
sessions found it by comparing refusal *messages* in a differential fuzzer instead.

This is the `conformance-harness-integrity` shape: a place where Python answers a question the Rust
was supposed to answer. The bridge has to reconstruct *something* — dspy's callers catch
`AdapterParseError` by class, and a bare `ValueError` would not be caught — but reconstructing the
**message** is what makes the assertion vacuous. Passing the rendered text through as the message,
rather than re-deriving it from parts, would let those tests read the Rust.

Audit the rest of the bridge for the same shape before changing anything: every `raise` that builds
a dspy exception from parts rather than forwarding what Rust rendered is one of these, and the count
is the finding.

**What proves it.** A control: break the clause in `FieldMismatch::fmt`, run the upstream suite, and require the
test that asserts it to go red. It stays green today.
"""

[[story]]
id = "dspy-flex"
sprint = "api"
title = "dspy 3.3.0 shipped a whole feature this port does not have"
state = "done"
size = "L"
suites = []
plan = """
`dspy.Flex` is the one module whose state is not a prompt but a **string of Python source**: GEPA
rewrites that source into decomposed predictors plus plain Python, and it runs in a sandboxed
interpreter while the predictors it builds bridge back to the host for the real model calls.
1092 lines of source, 2570 of tests.

It was excused for being marked `@experimental`. That reason does not hold — five of the six
modules carrying that decorator are ported and classified, `GEPA` among them — and
`experimental_is_not_a_line` gates it now. The real obstacle is one boundary:
`CodeInterpreter::execute` and `Tool::call` are synchronous the whole way down, `Module::forward`
is async, and the guest asks the host to run a predictor *during* a sync execute.

**What makes it tractable at all:** the guest is Python in both ports, so upstream's
`_sandbox_shim.py` is vendored verbatim rather than rewritten; and the sandbox already has a
guest-to-host RPC loop — `tool_call` in `interpreter/deno.rs` — which is exactly dspy's
`interp.tools` contract under another name. The bridge is two more host tools on that loop,
`__dspy_construct__` and `__dspy_call__`.
"""
done = """
**The deterministic half is in, byte-tested.** `predict/flex.rs`: the signature rendered back to
`in: T -> out: T2`, the baseline module built around it, the class name read out of bound source,
and upstream's shim vendored. `tests/flex_conformance.rs` holds all of it to a golden recorded by
running dspy, and all three controls bite — one space fewer in the generated body, one character of
shim drift, and a check that the comparison loop iterates over seven cases rather than none.

Two things the golden settled that a transcription would have got wrong: every signature built from
a string is called `StringSignature`, so the generated class is `StringSignatureModule` whatever the
fields are; and upstream's branch for a signature with no instructions is **unreachable**, because
dspy writes default instructions for one.

**The bridge landed too, and it runs.** `predict/flex/bridge.rs`: a `Flex` executes its baseline
Python in a real Pyodide sandbox, the generated code builds a `dspy.Predict` that crosses back as
`__dspy_construct__`, calling it crosses back as `__dspy_call__` and reaches a model here, and the
prediction comes home as JSON. `a_flex_runs_its_baseline_through_the_sandbox` drives the whole
crossing, ignored by default as the other deno tests are.

The boundary is what made this the deferred piece: `CodeInterpreter::execute` and `Tool::call` are
synchronous the whole way down and `Module::forward` is not. The interpreter runs on **its own
thread** and the two host tools post their questions to the asynchronous side over futures channels
— a `std::thread` rather than `spawn_blocking`, because this crate takes tokio for `time` alone and
stays runtime-neutral. The question channel closing when the thread drops its tools is what ends the
loop, so a thread that panicked ends it exactly as one that returned does. This crate now spawns a
thread, which moves the fact recorded in the `callback_context` ledger comment.

Both controls bite, and the decisive one is that changing what the *model* answers changes what
emerges from the sandbox: `Lyon` arrives as `{"answer": "Lyon"}`, so the value really travels guest
to host to model and back rather than the test agreeing with itself.

The first run failed with `__dspy_construct__() got an unexpected keyword argument 'kind'`.
`Tool::args` is dspy's argument *map*, and an empty one made the sandbox write a `def` taking
nothing. The wire named the gap exactly, which is the only reason it was not a hunt through the shim.

**Closed since:** the budget, all seven bridgeable kinds, and the saved state.

`max_predictor_calls` counts on the *call* rather than the construction, as upstream counts it —
building a hundred predictors is free and calling one a hundred times is not. Source that loops five
times against a budget of two is refused by name; raising the budget stops the refusal.

All seven kinds bridge now. The code-executing three take the `Flex`'s own interpreter factory, so
the inner sandbox is the backend chosen for the Flex. Tools cross as `{"__dspy_tool__": name}`
markers and resolve by name against what the `Flex` was given; a name it was not given is refused
*naming it*, rather than building a toolless agent.

**`dump_state`/`load_state` was not a wait — it was a defect.** This entry used to say they were
"waiting on the bridge". Running dspy over a program holding one `Predict` and one `Flex` writes two
shapes into one map: `{traces, train, demos, signature, lm}` under one key and `{module_src, lm}`
under the other. `ProgramState` was `BTreeMap<String, PredictorState>` and could not read its own
file back once a Flex was in it. It holds a `SubmoduleState` now, and the test reads dspy's own
output rather than a shape agreed with itself.

That change carried a trap worth recording. Both `FlexState` fields are optional, so the untagged
read matched **any** object: a predictor entry that had lost its signature deserialised as
`FlexState { module_src: None }` instead of failing, which is a corrupt saved program loading
quietly. `deny_unknown_fields` is what makes the discrimination honest, the probe that found it is a
test, and the control confirms it goes red without it.

Three sandbox tests raced on the process-wide model. Fixed by scoping per test rather than locking —
narrower than the race, and the per-poll scope reaches across the bridge thread because the predictor
runs on the asynchronous side.

**The GEPA integration is started, byte-critical piece first.** `CodeProposalSignature` is the
prompt that makes a `Flex` optimizable at all — five inputs and ~2,900 characters asking a model for
a whole `dspy.Module` subclass instead of an instruction — and it is held to
`tests/conformance/code_proposal.json` beside MIPROv2's proposers. Said plainly in its own doc
comment: it was **generated from that fixture rather than typed**, so the test is a drift catcher for
when the pin moves, not an independent derivation.

`propose_code` wires it, with `format_failures` and `strip_code_fences` under it. Both had a trap the
golden caught: the failure records go through Python's `repr`, not JSON — `{'question': 'Where?'}`,
which `python_literal` already existed for after this crate shipped the JSON version once — and a tab
advances to the next multiple of four *within its line*, not four spaces.

**A control that did not bite was worth more than the test.** Every tab in the first fixture sat at a
column already divisible by four, so `expandtabs(4)` and a naive `replace` agreed on all of them.
Cases at columns 1–4 discriminate now: `a\tb` is three spaces, `abcd\te` is four.

**And a shortcut with a side effect.** Sharing two five-line constructors with MIPROv2's proposers
meant opening `optimize::mipro` to `pub(crate)`, and the Rust-surface gate reported **34 items no
longer exposed** — all of MIPROv2's method surface. The type stayed nameable and `public_api` passed;
what changed was what rustdoc documents. Reverted, helpers spelled locally, reason left where the next
person reaches for the same shortcut.

`cargo doc` failed this work twice, both times on things `build` and `test` passed: a link left at an
item's old home, and then a *public* function linking a *private* item — which is an API
inconsistency rather than a broken link, and is why `code_proposal` is public now.

**The structural one is closed, as a model change rather than a special case.**
`Module::named_flexes` is a *second* walk beside `named_predictors`, not a wider one — a predictor's
optimizable component is its instruction and a `Flex`'s is its source, and GEPA rewrites them with
different proposers. Upstream reaches both through `named_parameters` and asks `isinstance` which it
got; a Rust walk answers by returning from a different method. `rebind_flex_code` and
`flex_components` are the write and read halves.

The test is a `Flex` **nested inside a program**, deliberately: a bare one would pass while proving
nothing, since the point is that the walk recurses where `named_predictors` cannot. The control
stops the `Flex` reporting itself and the walk comes back empty.

**`flex_task_context` is closed**, and it rests on two renderings with edges a reading would have
missed. A field description is skipped when it is dspy's own `${field}` placeholder — and a signature
parsed here carries an empty string instead, so *both* spellings of "nobody said" have to be skipped
or `${context}` reaches the prompt. A tool's blurb is the **first line** of its description,
stripped, so a second line never reaches the model and a tool with nothing to say keeps its trailing
space. Both controls bite.

**The file-size gate forced a split that was overdue**, and it landed on two real seams.
`flex.rs` is what a `Flex` *is* and `rendering.rs` is what it *says* — three of those renderings go to
different readers and are not interchangeable. `bridge.rs` is the *crossing* and `built.rs` is *what
is being asked for*: a new predictor kind lands in one, a change to how the sandbox is driven in the
other. `bridge.rs` was at 399 of 400 and was split before the next line forced it.

Moving `Built` across that seam wanted five `pub(super)` fields, which would have leaked the struct
through the boundary just drawn; `Built::new` keeps it one call wide.

Three gates caught something in that one split: the size check forced it, the compiler caught the
field leak, and the API surface caught four ledger rows still naming `flex::class_name_of` and
`bridge::fields_of` after the move.

**Nothing is left.** `code_reflective_records`, `evaluate_with_trace`, and the loop that ties them
together are in, and the API gate prints no `todo` rows for `gepa_flex_utils.py` at all.

**Writing the end-to-end test found three defects, each hiding the next.** The seed candidate was
built from `named_predictors()` alone, so a code component never entered the search and a program
made *only* of a `Flex` reached the engine with nothing to round-robin over and **divided by zero**.
`propose_new_texts` looked every component up in `named_predictors`, so a Flex fell out of the map
and nothing proposed for it. And `set_instructions` wrote instructions only, so a better module could
be proposed, scored and accepted while the program kept the one it started with. A program with no
components is refused by name now rather than panicking.

The test had to be written so the program answers from *its own current source*; the first version
returned a constant, so the proposal scored as the seed did and GEPA rightly rejected it — it would
have passed on a search that accepted nothing.

**A control that did not bite deleted code.** A filter kept code components out of the predicate
path; the control showed it inert, because a Flex has no signature and drops out of the `filter_map`
already. The filter was never the fix — the branch was.

**Three shortcuts of mine, found by asking rather than by a gate.** `python_repr` escaped only
backslashes and quotes where Python's escapes control characters, so a signature with a **multi-line
docstring** generated a literal newline inside a single-quoted string — unterminated, unparseable.
`is_identifier` refused `x` plus a combining acute, which Python accepts, so a tool name dspy allows
could not be registered. And the derive stripped one leading space per doc-comment line where dspy
runs `inspect.cleandoc`, which parts company three ways of nine — a uniformly indented comment, a
flush first line, and a tab — each a different string in front of the model.

All three were written by *describing* what Python does instead of running it. The pattern held: the
helpers built from measured output were right, the ones built from a description were about half
wrong, and a golden only caught it where a case sat on the edge.

**And a doc comment that named a test which did not exist** — `PRIMITIVES_CATALOG` claimed to be held
to the pin by `the_vendored_catalog_is_upstreams_own`. Writing it exposed a second problem: the
golden key had been added by a one-off script and the next run of the real generator silently dropped
it. A golden written outside its generator does not survive regeneration.
"""

[[story]]
id = "resource-loading-suite"
sprint = "api"
title = "3.3.0's resource-loading tests read image and audio off disk, and nothing runs them"
state = "done"
size = "S"
suites = ""
plan = """
`tests/adapters/test_resource_loading.py` is new in 3.3.0 and excused by name rather than run. It
loads images and audio from disk and through pydantic's `TypeAdapter`, which is a path this crate
has — `dsrust::Image`, `dsrust::Audio` — so this is wiring rather than porting.

Small, and worth doing before the next pin: an excused file that *could* run is the kind of excuse
that quietly becomes permanent.
"""
measured = """
2026-08-05, at the 3.3.0 pin: 18 upstream failures — `upstream_test_adapter_image.py` 10,
`upstream_test_types.py` 4, `upstream_test_adapter_file.py` 4 — from the same change. 3.3.0 made
`Image`'s source positional-only and requires `from_path`/`from_url` rather than inferring a path,
so the suite exercises constructors this crate does not have. Bigger than "wiring", and it is the
whole of the red outside the interpreter modules and the LM wire.
"""
outcome = """
2026-08-05. Not wiring, and the story's premise did not survive reading the file: all thirty cases
drive dspy's own `Image`/`Audio`/`File` constructors, its `from_path`/`from_url` factories, its
deprecation warnings and `requests`. Not one renders or parses. Running it would add thirty passing
tests every one of which needs a "does not exercise Rust" line — a count without conformance, and
thirty more declarations to get wrong.

So the excuse in `check_coverage.py` now says *why* rather than "not yet wired", and what the suite
is **about** is held where the rules live:

  - **The posture.** A constructor is reachable from application input, so `Image::new` and
    `Audio::new` keep a locator and dereference nothing — `/etc/passwd` stays a string. Their own
    tests say so, so a later constructor that reads a path fails a test rather than a review.
  - **The factories.** `Image::from_path`, `Audio::from_path`, `File::from_path` and
    `File::from_path_as`, each measured against dspy's bytes for the same file. Audio refuses a
    non-audio suffix as upstream does, because `format` reaches the provider.

Reading it turned up a divergence nothing covered. The media type came from a **third** hand-written
copy of `mimetypes.guess_type` — `legacy.rs` had a document-only one, `wire.rs` an image/audio one —
and `wire.rs` called a `.wav` `audio/wav` where CPython says `audio/x-wav`, so a path-sourced audio
block went out under a media type dspy does not write. One table now, in `src/mimetypes.rs`,
generated from the interpreter.

**And the table cannot simply be "what dspy answers".** `mimetypes.guess_type` calls `init()`, which
merges `/etc/mime.types` over CPython's shipped table: on this machine six suffixes came back
differently (`.flac`, `.m4a`, `.ogg` absent from the built-in table; `.aac`, `.opus`, `.xml`
disagreeing). Recording dspy's answer would bake one host into a golden every other host fails, so
the generator records the *built-in* answer and asserts it, writing the disagreements down as
disagreements. A caller meeting one is meeting upstream's host-dependence rather than a divergence
here.
"""

[[story]]
id = "interpreter-per-call"
sprint = "api"
title = "3.3.0 builds a sandbox per forward pass, and this crate holds one for the module's life"
state = "done"
size = "M"
suites = ""
plan = """
`CodeAct`, `ProgramOfThought` and `RLM` all replaced `interpreter` with `interpreter_factory` in
3.3.0 — a zero-argument callable, invoked per forward pass, with dspy shutting down each interpreter
it returns. Its own docstring says the callable "may be invoked concurrently".

`pin-drift` predicted this from the main-branch diff and the bump confirmed it: all three generators
raised `TypeError: got an unexpected keyword argument 'interpreter'` at 3.3.0, which is how it
surfaced. The generators now pass the factory and the goldens are regenerated, so nothing here is
red — the prompts did not move. What moved is the *lifecycle*, which no golden sees.

**Why it is not a rename.** `Rlm::interpreter(signature, Arc<dyn CodeInterpreter>)` takes one
interpreter and keeps it, and `DenoInterpreter` holds a live child process behind that `Arc`. A
factory means creating and tearing that process down per call, concurrently — so the work is the
process lifecycle and its shutdown, not the parameter.

**Beside it, and the same three modules.** `primitives/code_interpreter.py` gained
`CodeExecutionError`, a typed error for a sandbox that refused the code. This crate answers with an
`anyhow::Error` carrying the sandbox's own message; a typed counterpart is the decision `LmFailure`
already made for provider failures, and it belongs in this change rather than after it.

**What proves it.** A test that runs two forward passes and asserts the second did not reuse the
first's interpreter, plus one that runs them concurrently. Neither exists, because neither could
until there was a factory to observe.
"""
measured = """
2026-08-05, at the 3.3.0 pin: this is what holds the upstream suite red. 241 of ~281 failures are
these three modules and their interpreter — `upstream_test_python_interpreter.py` 104,
`upstream_test_rlm.py` 95, `upstream_test_code_act.py` 23,
`upstream_test_program_of_thought.py` 19.

Three shapes inside that:
  - 88 are `fixture 'pooled_interpreter' not found` and `configure_pooled_interpreter` — conftest
    fixtures new in 3.3.0 that the bridge does not provide, because pooling is what a per-call
    factory makes possible;
  - ~41 are `RustRLM.forward() takes 1 positional argument but 2 were given` and
    `'RustCodeAct' object has no attribute 'interpreter'` — the bridge's shims still expose the
    3.3.0b1 shape;
  - the rest follow from those two.
"""
outcome = """
2026-08-05. Done, and the upstream suite is green at the 3.3.0 pin: 1035 passed, 0 failed, 0
errors — from 897/48/233 when the pin moved. 569 of 1039 cross into the crate, 583 decide a
signature there. Rust 1209.

The lifecycle is `interpreter/lease.rs`: a caller who hands one in keeps it, a factory-built one is
shut down by `Drop`, so an early `?` releases the process exactly as a clean return does.
`InterpreterFailure` splits dspy 3.3.0's `CodeExecutionError` (recoverable, fed back to the model)
from a bare `CodeInterpreterError` (terminal, ends the run), and a terminal failure that began as a
Python exception is re-raised *as that exception* — upstream catches two classes and lets
everything else through untouched, so a `ValueError` an interpreter raised is a `ValueError` to the
caller.

**What the last stretch was actually about, and it was not the lifecycle.** Closing the final
failures meant auditing the 45 "does not exercise Rust" declarations rather than writing them, and
nine were wrong in the same direction: the crate had the primitive, the test drove it, and nothing
routed it. What that turned up, in order of how much it mattered:

  - `ChainOfThought` is a `Module` that *holds* a `Predict` rather than subclassing it, so
    `_PredictorAsLM`'s `isinstance(..., dspy.Predict)` sent every PoT and CodeAct stage down the
    stub path. Python rendered the ask — with no inputs at all, dspy logging `Missing: ['question']`
    — and the crate's render was built and discarded. Every one of those tests passed, because
    `DummyLM` answers whatever it is shown.
  - Every string injected into the sandbox was double-quoted, because `variables.rs` held a fourth
    copy of `repr` that printed through `serde_json`. Folding it into `python.rs` exposed that
    `python::quoted` never escaped control characters — cosmetic in a prompt, an unterminated
    string in *source*.
  - The crate had no `_close_object_schemas`, so a nullable field's object branch went out open.
    The only test that looked asserted our own answer, and the golden beside it carries no
    `response_format` at all.
  - A Responses tool call carries `id` for the item and `call_id` for the call; we replayed `id`.
  - `arguments_parse_error` was missing beside `raw_arguments` in both dialects.
  - `restrict` naming no seed returned no attempts and an unchanged student where dspy raises.
  - `RustRLM` overrode `forward` and not `aforward`, so every async case ran dspy's second loop
    while the declaration said the crate is async throughout.

**The principle to keep.** Fidelity is owed at the bytes the model reads and at the logic that
reads its reply — not at the internal type representation. Rust primitives are the right carrier as
long as the rendered string and the parse are identical. The non-finite float is the worked
example: `serde_json::Value` cannot hold `inf`, so it crosses as a one-key object and
`variables.rs` rebuilds the `float('inf')` dspy would have written.
"""

