    public export and drives the whole batching walk. `without_label`'s four hangs were cursor
    arithmetic, rewritten as `take_while` runs.
  - `random_search.rs` 8, `gepa/metric.rs` 6, `ensemble.rs` 5, `mipro/mod.rs` 3,
    `copro/candidates.rs` 3, `better_together.rs` 3, and eight singletons — **open**.

The lesson the two triaged clusters carry: a function that needs a model is not a function that
cannot be tested, and thirty-seven mutants lived behind that assumption in one file pair.
"""
outcome = """
2026-08-07. The gaps this story named are closed: `signature`, all three provider wires and
`optimize` are measured and ratcheted at 0:0, scoped by file the way the adapter slice was. See
`can-the-suite-fail` for what the six runs found.

`dsrust-tpe:1` and `pyrng:7` were the last two predating the methodology fix. Re-measured
2026-08-07: **both reproduced exactly** — 151 mutants / 1 missed and 203 / 7 missed, no hangs on
either. Worth the twenty minutes precisely because the answer was not knowable in advance; the
campaign had twice found a level number hiding a completely changed survivor set. Every one of the
eight is a reasoned equivalent carrying its note in the source, and pyrng's three former hangs are
gone with the halving loops they lived in. That is what `dsrust` whole would need too: 3619 mutants at roughly half a minute
each, which is why it stays scoped by slice rather than run entire.
"""

