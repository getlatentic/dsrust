prose — and **fourteen passed on the first run**. The one real gap was the same strict-JSON reading
the marker path had: `parse_tags` inserted the body as a raw string rather than through
`section_value`, so a `list[str]` written as `["a", "b"]` came back as the text that spells it.

That is worth separating from the survivor count. Twenty of the thirty-five were in `next_tag`, but
most were *non-terminating* — flipping a `+` to a `-` in a cursor makes the scan loop forever, which
the suite detects by hanging rather than by failing. The scanner was largely right; what it lacked
was anything that would fail rather than hang.

**Measured after: 35 survivors down to 6 missed** (with 24 non-terminating). The 34-case golden is
what closed them.

**The JSON half landed, and it was the one with real divergences in it.** Seventeen cases from
`json_repair.loads` followed by a recursive brace regex: an object buried in prose or a fence, a
nested object, an array holding one, a trailing comma, single quotes, unquoted keys, a missing brace,
Python's literals. Three genuine differences, all fixed:

  - **A `str` field handed an object** came back as JSON. dspy's `parse_value(v, str)` is Python's
    `str()`, so it is `{'why': 'Because.'}` — single quotes, `None`, `True`. The `python::repr`
    written for the dataset summary turned out to be exactly what this needed.
  - **A top-level array was accepted as an answer.** dspy asks `isinstance(fields, dict)` and falls
    through to the brace search when it is not, so `[{"answer": "Paris"}]` reaches the object inside.
    The crate took the array and then failed on it.
  - **A structured field handed the text that spells it** stayed text. The JSON path now uses the
    full `coerce` rather than `coerce_scalars`, which the other two paths cannot: they receive every
    field as text and cannot tell JSON from a type's own spelling, where a JSON reply has already
    told them apart.

One divergence recorded rather than closed: `json_repair` recovers an unescaped quote inside a
string and this crate's repair does not. Matching json_repair in full is a library, not a fix.

**The differential fuzzer landed too, and its first run answered the question the goldens could not.**
`scripts/fuzz_parse.py` generates seeded random replies — mangled markers, malformed tags, broken
JSON — runs all three of dspy's parsers over them and records the answers; `parse_fuzz.rs` replays
them through the crate and groups every disagreement by adapter and direction. The corpus is a
campaign artifact under `target/`, not a committed golden: ten thousand random strings are evidence,
not documentation.

Two thousand replies, and the result is remarkably clean: **226 disagreements, all of them
`[json] dspy parsed, we refused`**. Zero for the marker parser, zero for the tag parser, and zero in
the direction that would hand a caller a wrong value. That is what turned the `json_repair` question
from "should we?" into a scoped story with a measurement attached — see `json-repair-port`.

The rule the test enforces is that category and nothing else, rather than "no disagreements", because
a blanket assertion against a known gap either blocks every run or gets switched off.

**And the fuzzer's own control found a hole in the fuzzer.** Breaking first-occurrence-wins in the
marker parser on purpose left it green — `rng.sample` draws without replacement, so no generated
reply ever named a field twice and the rule went untested. With repeats allowed the same break
produces four disagreements outside the known gap. A fuzzer that has never been shown to fail is
worth as much as a golden that has never been shown to fail.
"""

[[story]]
id = "parse-time-casting"
sprint = "conformance"
title = "dspy casts a scalar while parsing; this crate casts it during validation, and one feature rests on that"
state = "done"
size = "M"
suites = []
plan = """
Found by the first parse-side golden, 2026-08-01. `ChatAdapter.parse` runs every section through
`parse_value(v, annotation)` and raises `AdapterParseError` when a value will not fit its declared
type. So upstream:

  - a good `int` field comes back as `7`, not `"7"`;
  - `score: int` answered `very high` is a **parse** failure;
  - and `ChatAdapter.__call__` answers *any* exception by re-asking through `JSONAdapter`, so a bad
    number switches adapters.

Here the cast happens during validation instead. That is not an oversight — `Predict::feedback_retry`
is built on it, and re-asks on the *same* adapter carrying `amount must be a number, got "abc"`,
which upstream has no equivalent of. `a_type_error_rides_the_feedback_retry_not_the_adapter_fallback`
states that intent in its name.

Calling `coerce_scalars` at the end of `parse_markers` makes the parse side match dspy exactly and
takes the feedback retry with it — measured, it turns that test red. The two cannot both stand, so
this needs deciding rather than patching: either the crate follows dspy's routing and
`feedback_retry` becomes something layered above the adapter fallback rather than instead of it, or
it keeps its own routing and the divergence is declared at the top level rather than in a parse
function.

**What holds it meanwhile.** `tests/conformance/parse/adapter_parse.json` marks the three affected
cases `diverges`, and `adapter_parse.rs` asserts them *the other way round* — `assert_ne!` on the value
and `assert!(ours.is_ok())` on the refusals — with a count check. So the day this is resolved the
test goes red and says which flag to drop. It cannot be closed by accident or forgotten.

Note that `parse_tags` (XML) already casts at parse. The two paths disagreed with each other before
they disagreed with dspy.
"""
outcome = """
Closed 2026-08-24. **The two could both stand**, which the story had ruled out — because the thing
that made them look exclusive was the *carrier*, not the timing.

dspy raises `AdapterParseError` for a missing field **and** for an uncastable one; the golden records
exactly that for `typed_field_that_will_not_parse`. So both refusals are a `FieldMismatch` here, the
cast's own complaint riding in `message` and the partial fields riding in `parsed`. `parse_markers`
calls `coerce_scalars` at the end, as the comment sitting there had said to.

Nothing in the routing had to move. `validate.rs` already answered a parse failure by falling back
to `JSONAdapter` — dspy's routing — and already carried a `FieldMismatch` partial forward when a
caller asked for the feedback ask. A cast failure now arrives through that same door, so:

  - by default a bad number switches adapters, as upstream's does;
  - with `Predict::feedback_retry` on, it re-asks on the same adapter carrying
    `amount must be a number, got "abc"` — and
    `a_type_error_rides_the_feedback_retry_not_the_adapter_fallback` passed untouched, which is what
    says the feature survived rather than being argued about.

`feedback_retry` was off by default all along and its doc already declared itself as the crate's own
ask, so the divergence the story asked to declare "at the top level" was already declared where a
caller meets it.

**The holding mechanism worked exactly as built.** Flipping the cast turned one test red —
`the_parser_reads_what_dspys_reads_and_refuses_what_dspy_refuses` — which asserted the three cases
the *other* way round and named the flag to drop. Dropping it turned the count assertion red in
turn, which asks that a fixed divergence be said out loud. Recorded divergences in the parse golden:
**3 -> 0.**

And `parse_tags` (XML) had cast at parse all along, so the two paths agree with each other now as
well as with dspy.
"""

