# Source of truth for what dsrs is building and in what order.
#
# A sprint ships a usable increment, not a layer. A story is done when its acceptance
# criteria hold under the five gates in HANDOFF.md — including the upstream suite, which
# only runs in the main checkout.
#
# Sprints run in the order they appear, not by id. An id is a stable reference and is never
# renumbered, so a sprint added later can sit anywhere in the order.
#
# The order is a dependency chain, and reads as one sentence: declare a task, build the modules
# that run it, score what they produce, improve it, save the improvement, then let a program look
# something up before it answers. Each sprint needs the one before it to have something to work
# on — an optimizer needs modules to optimize and a score to optimize against, and saving needs
# something worth saving.
#
# Stories carry the upstream test files that prove them. "Add a suite" means adding the
# file to SUITES in scripts/run_upstream_tests.sh and triaging the failures it arrives
# with. A story is not done because its suite is green; it is done when the suite is green
# AND its tests cross into Rust — the runner prints that count.
#
# This file is the plan; SUITES is what runs. scripts/check_plan.py holds one to the other on
# every upstream run, so a sprint cannot be marked done naming a suite nothing executes. A
# `suites` entry naming a group rather than a file ("signatures/* (4 files)") reads as intent
# and is not checked.

[project]
name = "dsrs"
upstream = "dspy"
upstream_version = "3.3.0b1"
updated = "2026-07-28"

# Generated from the runs themselves, so a number here cannot part company with the evidence for
# it: scripts/record_status.py writes what the upstream suite reported, scripts/record_rust_tests.py
# what `cargo test` did, and scripts/status.py renders HANDOFF.md's table from the merged block
# rather than letting it hold a second copy. Editing one of these by hand makes it wrong until the
# next run, which is the point — `rust_tests` was the one field no run wrote, and it drifted 48
# behind while every generated number beside it stayed true.
[status]
rust_tests = 1052
upstream_tests_passing = 897
upstream_tests_crossing = 479
upstream_tests_deciding_signatures = 529
# Gaps this port has declared, counted from conftest.py's NOT_YET_IMPLEMENTED. Not the same as the
# xfails pytest reports: dspy marks two of its own image cases xfail for a gap upstream has.
xfail_backlog = 5
upstream_tests_xfailed = 7
suites_run = 52
release_stage = "alpha"

