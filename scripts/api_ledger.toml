# The API-surface ledger: every public symbol dspy defines in a ported module (see
# `api_surface.py`'s PORTED_MODULES) classified against this crate. `check_api_surface.py` keeps it
# honest — it fails if dspy defines a symbol absent here (triage it), if an entry names a symbol
# dspy no longer defines (delete it), or if a `mapped` entry's Rust identifier is nowhere in the
# tree (a mapping that rotted).
#
# status = "mapped"     — a Rust counterpart exists; `rust` is an identifier the gate greps for.
# status = "divergence" — intended: no 1:1 symbol, and `reason` says why (Python-only machinery,
#                         an internal helper folded into another file, or a different Rust shape
#                         such as an enum variant). Counts as resolved.
# status = "todo"       — a genuine gap, in scope for 1.0: dspy has public API this crate has not
#                         ported yet. `reason` names it. Tracked and counted, does not fail the
#                         gate — this is the 1.0 API backlog.
# status = "deferred"   — public API deliberately out of the 1.0 ceiling (finetuning/RL), a made
#                         decision rather than a pending gap. Counts as resolved-for-1.0, reported
#                         apart from todo so the 1.0 backlog is only in-scope work.
#
# Both top-level symbols and the methods of every mapped class are gated; the `[methods]` table
# below carries the second.

