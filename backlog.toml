[[backlog]]
id = "b10"
title = "Refine: the feedback half of s11"
kind = "scoped"
state = "next"
detail = """
`BestOfN` shipped; `Refine` is the other half and is not a small mirror of it. Five pieces, and
the rollout loop is only the first.

1. **The loop.** Same as `BestOfN` — n attempts at `Sampling::rollout(i)`, keep the best, same
   index-against-budget failure rule. One difference that is upstream's: `threshold` is
   *nullable* here (`if self.threshold is not None and reward >= self.threshold`) where
   `BestOfN` compares unguarded. So `Option<f64>`, required positionally.

2. **`OfferFeedback`**, a signature of nine inputs — program_code, modules_defn, program_inputs,
   program_trajectory, program_outputs, reward_code, target_threshold, reward_value, module_names
   — answering with `discussion` and `advice: dict[str, str]`, keyed by module name.

3. **`inspect_modules`**, byte-sensitive prompt text. Oracle captured from dspy 3.2.1 for
   `ChainOfThought("question -> answer")`:

   `--------` (80) `\nModule predict\n\tInput Fields:\n\t\t1. \`question\` (str):\n\tOutput
   Fields:\n\t\t1. \`reasoning\` (str): \n\t\t2. \`answer\` (str):\n\tOriginal Instructions:
   \n\t\tGiven the fields \`question\`, produce the fields \`answer\`.\n` + 80 dashes

   Note the trailing space after `(str):` on `reasoning` but *not* on `answer` or `question`:
   `get_field_description_string` strips the block as a whole, so only the last field of each
   group loses it. Reason about this from the oracle, never from the code.
   `adapter::prompt::numbered_input_lines`/`numbered_output_lines` already render these lines and
   need widening from `pub(super)` to reach a module outside `adapter`.

4. **The trajectory as JSON**, upstream's `recursive_mask` + `orjson.dumps(option=OPT_INDENT_2)`.

5. **Injecting the advice**, and this is the open design question. dspy subclasses the live
   adapter per attempt, appends a `hint_` InputField to the signature and sets its value from
   `advice[module_name]` — so each predictor gets *its own* hint. Here `NamedPredictor` reaches a
   predictor's signature and demos but not its adapter, and one `Example` carries one value for
   every predictor. Options: widen `NamedPredictor` with the adapter, or give it a
   `hint: &mut Option<String>` that `Predict` renders as an extra input. The second is smaller and
   keeps the adapter seam closed; decide before writing the loop.

`inspect.getsource` is settled: `#[derive(Module)]` captures the struct's own tokens for
`program_code`, and the reward function's description is caller-supplied because a Rust closure
has no recoverable source. Both are prose in a prompt — nothing parses or runs them, which is what
separates this from s9's sandbox.

Same standard as `BestOfN`: `Module` + `Ask` + crate-root export + a `refine!` macro naming the
arguments, since dspy passes all five by keyword.
"""

[[backlog]]
id = "b9"
title = "The derive put a field's own name on every undescribed field line"
kind = "known-divergence"
state = "done"
closed = "2026-07-21"
detail = """
`1. `recipient` (Recipient): recipient` where dspy writes `1. `recipient` (Recipient):`.

dspy stores the sentinel `${name}` as an undescribed field's `desc` and then drops it again when
rendering — `adapters/utils.py::get_field_description_string` compares against that exact string
and substitutes `""`. So the name is a placeholder that never reaches a prompt. The derive read
half of that and substituted the bare name, which then rendered.

Invisible to every gate. A conformance fixture builds its `Signature` from JSON with `desc: null`,
so the fixture path was always right; only the *derive* path was wrong, and nothing rendered a
derived signature and compared it to dspy. Found by diffing a whole system message against dspy's
for the equivalent pydantic signature — which is the check HANDOFF already tells you to run and
which no test performs.
"""

[[backlog]]
id = "b8"
title = "A Rust type reached BAML as the bare word `json`"
kind = "known-divergence"
state = "done"
closed = "2026-07-21"
detail = """
BAML states a type instead of a schema of it, which is the whole reason to choose that adapter.
It reads `JsonType::reflection`, a tree dspy builds by walking a pydantic annotation at run time —
and the derive left it `None` for every Rust type, because Rust has no annotation to walk. So a
Rust-declared signature rendered `Output field `ideas` should be of type: json`, and the field
line read `(json)` where dspy prints `(list[GiftIdea])`. The adapter only produced a good prompt
through the bridge, where Python supplies the tree.

Closed by reading the shape off the one description of a Rust type that already exists: the
`schemars` schema every output field is required to have. `src/signature/reflect.rs` converts a
JSON schema into the same tree `bridge/python/reflect.py` produces, and the derive emits it. No
new bound and no `#[BamlType]`-style annotation — which is what the other Rust port
(krypticmouse/DSRs) requires, and worth knowing about when comparing.

Only outputs carry it. `output_type` takes an `OutField`, and requiring `JsonSchema` of every
*input* type would be a bound no caller owes today.

`derive/src/annotate.rs` supplies the other half, the annotation itself: `list[Gift]`,
`dict[str, int]`, `Union[str, NoneType]`. Every spelling was read off dspy 3.2.1 rather than
guessed — `Optional[str]` prints as `Union[str, NoneType]`, which is neither spelling a reader
would reach for.

Verified by diffing the rendered block against dspy's for the equivalent pydantic signature:
byte-identical. Pinned by
`complex_fields::a_rust_type_reaches_baml_as_its_structure_rather_than_as_the_word_json`, which
was written *after* confirming that dropping the reflection left every other test passing.
"""

[[backlog]]
id = "b1"
state = "done"
closed = "2026-07-21"
done = """
