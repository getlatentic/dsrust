title = "One call spelling across declared and derived signatures"
kind = "ergonomics"
state = "done"
detail = """
dspy builds and asks both signature forms identically, so a difference here was a defect rather
than a trade-off. predict! takes a spelling or a task type, and call! asks either.

What does NOT collapse is the answer, and that is the point of the Ask trait: a task declared by
its field names has only fields to hand back, while a derived one hands back its own outputs, so
result.answer keeps meaning the field. Ask is written per module rather than blanket over Module,
because a derived task is a Module too and one blanket impl would make its better answer
unreachable. A module of a caller's own opts in with asks_with_a_prediction!.
