progress = """
**The listener is done and was not absent — it was wrong.** The story said "no `StreamListener`
yielding a field's chunks as they arrive"; `adapter/stream.rs` had one, ChatAdapter-only, and its
chunk boundaries diverged from dspy's. That is worse than absent, because it looked finished.

Measured before changing anything, by feeding it the stream upstream records from gpt-4o-mini in
`test_stream_listener_returns_correct_chunk_chat_adapter`:

    ours : ["To", " ge", "t to", " the o", "ther ", "sid", "e of", " the di", "nner p", "late!"]
    dspy : ["To", " get", " to", " the", " other", " side", " of", " the", " dinner", " plate", "!"]

It buffered a fixed number of *characters*; upstream holds whole deltas and asks per delta whether
the buffer could still be growing into the closing marker (`_could_form_end_identifier`), releasing
the oldest only once ten deltas are held. **The two concatenate to the same text**, which is why
nothing caught it: every assertion in the tree was over the joined string. A caller rendering chunk
by chunk saw words split down the middle.

Ported faithfully, along with the three behaviours the old one had no notion of: `is_last_chunk`,
`finalize` flushing a buffer the stream ended on, and the whole-reply-in-one-delta case that a cache
hit produces. `scripts/generate_streaming_fixture.py` drives dspy's own `StreamListener` over eight
streams and `tests/streaming_conformance.rs` holds the port to it, `(text, is_last)` for each.
`the_old_boundaries_carried_the_same_text` keeps the reason honest by checking it: the old sequence
concatenates to dspy's byte for byte and differs chunk for chunk.

**What is left**, and the coverage excuse now says exactly this rather than overstating it:
`streamify` over a whole module, `StatusMessageProvider` and its callback, and the JSON and XML
listeners.

**The JSON listener has a measured obstacle, and a narrower way round it than it first looks.**
Upstream detects that field's end by partial-parsing the accumulated object with
`jiter.from_json(..., partial_mode="trailing-strings")` and asking whether a *second* key appeared
(`len(parsed) > 1`). `dsrust-json-repair` is a reproduction of Python's `json_repair`, a different
library with different partial semantics, and the two disagree exactly where the decision is made:

    '{"answer": "x", "judgement":'   jiter -> 1 key      json_repair -> 2 keys

So a listener built on the repairer would close the field one delta early and stream a different
last chunk. Four other accumulated shapes agree, which is the trap — it would look right on most
inputs. See [[no-conformance-slips]]: the regime where they diverge is the one the code lives in.

The way round was not a jiter port. The listener does not need a parser; it needs one predicate —
*has a second key's value begun*. `adapter/stream/partial.rs` answers it directly, and
`generate_partial_json_fixture.py` records jiter's answer for **every prefix** of eleven accumulated
strings — 342 of them — which `tests/partial_json_conformance.rs` compares one by one. It matched on
the first run, so the control matters: applying the repairer's rule fails at exactly `{"answer":`,
the prefix measured above.

jiter's rule, read off those prefixes rather than off its source: a key counts once its value has
*begun* — a string at its opening quote, a number at its first digit, an object at its bracket — and
a partial literal (`nul`) counts for nothing.

**The JSON listener is done**, held to four more recorded streams. Two things came out of comparing
rather than deciding: dspy streams the field's **raw JSON text**, so the chunks carry their quotes
(`"To` … `!"`), which reads as a bug until it is compared; and a leading-space divergence exposed a
real fault in the *ChatAdapter* listener already shipped.

**That fault is the lesson.** Upstream always buffers the first delta containing the start indicator
and tests only once a second arrives, so the trim that follows applies to the joined text. This
crate matched within a single delta. All eight ChatAdapter cases passed anyway — in every one the
text after the marker was whitespace, which trims to the same thing either way. The JSON stream had
`{"answer":` then ` "Paris"`, where it does not. Both listeners now defer as upstream does and both
goldens pass, this time for the reason they claim to. See [[no-conformance-slips]].

**The XML listener is done too, and is the same listener.** Its rule differs from the marker wire
only in the identifiers, which is upstream's own arrangement — `adapter_identifiers` entries that
differ in nothing else. So `FieldListener` takes a `Wire` value and `FieldListener::xml` is the tag
spelling of it, rather than a third near-copy.

Adding it caught a conflation that would have shipped: dspy's `end_pattern_contains` is *not* the
end identifier. On the marker wire they are the same string (`[[ ##`); on the tag wire they are
`</` and `</answer>`. Treating them as one let the closing tag leak out a piece at a time — `">"`,
`"<judgement"`, `">"` — and the listener never stopped, streaming the *next* field's text as the
answer's. The golden failed on exactly that.

**Twice now, adding a second wire has exposed a fault in the first** — the deferred first delta, and
this. Both were invisible while only one wire had a golden, because the ChatAdapter identifiers make
the two rules coincide. Worth remembering when the next adapter is ported: a rule that is only ever
exercised at one set of constants is not yet tested. See [[no-conformance-slips]].

**`streamify` is done.** `adapter/stream/program.rs` runs a module, taps whatever model it reaches,
and yields the watched field's chunks as they arrive and then the prediction. The tap is a *model*,
not a hook in `Module` — upstream's own arrangement, its listeners seeing chunks because the LM
publishes them — which is what lets a caller's own module, several predictors deep and written
before any of this, be watched without changing it. `lm::context_model` scopes it for the run.

Getting there needed streaming on the trait, since a tap has to work for any model.
`ChatModel::forward_stream` is defaulted to reporting the whole answer as one delta and `LM`
overrides it; `DynChatModel::forward_stream_dyn` is defaulted too, because adding it as *required*
broke two hand-written implementors in this tree immediately. The lifetime that seemed to make a
trait method impossible was incidental: `RequestBuilder` owns a cloned client, so `send()`'s future
was already `'static` and the `'h` threaded through seven functions came out.

Three things the tests caught that reasoning had not:
- **A hang.** The run's future owns the scope, which owns the tap, which owns the sender, so keeping
  the finished future alive leaves a channel nothing will close. Dropping it on completion is the
  fix; the test is bounded by a timeout because that failure hangs rather than fails.
- **A `DummyLM` yields no chunks, correctly.** Its whole reply arrives in one delta and hits the
  cache-hit branch, exactly as upstream's does. The test needed a double that genuinely streams.
- **A latent flake, surfaced.** `callback::tests::a_panicking_callback_does_not_break_the_run`
  failed once in a gate run. Registration is process-wide and it asserted its recorder saw exactly
  `["Predict"]` — a claim about the whole binary. Its lock excludes other `callback.rs` tests and
  nothing else. The recorder now keys on `CallId`. **The race was not reproducible on demand** —
  six runs of the old shape passed — so the fix rests on the mechanism, which
  `a_recorder_tells_one_calls_points_from_anothers` asserts directly.

**`StatusMessageProvider` is done, and needed something this crate did not have.**
`adapter/stream/status.rs` is the six stages; `Watching::saying` is dspy's
`status_message_provider=`. Four of the six say **nothing** by default — only the two tool messages
carry wording upstream — and `a_run_given_no_words_is_silent` asserts the silence, because a port
that invented sentences for the other four would put text on a stream dspy leaves empty. The two
tool skips are upstream's too: `finish` by name, and `Completed.` by value, since `on_tool_end` is
not told which tool it was.

**dsrs had no scoped callback context.** dspy's `streamify` does
`callbacks = list(settings.callbacks)`, appends, and enters a context — appending so a narrated run
does not silence a caller's own watchers, scoped so it does not leave its own behind. Only
process-wide `configure_callbacks` existed here. `callback::watched_by` mirrors `lm::context`,
entering per poll for the reason that one does.

**And a short-circuit that did not know what it was short-circuiting.** Every point asks
`watching()` before rendering anything, and that check consulted only the process-wide registry — so
a scoped watcher was installed, never asked, and silent. The status messages came out empty with
everything apparently wired. `a_scoped_watcher_is_seen_by_the_interest_check` pins it, the departure
included.

**What the story did not do**, and should be said rather than left implied: `streamify` watches
**one field of one program**, where dspy takes a list of `StreamListener`s and matches each to the
predictor whose signature names its field. One listener covers the case a caller reaches for and
the matching is what a multi-predictor program needs; it is the next thing here, and small now that
the tap and the listeners exist.
"""

