[[story]]
id = "passage-match"
sprint = "api"
title = "A metric deferred for needing a retriever, which it does not"
state = "done"
size = "S"
# Empty on purpose: upstream has no test for this metric. `tests/evaluate/test_metrics.py` runs and
# covers its nine siblings, and naming it here would claim a coverage it does not give.
suites = []
plan = """
`evaluate/metrics.py::answer_passage_match` was the one `deferred` row in the ledger that was not
finetuning, and its reason read "scores a retrieved passage ... retrieval is out of the 1.0
ceiling". Reading it settles that differently: the metric retrieves nothing. It takes the passages
the caller already has in `pred.context` and asks whether any of them holds the answer. What was
actually missing is `dsp/utils/dpr.py`, and the part of it this needs is a tokenizer — one regex
and a subsequence search, with no retriever anywhere in it.

Every one of that module's nine siblings is mapped. A closeable divergence is a defect, so close it.

- `dpr::normalize` for `DPR_normalize`: NFD, then upstream's ordered
  `([\\p{L}\\p{N}\\p{M}]+)|([^\\p{Z}\\p{C}])` as a left-to-right walk, lowercasing per token.
  Those are Unicode's one-letter groups, and a general category's abbreviation opens with its
  group's letter, so the classification asks upstream's question rather than enumerating thirty
  variants a thirty-first would date. `unicode-general-category` is already a dependency.
- `dpr::has_answer` for `has_answer`, remembering that upstream's `[] == text[i:i]` makes an empty
  answer match anything — which is not a curiosity, it is what `the` against `theatre` scores,
  because the shared `normalize_text` strips the article before the tokenizer ever sees it.
- `metrics::answer_passage_match` reading `context` as `answers_of` already reads `answer`.

**What proves it.** A golden recorded by running the pinned dspy, over inputs picked where a
hand-written scanner drifts rather than where it agrees: Greek's final sigma (`ΟΔΥΣΣΕΥΣ` ends `ς`,
a lone `Σ` does not), `İ` becoming two codepoints, a CJK run being one token so `北京市` is *not*
in `北京市中心`, a zero-width joiner and a private-use character leaving no token, an unassigned
codepoint leaving none either, and five codepoints assigned in Unicode 16 — which is where two sets
of tables would part company, the Rust crate shipping 16.0 and upstream's `regex` its own.

Upstream has no test for this metric (`tests/examples/test_baleen.py` calls it, and needs a live
retriever), so the golden is the coverage rather than a second opinion on it. Which is the reason
to pick the inputs for the edges and to confirm each one bites.
"""
