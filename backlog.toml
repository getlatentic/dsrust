[[story]]
id = "callers-the-gate-could-not-see"
sprint = "api"
title = "Three kinds of caller the surface gate was blind to, and one it cost"
state = "done"
size = "M"
suites = []
plan = """
`check_surface_has_callers.py` counted 80 public dsrust inventions with nothing exercising them, and
that number was quoted as a fact about the crate. Most of it was the gate measuring the wrong thing.
"""
done = """
**80 -> 62, and only two of the difference is the crate.** The rest was three caller locations the
gate could not see:

- **Doc-comment examples.** A `///` fenced block is a doctest — compiled, run, and the demonstration
  a reader meets first. Overcounted by two. (A first crude grep with a 40-line window claimed five;
  the proper extractor found two, which is why the crude one was not trusted.)
- **What the derive emits.** `signature::json_field_reflection` appears nowhere in this repo except
  inside a `quote!`, and is called from every crate using `#[derive(Signature)]`. Five items were in
  that state. De-publishing one would have compiled clean here and broken users — which is why the
  derive's output was checked *before* touching anything.
- **The PyO3 bridge.** `dsrs-bridge` drives upstream's own suite against this API from outside and is
  the most exercised consumer there is. It was missing, and two `pub(crate)` changes were made on the
  strength of that omission: `close_object_schemas` and `extractor_signature`, both reverted when the
  workspace build refused them.

**The crate's actual surplus was two items** — the preview-length constants, now `pub(crate)`.

Also fixed while in there: four ledger rows written `" ={` rather than `" = {`. A deletion pattern
requiring the space matched none of them, so removing one and re-adding it produced a duplicate key
and an unparseable ledger. The spacing is normalised so the next pattern-based edit does not step in
the same hole, and the duplicate check now groups by table — the first version reported two false
positives that were legal same-key-different-table rows.

**The lesson is about the instrument, not the surface.** A number this gate reports is a claim about
what it can see, and it could not see the three places a caller most often lives. Quoting 80 as the
crate's undemonstrated surface was quoting the tool's blind spots back as a property of the code.

**62 -> 56 by demonstrating six, which is the outcome this gate names as the good one.** Of the 25
confined to their own directory — the ones that looked de-publishable on the mechanical signal —
almost none should be hidden: `LmBuilder` is what `LM::builder` returns, `observe::TARGET` is the
string a caller filters tracing on and cannot otherwise discover, `Trial` is what `compile_traced`
answers with, `LmRequestPatch` is what a custom type adds to a request, and `llm_query_tools`
documents `ask` as the caller's own bridge. Hiding those buys a smaller number and a worse crate.

Six doctests instead, compiled and run: an `EnvFilter` built from `TARGET` so a filter survives the
module moving; the builder as the keyword-argument equivalent of `dspy.LM(model, temperature=…)`,
with the refusal of `openai/`; folding trials to the best, and why it is a fold rather than a sort —
two can tie and the first of a tie is the one the search kept; and comparing against the provider
defaults rather than hardcoding a URL, which is the question worth asking before sending a
credential somewhere.

**And the gate matches names, not types.** A chained `LM::builder(…)` never writes `LmBuilder`, so
the type read as undemonstrated until an example held it as a value. That is a real pattern — a
builder configured at run time — but a type only ever reached through inference will read as
undemonstrated however well it is used.
"""
