[package]
name = "pyrng"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getlatentic/dsrust"
authors = ["Tosin Amuda"]
include = ["src/**/*"]
description = "Byte-faithful Rust reproductions of Python's Mersenne-Twister RNGs: CPython's random.Random and numpy's legacy RandomState, over one shared MT19937 core."

[dependencies]

[dev-dependencies]
# `float_roundtrip`: the default parser is best-effort and loses the last bit of a full-precision
# float. Here the goldens' probabilities are *inputs* to `choice`, so a rounded one would change the
# draw rather than the comparison — see the note in dsrust-gepa/Cargo.toml for where it was caught.
serde_json = { version = "1", features = ["float_roundtrip"] }
