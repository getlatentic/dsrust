[[story]]
id = "pin-drift"
sprint = "api"
title = "Six ported modules moved on main, and one of them contradicts a guide"
state = "todo"
size = "M"
suites = []
plan = """
`./scripts/check_pin_drift.py --detail` reports the public surface of every ported module, pin
against main. Six have moved. None is to be ported now — the pin is the oracle and 3.3.0b1 is the
only 3.3 tag — but each is what re-reading will cost when a release lands, and one is already wrong
in a guide.

**The sandbox lifecycle changed, and it is one refactor across three modules.** `CodeAct`,
`ProgramOfThought` and `RLM` all moved `interpreter` out of `__init__` into `forward`, and `__init__`
now takes an `interpreter_factory` instead. So upstream made the interpreter *per call* rather than
per module. This crate has `with_interpreter` on the module, which is the pin's shape. Worth reading
before the pin moves: a factory implies the sandbox is created and torn down per call, and
`DenoInterpreter` currently holds a long-lived child process, so the change is about lifecycle rather
than about a parameter.

**`RLM.max_iterations` became `max_iters`.** `docs/usage.md` says: "Each keeps the cap keyword its own
module uses: `max_iters` for most, `max_iterations` for `RLM`. A uniform name would be one none of
them actually have." That was true of the pin and is exactly the sentence main deletes — upstream
converged on `max_iters`. The guide has been softened to say the split is the pin's rather than
permanent; the rename itself waits for the pin.

**The tool cannot see a body change, and one this session found matters.** `check_pin_drift.py`
compares each ported module's public *surface* — names, and each one's parameter list. A behaviour
change inside a function is invisible to it. Diffing five files by hand while building the MIPROv2
and GEPA work turned up exactly that: `teleprompt/utils.py`'s `get_program_with_highest_avg_score`
falls through to the last valid program on the pin and raises `ValueError` on main, with an identical
signature. It is the helper `mipro-auto-minibatch` will port, and it is recorded there — but nothing
would have surfaced it, and nothing will surface the next one.

Two other main-vs-pin findings from the same sweep, both recorded where they will be read rather
than here: `clients/openai_format.py` gained `enforce_reasoning_temperature=True` on the Responses
wire only (noted at `lm/openai/reasoning_temperature.rs`, which always enforces, as the pin does),
and `core/types.py`'s `User` docstring stopped showing `dspy.Image(...)` in a message part — because
it raises, which is measured at `lm/api/items.rs`. A docstring is not surface either.

So this story has a second half: whether drift detection should read bodies at all, and if not, that
a hand diff of the files a change is built from belongs in the change rather than in a tool. The
second is cheap and already paid off three times.

**Two additions, neither breaking.** `primitives/code_interpreter.py` gains `CodeExecutionError`,
which this crate answers today with an `anyhow::Error` carrying the sandbox's message — a typed
counterpart is the same decision `LmFailure` already made for provider failures.
`signatures/signature.py` gains `Signature.append_instructions`, which is a small mutator and has no
counterpart here.

**`BaseLM.__call__` and `acall` gained `*items` and `request`.** Already recorded under lm-from-call:
`ChatModel::call` implements main's shape, not the pin's, and no upstream test reaches it.

**What proves it.** Nothing, until the pin moves — that is the point of the story. What it buys is
that the next pin bump is a list rather than a surprise, and `check_pin_drift.py` regenerates the
list rather than this prose being trusted.
"""

[[story]]
id = "lm-shared-client"
sprint = "api"
title = "ChatModel takes an HTTP client dspy's signature has not, and it leaks reqwest into every caller"
state = "done"
size = "L"
suites = ["tests/clients/test_lm.py"]
done = """
`ChatModel::forward(&self, request) -> Result<LmResponse>` and `capabilities(&self)`, which is dspy's
`BaseLM.forward(request)` exactly. The word `reqwest` no longer appears in `src/lm/model.rs` at all,
and `reqwest::Client` in `src/` went from 157 mentions to 17.

The done-condition held: `docs/usage.md`'s "a provider of your own" example dropped
`dsrust::reqwest::Client` and `check_docs.py` compiles that `impl ChatModel` from outside the
workspace with only the dependencies the README prints. A caller writing a provider now needs nothing
from this crate but the trait.

Four steps, each landing green on its own, which is what made it work after the first attempt
cascaded:

1. `global::current()` returns the model rather than a `(Client, Arc<dyn DynChatModel>)` pair. Nine
   call sites destructured it and every one wanted the model.
2. `Predict`'s chain: sixteen signatures carried the client to exactly three consumers — two
   `forward_dyn` calls and one `capabilities_dyn`. Those three ask `global::client()` themselves and
   the chain is gone. GEPA's reflection adapter held a client field for the same reason and lost it.
3. The trait, `DynChatModel`, and the 36 impls. Most took `_http` and ignored it.
4. The four providers reach `global::client()` in their own `forward`.

The first attempt did all four at once with scripted edits and turned two errors into fifty. Step 1
alone then compiled first try by hand. The lesson is in [[verification-traps]]-shaped terms: the
157-mention count measured the *visible* chain and missed that removing the trait parameter makes a
whole call graph dead simultaneously.
"""
remaining = """
`LM::forward_stream(&http, request)` still takes one, and it is the only place left on the public
surface. Its returned stream borrows the client for `'a`, so the client has to outlive the call; the
streaming helpers in `openai/stream.rs`, `anthropic/stream.rs` and `ollama/*stream*` would have to
take it by value first. That is a lifetime change to five helpers, not a signature change, and it is
worth doing only if someone wants `reqwest` off the surface entirely — it is not the seam a caller
implements.

`configure_with_client` keeps naming the type on purpose: it is how a caller hands the crate a pooled
client, which is the capability the parameter used to provide.
"""
plan = """
`ChatModel::forward(&self, http: &reqwest::Client, request: &LmRequest)` carries a parameter upstream
does not have. dspy's `BaseLM.forward(request) -> LMResponse` names no client — litellm holds a
module-level session — and upstream's own docstring example constructs an `OpenAI()` inside `forward`.

The cost is not cosmetic. A caller implementing the crate's advertised extensibility seam has to name
a `reqwest` type, which means either depending on reqwest and keeping its major version matched to
this crate's by hand, or reaching through `dsrust::reqwest` — a re-export added on 2026-07-30 for
exactly this reason. The re-export made the trait *implementable*; it did not make it faithful, and
the ledger entry that called this `mapped` to a bare `forward` was the audit's own failure shape.

The close: a process-wide client behind a `OnceLock`, which is what `cache::shared` already does and
what litellm does. Then `forward(&self, request)` and `call(&self, items)`, and reqwest is gone from
the public surface. `configure_with_client` already exists and becomes how a caller supplies their
own, so the capability is preserved rather than dropped.

Why it is not free: 157 mentions of `reqwest::Client` across 37 files, every provider, every scripted
double in `src/` and `tests/`, and the PyO3 bridge. One breaking change to `ChatModel`, so it should
land alone rather than riding along with a feature.

**Attempted 2026-07-30 and abandoned; read this before trying again.** The trait change itself is
twenty minutes and the 36 `impl ChatModel` sites are genuinely mechanical — most take `_http` and
ignore it, so the parameter just goes. What is *not* in the 157 is the second chain: `Predict` threads
the client down through `ask_through`, `ask`, `extract`, `recovery`, `derived`, `completions` and
`shorthand`, and `global::current()` returns a `(Client, Arc<dyn DynChatModel>)` pair that every
caller destructures. Removing the parameter from the trait makes all of that dead, and unpicking it
is hand work on a call graph, not a search and replace. Scripted regex turned two errors into fifty.

Do it in this order, compiling green between each, and by hand:

1. `global::current()` returns the model alone; `client()` stays for streaming. Fix its callers first,
   while the trait is unchanged — they compile either way, so this step is independently landable.
2. `Predict`'s internal chain drops the client, top down from `Predict::forward`.
3. Only then the trait, `DynChatModel`, and the 36 impls.
4. The four providers reach `global::client()` in their own `forward`.

`forward_stream` is the one that cannot follow. It returns a stream borrowing the client for `'a`,
so the client has to outlive the call — the streaming helpers would need to take it by value first.
Either do that as step 5 or leave `forward_stream(&http, request)` and say so in the guide; it is not
the seam a caller implements.

Read before starting: whether anything actually depends on the *caller's* client rather than a shared
one. `Parallel` and `Evaluate` run many calls at once and want one connection pool; a `OnceLock`
client gives them that, and a per-provider client would not. That is the argument for the parameter
in the first place, and it survives the change.

**What proves it.** `check_external_consumer.sh` and `check_docs.py` both build from outside the
workspace, so a `ChatModel` impl written there compiles only if reqwest really is unnecessary. Add
such an impl to whichever guide documents the seam — `docs/usage.md`'s "Reaching a provider, and
adding your own" already has one, and it currently names `dsrust::reqwest::Client`. When that line can
be deleted, the story is done.
"""

[[story]]
id = "api-6"
sprint = "api"
title = "A caller needs serde_json the moment they build anything, and nothing says so"
state = "todo"
