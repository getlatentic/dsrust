[package]
name = "dsrust-derive"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getlatentic/dsrust"
authors = ["Tosin Amuda"]
include = ["src/**/*"]
description = "Derive macros for DsRust: #[derive(Signature)] / #[derive(Module)] and the predict!/chain_of_thought!/signature! call macros."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
# full: the call macros parse arbitrary expressions as field values.
syn = { version = "2", features = ["full"] }

[dev-dependencies]
serde_json = "1"
