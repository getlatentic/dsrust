detail = '''
`BestOfN` shipped; `Refine` is the other half and is not a small mirror of it. Five pieces, and
the rollout loop is only the first.

1. The loop. Same as `BestOfN` — n attempts at `Sampling::rollout(i)`, keep the best, same
   index-against-budget failure rule. One difference that is upstream's: `threshold` is
   *nullable* here (`if self.threshold is not None and reward >= self.threshold`) where
   `BestOfN` compares unguarded. So `Option<f64>`, required positionally.

2. `OfferFeedback`, a signature of nine inputs — program_code, modules_defn, program_inputs,
   program_trajectory, program_outputs, reward_code, target_threshold, reward_value, module_names
   — answering with `discussion` and `advice: dict[str, str]`, keyed by module name.

3. `inspect_modules`, byte-sensitive prompt text. Capture the oracle again with:

     .dspy-venv/bin/python -c "import dspy; from dspy.predict.refine import inspect_modules; \
       print(repr(inspect_modules(dspy.ChainOfThought('question -> answer'))))"

   Two things it shows that reading the code does not. The separator is eighty dashes. And the
   field lines carry a trailing space after `(str):` on every field EXCEPT the last of each
   group — `get_field_description_string` strips the block as a whole, so only the final line
   loses it. Reason about this from the oracle, never from the code.

   `adapter::prompt::numbered_input_lines` / `numbered_output_lines` already render those lines
   and need widening from `pub(super)` to reach a module outside `adapter`.

4. The trajectory as JSON, upstream's `recursive_mask` plus `orjson.dumps(option=OPT_INDENT_2)`.

5. Injecting the advice, and this is the open design question. dspy subclasses the live adapter
   per attempt, appends a `hint_` InputField to the signature and sets its value from
   `advice[module_name]` — so each predictor gets its own hint. Here `NamedPredictor` reaches a
   predictor's signature and demos but not its adapter, and one `Example` carries one value for
   every predictor. Options: widen `NamedPredictor` with the adapter, or give it a
   `hint: &mut Option<String>` that `Predict` renders as an extra input. The second is smaller
