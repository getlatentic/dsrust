# --- the error taxonomy (issue #10) ---
# dspy exports seventeen error types. The crate answers with `anyhow::Error` throughout, and for
# almost all of them that is the same thing said differently — a caller reads the message either
# way, and no dspy code branches on the difference. The exception is the one a *module* catches by
# name, which is ported as a typed error found by downcast.
#
# So these are divergences with one mapping, not a backlog of seventeen missing types. What would
# turn a line here into a `todo` is finding upstream code that branches on it.
"utils/exceptions.py::ContextWindowExceededError" = { status = "mapped", rust = "ContextWindowExceeded" }
"utils/exceptions.py::DSPyError" = { status = "divergence", reason = "the taxonomy's root; `anyhow::Error` is the crate's, and nothing branches on the root itself" }
"utils/exceptions.py::LMError" = { status = "divergence", reason = "dspy checks it to decide whether a JSON-adapter fallback is worth trying; the crate's fallback wraps only `parse`, so an LM failure never reaches that branch — see predict.rs::ask_through" }
