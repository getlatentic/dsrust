[[story]]
id = "bare-names-in-the-ledger"
sprint = "api"
title = "522 ledger entries name a bare Rust identifier, so 106 of them cannot detect their own deletion"
state = "done"
size = "M"
suites = []
plan = """
Found while closing `api-3`, and found the way these things get found: the gate went red on an entry
I had not touched. Adding a qualified `XmlAdapter::use_json_adapter_fallback` left
`ChatAdapter::use_json_adapter_fallback` — whose entry said only `rust = "use_json_adapter_fallback"`
