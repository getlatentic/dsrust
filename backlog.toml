already kept it whole, which is what the other four should have done. Three copies of
`recorded_turns` are gone, each carrying the same
`match role { "assistant" => Assistant, _ => User }`.

Each recorder now holds the messages, with `system()` and `turns()` as *reads* — the first is the
same one `LmRequest::system` makes, the second is everything after the leading system message. A
read cannot drift from the list the way a stored copy did.

**The defect was real and had no test.** `adapter/history.rs`'s `native_replay` is the only thing
that builds a `tool` turn, and nothing exercised it — which is why nobody saw the role collapse.
`a_replayed_tool_result_is_a_tool_message_and_is_recorded_as_one` covers both halves: the render
produces `[system, user, assistant, tool, user]`, and the scripted model records those same roles.
Restoring the old lowering turns the fourth into `user` and fails it.

**The fixture was wrong before the code was.** The first version of that test asserted no tool
message was rendered at all, which read as a second bug. It was not: `results_match_calls` requires
each result's `call_id` to name a call's `id`, and the fixture's call had no id — so the adapter
correctly declined to replay results it could not attribute. A probe printing what
