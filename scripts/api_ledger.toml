# --- the error taxonomy (issue #10) ---
# dspy exports seventeen error types. The crate answers with `anyhow::Error` throughout, and for
# almost all of them that is the same thing said differently — a caller reads the message either
# way, and no dspy code branches on the difference. The exception is the one a *module* catches by
# name, which is ported as a typed error found by downcast.
