[[story]]
id = "method-parameter-gate"
sprint = "api"
title = "The surface gate compares three tables, and a method's parameters is not one of them"
state = "todo"
size = "M"
suites = []
plan = """
`check_api_surface.py` walks dspy and gates three things: top-level symbols, method *names*, and
`__init__` parameters. A method's **signature** is compared nowhere, so every keyword argument of
every method is unchecked — `compile` most of all, which for the teleprompters carries as much
configuration as `__init__` does.

Measured on MIPROv2 2026-07-31, whose `compile` takes eighteen arguments. The ledger holds one
entry for one of them (`teacher`). Seven are unimplemented and unrecorded:

  - `program_aware_proposer` — the crate has `program_code`, which is the same switch under a
    different shape (Some = on), so this is a naming divergence rather than a gap, and nothing says so;
  - `data_aware_proposer` and `view_data_batch_size` — the dataset-summary proposer, not wired;
  - `fewshot_aware_proposer` — not wired;
  - `requires_permission_to_run` — an interactive confirmation before a costly run;
  - `provide_traceback` — what an evaluation error reports.

`tip_aware_proposer` was in the same list until this was written: the field existed with no setter,
so a caller could not turn it off. Fixed in passing, which is the point — a one-line gap sitting in
a shipped optimizer for as long as the optimizer has existed, invisible to a gate that only checks
that a method called `compile` exists.

The work is a fourth table: for each mapped method, dspy's parameters against the Rust equivalent,
with the same mapped/divergence/deferred/todo vocabulary the other three use. Rust has no keyword
arguments, so the mapping is to a builder method or a positional parameter, and the ledger has to
say which — the same judgement `constructors` already makes.

Expect a large first backlog. That is the finding, not an objection to it: `constructors` found
fourteen gaps when it landed and every one was real.
"""

[[story]]
id = "predict-completions"
sprint = "api"
title = "Predict::forward read one output whatever n was, so n>1 answered with a fraction of what was paid for"
state = "done"
size = "M"
suites = ["tests/predict/test_predict.py"]
done = """
`Prediction` carries `completions` now, and `Predict::forward` reads every candidate the model
returned. dspy's `from_completions` sets `_store = {k: v[0] for k, v in completions.items()}`, so the
prediction's own fields are the *first* candidate and `.completions` holds them all — and a call that
asked for one answer carries `None`, which is every caller that existed before this.

The `Completions` type was already a full port and simply unused by `forward`. Reading the siblings
is best-effort — a candidate the model malformed is dropped rather than failing the call — which is
what `forward_completions` already did, since the answer is the first and the rest are alternatives.

**A second defect, found by needing real expected values.** The test needed what dspy actually
returns, and running it gave `['red', 'blue', 'green']` — three *different* answers. The crate's
`DummyLM` carried the comment "dspy's DummyLM answers n times over, one identical choice per
completion asked for", and that was false: upstream loops `for _ in range(n)` with `next(self.answers)`
*inside* the loop, so a queue pops a different answer per completion and only the keyed mode repeats.
The crate chose once and repeated it — right for keyed, wrong for the queue.

That matters more than an ordinary bug because `DummyLM` is what most of this crate's tests are built
on: a future test asserting on multi-completion behaviour would have been measuring the double rather
than the crate. Reading the comment would have confirmed it; running dspy contradicted it.

`predict.rs` crossed 400 lines on this change, so `Validated` and `call_with_inputs` moved to
`predict/validate.rs`. They are one job — everything between the model answering and a `Prediction`
existing — and the pieces they reach for already live beside them.
"""

[[story]]
id = "gepa-candidate-order"
sprint = "api"
title = "GEPA walks a program's components alphabetically where gepa walks them in declaration order"
state = "todo"
size = "M"
suites = []
plan = """
`Candidate` is `BTreeMap<String, String>`, so its keys are **sorted**. gepa's is a Python `dict`,
which is **insertion-ordered** — and for dspy that insertion order is the program's *declaration*
order, since the seed candidate is built from `student.named_predictors()`.

Three places read that order, and one of them decides the search:

  - `state.rs`: `list_of_named_predictors`, which is the round-robin walk. A two-predictor program
    declared `write, plan` reflects on `plan` first here and `write` first upstream — a different
    component mutated on the very first iteration.
  - `engine.rs`: `ComponentSelection::All`, whose returned order reaches the proposer.
  - `merge.rs`: the predicate loop, whose own doc already calls this "one bounded edge".

Found by generating a component-selector golden from the real gepa package and comparing —
`tests/selectors.rs` records it as a divergence and goes red when it is fixed, so this cannot be
closed by accident. Every existing golden agrees, because they are single-predictor or carry names
that sort into declaration order; that is why nothing caught it.

The fix is a type change rather than a patch: `Candidate` becomes insertion-ordered. `indexmap` is
the obvious tool, though this crate hand-rolled `PyIntSet` rather than take a dependency for the
same class of problem, so a `Vec<(String, String)>` newtype is the consistent alternative. The
blast radius is small — three order-sensitive reads plus the ordinary map operations — but it
crosses `dsrust-gepa` and `dsrust`'s GEPA adapter, and both are published crates.

**What proves it.** `both_component_selectors_choose_what_gepa_chooses` flips from `assert_ne` to
`assert_eq` on the two walks, and a multi-predictor GEPA conformance case is generated with
predictors whose declaration order is not alphabetical.
"""

[[story]]
id = "callbacks-per-module"
sprint = "api"
title = "A module cannot carry its own callbacks, because a Rust Module is a trait with no shared constructor"
state = "todo"
size = "M"
plan = """
`BaseCallback`'s own docstring shows two ways to register, and `callback-trait` shipped both:
`configure_callbacks` for the process, `LM::with_callbacks` for one model. Upstream has a third that
follows from its base class — `dspy.Module.__init__` stores a `callbacks` list every subclass
inherits, and `_get_active_callbacks` unions it with the configured ones — so
`dspy.Predict("q -> a", callbacks=[cb])` watches that predictor and no other.

Nothing here does. A Rust `Module` is a trait, so there is no shared constructor to hold the list:
each of the eight module structs would carry its own field and its own setter, and a caller's
`#[derive(Module)]` struct could not have one at all without the derive inventing a field name.

What a handler gets instead: the module's type on `on_module_start`, and `CallId::parent` for the
call it sits under. That covers filtering by kind and by position, not by object identity — two
`Predict`s of the same signature are indistinguishable.

The shape worth weighing is a defaulted `Module::callbacks(&self) -> &[Arc<dyn Callback>]` mirroring
`ChatModel::callbacks`, with the field on the structs that already have builders, and the derive
reading an `#[callbacks]`-attributed field when one is declared. That is mechanical but it is eight
files of near-duplicate state, so it wants a reason beyond symmetry.

**What proves it.** `dspy.Predict("q -> a", callbacks=[cb])` has a spelling here, and a test with two
predictors where only one is watched records only that one's points.
"""

[[story]]
id = "mipro-auto-minibatch"
sprint = "api"
title = "MIPROv2's auto is minibatch evaluation wearing a preset's name"
state = "done"
shipped = "2026-07-31"
size = "L"
suites = []
plan = """
`auto="light"|"medium"|"heavy"` was classified as a setter for two counts. Reading
`_set_and_validate_auto_settings` against the pin, it is five things, and four of them this crate
has no shape for:

  - `AUTO_RUN_SETTINGS` picks `n` (6/12/18) and a `val_size` (100/300/1000);
  - the valset is *subsampled* to `val_size` by `create_minibatch`, which draws off the same RNG
    Step 1 and Step 2 read — so turning auto on moves every later draw;
  - `minibatch` turns on whenever the subsample exceeds `MIN_MINIBATCH_SIZE = 50`;
  - the count splits in two — `num_instruct_candidates` is `n/2` when demos are searched and `n`
    when they are not, `num_fewshot_candidates` is always `n` — where this crate carries one
    `num_candidates` for both. They coincide only on the non-auto path, which is why nothing has
    noticed;
  - `num_trials = max(2 * num_vars * log2(n), 1.5 * n)`, with `num_vars` doubled when demos are
    searched.

So the real work is minibatch evaluation: `_perform_full_evaluation`, the `param_score_dict` of
per-combination scores, `get_program_with_highest_avg_score`, the full-eval steps interleaved with
minibatch trials, and the adjusted trial count that follows. Shipping `auto` without it would agree
with dspy only on a valset of 50 or fewer and diverge silently above that — which is the failure
mode this project keeps finding, not a smaller version of the feature.

Splitting `num_candidates` into the two counts is worth doing whether or not auto lands, since it is
what upstream's Step 1 and Step 2 actually take.

One moving part to watch, measured 2026-07-31: `get_program_with_highest_avg_score` — the helper
that picks which combination gets a full evaluation — is the *only* line of `teleprompt/utils.py`
that differs between the pin and main. The pin falls through to the last valid program it saw; main
raises `ValueError("No valid program found in param_score_dict")`. The pin is the oracle, so port
the fallthrough, but expect that to flip.

**Minibatch injects trials back into the sampler, which is the part a reimplementation misses.**
Read while waiting on a gate: `_perform_full_evaluation` does not merely re-score a candidate. It
picks the best-averaging combination with `get_program_with_highest_avg_score`, evaluates it on the
*whole* valset, and then calls `study.add_trial(...)` with that score — so the full evaluation
becomes an extra trial the TPE sampler learns from, moving every draw after it. A port that ran full
evaluations and simply recorded the number would agree on the scores and diverge on the search.

So minibatch changes four things, not one: what each trial scores on (a subsample drawn off the
shared RNG), how many trials run (`num_trials + num_trials // minibatch_full_eval_steps + 1 +
run_additional_full_eval_at_end`), which combination gets re-scored, and the sampler's own state.
That is why this is L and why `auto` cannot ship without it.

**What proves it.** `scripts/generate_mipro_fixture.py` grows cases with `auto=` set and a valset
over 50, recorded off the same captured optuna study — the trial sequence including which trials
were minibatch and which were full evaluations.
"""
outcome = """
Shipped, and the golden found more than the story predicted.

What landed: `Auto::{Light, Medium, Heavy}`, the valset subsample drawn before Step 1, minibatch
trials, `Averages` (dspy's `param_score_dict` with the pin's fallthrough rather than main's raise),
the interleaved full evaluations fed back to the sampler as trials of their own, and
`_set_and_validate_datasets` — no valset means the last 80% of the trainset, not the whole of it.
`auto` is mutually exclusive with the two counts as upstream is, encoded so the pair dspy raises on
cannot be built. Constructor coverage reached 187/187.

Three defects the golden caught that reading had not:

  - **A full evaluation takes a trial number.** `trial_num` is `trial.number + 1`, and `add_trial`
    creates a trial, so every full evaluation shifts the schedule of the ones after it. Counting
    loop iterations agrees until the first full evaluation and then drifts by one per full
    evaluation.

  - **The TPE sampler summed differently from numpy past eight elements.** optuna ranks candidates
    by `log_pdf_below - log_pdf_above`; the crate ranked by the algebraically identical
    `pdf_below / pdf_above` in linear space. The acquisition ties constantly and `np.argmax` keeps
    the first of a tie, so ranking equivalently is not enough — the ties have to land where optuna's
    do. Reproducing the expression exposed the rest: numpy's `add.reduce` is *pairwise*, and a
    kernel row is normalised over the parameter's categories, so a program proposing twelve
    instructions rounds differently from one proposing six. Every case in the TPE fixture stopped at
    six. Fixed in `crates/dsrust-tpe`, with cases at 12 and 18 categories added.

  - **optuna reads the search space in two different orders.** A startup trial is drawn one
    parameter at a time by `sample_independent` in suggest order; a TPE trial is drawn all at once
    from `IntersectionSearchSpace`, which is `dict(sorted(...))`, so `0_predictor_demos` precedes
    `0_predictor_instruction`. `mipro/mod.rs` had asserted the suggest order for both, on a reading.
    Invisible until now because every few-shot case gave the two parameters the same cardinality
    (where both orders draw the same numbers) and none ran the ten trials it takes to leave the
    startup phase. `auto` breaks both conditions at once. The sampler now takes named parameters and
    holds the two orders apart; `optuna_tpe.json` carries two cases under dspy's own names with
    unequal cardinalities, and both go red without the fix.
"""

