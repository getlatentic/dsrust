the same field.

Measured: **522 of the ledger's `rust` values carry no `::`**, over 239 distinct names, and **106 of
those names are claimed by more than one entry** — `compile` by 38, `forward` by 23, `LmErrorKind`
by 14.

`is_defined` checks a bare name by asking whether it is *defined anywhere in the crate*. So an entry
mapping `MIPROv2.compile` to `compile` passes as long as some `fn compile` exists — delete
`MIPROv2::compile` and the entry stays green on `COPRO`'s. That is the exact pressure toward the
generic that `is_defined`'s own docstring describes and that its `Type::member` support was added to
relieve; the support landed and the entries were never rewritten.

The work is mechanical but not blind: each entry's `reason` usually already names the qualified
path (all five fixed in `api-3` did), so the first pass is to lift the reason's own answer into
`rust` and check it, and only the leftovers need reading. A bare name that is genuinely a free
function — `dsrust::example!`, a module-level `fn` — stays bare and is fine.

**What proves it.** The count of bare `rust` values over the four dspy-keyed tables, reported by the
gate rather than by a one-off script, with a floor that only moves down. And a control per pass:
delete the Rust item an entry names and watch *that* entry fail, which today it would not.
