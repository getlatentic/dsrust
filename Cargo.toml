[package]
name = "dsrs"
version = "0.1.0"
edition = "2024"

[lib]
name = "dsrs"
path = "src/lib.rs"

[workspace]
# The bridge is a conformance tool, not part of a normal build.
members = ["derive", "bridge"]
default-members = [".", "derive"]

[dependencies]
anyhow = "1"
dsrs-derive = { version = "0.1.0", path = "derive" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: Python dicts keep insertion order, so `json.dumps` writes a schema in the
# order pydantic built it. Sorted keys would reorder every schema note dspy renders.
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
