[[story]]
id = "json-repair-port"
sprint = "conformance"
title = "json_repair is an external library, and it is the only thing the parsers still disagree on"
state = "done"
size = "L"
suites = []
outcome = """
`crates/dsrust-json-repair` reproduces json-repair 0.61.7 whole — the parser, the entry points,
CPython's own `json` grammar for the fast paths it takes, and the schema modules the plan set aside.
`parse_fuzz.rs`'s allowance is deleted: the rule is now every disagreement, no category excused, and
it holds at zero over seeds 0, 1 and 7 at five thousand replies each.

**Three representation decisions carry the port**, and each was a divergence waiting to happen. The
cursor counts *code points*, because Python's `get_char_at(-1)` wraps to the end of the input and
`_should_split_duplicate_object` reaches it with a lookback well below zero. The character
predicates are *CPython's*, generated from the interpreter dspy runs on: `char::is_whitespace`
refuses `\\x1c` where `str.isspace()` accepts it, `char::is_alphabetic` accepts combining marks where
`str.isalpha()` refuses them, and unicode-general-category is Unicode 16.0 against CPython 3.13's
15.1. And an integer keeps every digit, because Python's are unbounded.

**The adapter's fuzzer was not enough to find the bugs.** It reaches this library through one reply
shape — no nesting, no comments, no escapes, no tuples — and reported zero while two real defects
were still in. A grammar that builds malformed JSON directly found both in its first five thousand
inputs, and both were the same mistake: when `_handle_right_delimiter_candidate` breaks, Python
breaks with the character it stepped *back* onto, and the translation broke with the old one. Zero
over five seeds since, sixty thousand inputs.

**Two schema cases were named for what they did not test**, and the fixture found that too:
`default_inserted` passed `{}`, valid JSON *and* valid against its schema, so the fast path handed it
back without inserting anything.

**The log is the stronger oracle.** The value says where a parse arrived; the log says which branch
took it there, context window and all. 191 entries on the parser side and 40 on the schema side,
matching exactly.

Two things Rust cannot follow. A lone surrogate is a Python `str` and not a Rust `String`, so
`"\\ud800"` becomes U+FFFD — one declared case, asserted the other way round so closing it goes red.
And recursion: Python's limit belongs to the *caller's* stack, measured at 330 nested arrays from a
top-level call, 247 nested objects and 317 arrays from forty frames deeper, so there is no single
number to match and the limit here is fixed.

What is *not* reproduced is JSON Schema validation, which is `jsonschema` — a fourth library.
It is a `SchemaValidator` seam, and with none plugged in the crate answers exactly as a Python
environment without `jsonschema` does.
"""
plan = """
`JSONAdapter.parse` opens with `json_repair.loads(completion)`. That is **not dspy's code** — it is
`json-repair>=0.54.2` from PyPI, twelve modules and about 3,500 lines — so there is nothing to copy
from upstream. Rust has several crates of the same name and none of them is this one: matching
"repairs malformed JSON" is not matching *these* repairs, the same reason `tpe` reproduces optuna's
sampler rather than depending on a Bayesian-optimisation crate.

**The differential fuzzer measured how much it matters, which is the point of having built it.** Two
thousand random replies through all three adapters, 2026-08-01:

  - **226 disagreements, every one of them `[json] dspy parsed, we refused`.**
  - Zero for the marker parser. Zero for the tag parser.
  - Zero in the direction that matters most — *we* parsed where dspy refused — for any adapter. The
    crate is stricter, never looser, so no wrong value reaches a caller through this.

And the ones it refuses are severely mangled: `{answer: "{}", "unknown: "7", reasoning": "[]"` —
asymmetric quotes, which `json_repair` recovers by heuristic. The ordinary malformations a model
actually produces already pass: a trailing comma, single quotes, unquoted keys, a missing closing
brace, Python's literals.

So this is real but bounded, and worth doing *after* the cheaper conformance work rather than before.
Scope it by reaching only what `loads(text)` touches with default arguments — `parser_schema.py` and
`schema_repair.py` are not on that path — and byte-verify against the pinned version the way `pyrng`
and `tpe` are.

`parse_fuzz.rs` already allows exactly this category and nothing else, so the day it lands the
allowance can be deleted and the rule becomes "no disagreements at all".
"""

[[story]]
id = "can-the-suite-fail"
sprint = "conformance"
title = "Measure whether the conformance suite can fail, rather than that it passes"
state = "done"
size = "L"
suites = []
plan = """
Every conformance miss found in the 2026-07-31/08-01 sessions had one shape: **a check that could
not fail**. Not a wrong assertion — an assertion with nothing behind it.

  - the comparison *filtered out* the field (`augmented` was stripped from dspy's side);
  - the generator *invented* the field (`augmented: False`, which dspy never writes) — and the two
    cancelled, so nineteen recorded cases agreed about a key neither side really had;
  - the test *supplied the input it claimed to test* (`for_components(names, cursor)` hands the walk
    order in, so a `Candidate` that sorted again left it green);
  - a *hand-written expectation* stood in for a golden (`NOT_SUPPLIED`, wrong for as long as it
    existed, with a unit test asserting the wrong bytes);
  - the fixture *stopped short of the regime that diverges* (every TPE case at six categories or
    fewer; every few-shot case with equal cardinalities; no case past the ten-trial startup);
  - a *transcribed constant* had no oracle at all (`TIPS` — right, and unwatched).

A gate that counts passing tests cannot see any of these. What sees all of them is asking the
inverse question: **change the Rust, and does anything go red?**

`cargo-mutants` is the tool. It mutates a function body and reruns the tests; a mutant that survives
is a line no test constrains. Scoped to the byte-critical modules — `adapter`, `signature`,
`lm/{openai,anthropic,ollama}`, `optimize`, and the `tpe`/`gepa`/`pyrng` crates — the survivors are
exactly the "could not fail" list, enumerated rather than stumbled on.

Expect this to be slow and expect the first run to be ugly. Both are the point. The work is:

  1. run it scoped, record the survivor count as a baseline;
  2. triage — a survivor is either a missing case, a comparison that filters, or genuinely dead code;
  3. gate the *count*, not zero: a ratchet that fails when survivors increase, the way the
     API-surface tables fail when something new goes unclassified.

Two disciplines already in the generators are the manual version of this and should become a rule
rather than a habit: `generate_mipro_fixture.py` refuses to write a case set that compiles the same
instruction every time, `generate_gepa_selector_fixture.py` refuses one that never takes both
epsilon branches, and `generate_dataset_summary_fixture.py` refuses one that never exercises repr's
double-quote branch. **A generator that cannot state what its corpus discriminates is writing a
golden that cannot fail.**
"""
notes = """
**First measurement, `dsrust-tpe`: 18 survivors of 153.** Every one in `parzen.rs`, and every one in
a function whose correctness the module doc *asserts*:

  - `pairwise_sum`'s `n < 8` boundary and its entire `n > 128` recursive split. Written this session
    from numpy's C, cited in three doc comments as the reason the crate agrees with numpy — and no
    sum in any fixture is longer than a few dozen kernels, so the branch that splits and recurses had
    never run once.
  - `default_weights`'s `n >= 25` ramp. The *below* group never grows that large in a recorded study,
    so the ramp arm never ran either.
  - `pick_category`'s pinned last cumulative weight.

Closing them found a real defect. **The ramp disagreed with optuna in the last bit.** It was written
as `start + delta * (i / div)`; `np.linspace` computes `i * step + start` with `step = delta / div`
and then *assigns* the endpoint rather than arriving at it. Same algebra, different rounding —
two indices out of fifty differed at n=50. That would be pedantic if weights were only weights, but
they reach an acquisition whose ties `np.argmax` breaks by first index, which is the same mechanism
that made the ratio-versus-log-difference bug flip a trial.

**Two of my own new tests could not fail**, which the second mutation run said and I would not have.
The `pick_category` case used a row that only just fell short of one, so the answer was the same with
the pin and without it; and the `default_weights` corpus had no length whose endpoint the arithmetic
misses, so the assignment was unobservable. n=29 is the smallest that shows it, and the generator now
refuses to write a fixture without such a length.

18 → 1. The survivor is equivalent: `n < 25` against `n <= 25`, where at n=25 the ramp is empty
either way. `scripts/run_mutants.sh` holds the ratchet — the number may fall, never rise.

**Second measurement, `pyrng`: 16 survivors of 221**, and worse in kind than the first. `random()`,
`randint()` and `choice_index()` could each be replaced by a **constant** with nothing failing. The
reason is structural rather than careless: every faithfulness test for these lives in `dsrust`,
`dsrust-tpe` or `dsrust-gepa`, so the raw Mersenne-Twister stream was pinned in `pyrng` and
everything built on top of it was pinned only in the consumers — and `pyrng` is published on its
own, so a consumer of it alone had nothing at all.

`tests/random_methods.rs` now drives all seven derived methods against CPython's own answers, over
five seeds, **interleaved against one generator** rather than each from a fresh one. That last part
is the point: how far a call advances the stream matters as much as what it returns, and a method
that answers correctly after consuming the wrong number of words is right once and wrong for the
rest of the run. It passed on the first attempt, which says the port was right and merely unwatched.

16 → 4: one equivalent (`hi = len - 1` against `hi = len` in `choices`, unreachable because
`random()` is strictly below one and CPython refuses the all-zero weights that would be the only
other route) and three that hang rather than fail. The ratchet counts a timeout as a survivor —
a mutant the suite never finishes on is a line no assertion pins, and letting timeouts go uncounted
would let the number fall silently as tests got slower.

Remaining: `dsrust-gepa`, and the byte-critical modules of `dsrust` itself, which is the large half.
Expect the `dsrust` run to be slow enough to want scoping by file.
"""
progress = """
dsrust-tpe 18 -> 1 and pyrng 16 -> 4, both ratcheted 2026-08-01. dsrust-gepa and dsrust itself are unmeasured.

2026-08-02. Three crates and one file-scoped slice are ratcheted in `scripts/run_mutants.sh`:
`dsrust-tpe:1`, `pyrng:4`, `dsrust-gepa:27`, and the byte-critical adapter slice at 1 of 133 viable.
What the runs cost is now part of the point — the gepa campaign went from 30 minutes to 8 once the
hangs were gone, which is the difference between a check that gets run and one that does not.

**The story's list of "checks that could not fail" was missing a seventh shape, and it is worse than
the six: a check that does not run at all.** `parse_fuzz` returned early when its corpus was absent,
and the corpus lived in `target/` — so cargo-mutants copies a tree that never has one, and neither
does a fresh clone. The parser's strongest oracle, tens of thousands of differential cases,
contributed nothing to any survivor count. Fixed with a committed fixed-seed sweep the test always
reads.

Sweeping for that same shape found `dspy_loads_and_runs_what_this_crate_saved`: `#[ignore]`, run by
nothing, and its paths written as though `CARGO_MANIFEST_DIR` were the workspace root — so it could
only ever have failed. The README's interop claim rested on it. It is in the gate now, which needs
that venv anyway.

**And a measurement can be void without being wrong-looking.** `run_mutants.sh` built into one fixed
path, so two worktree sessions on this machine shared it — and `dsrust` depends on
`dsrust-json-repair`, so one run's mutated rlib landed where the other's test binaries link from.
The cleanup is `rm -rf`, so the first to finish deleted the other's build directory mid-run. Now
`mktemp -d`. Every survivor count taken before that is void — except gepa's 46, which was
re-measured at exactly 46 and so was real. Nothing about either number said in advance which it
would be, which is the argument for re-measuring rather than reasoning.

**A third rule for the story, beside the two generator disciplines it already names:** a loop that
ends because something *else* maintains an invariant is a loop that hangs the day that thing
changes, and a hang is the one failure no assertion can report. Three of them today —
`parse.rs::next_tag`, `pyset.rs::slot_of` and `resize`, `engine.rs::optimize` — and the last was a
live hazard rather than a mutation artifact: an empty trainset spins GEPA forever.

What remains is scoped as `gepa-mutation-survivors` and `mutation-coverage-gaps`.
"""
outcome = """
2026-08-06/07. Every scope this story named is measured and at a floor of 0:0, recorded in
`run_mutants.sh`'s slice table with each one's history:

    adapter    159 mutants,   1 survivor  -> 0:0
    anthropic   80 mutants,  20 survivors -> 0:0
    ollama     121 mutants,  29 survivors -> 0:0
    openai     173 mutants,  27 survivors -> 0:0
    signature  250 mutants,  21 survivors -> 0:0   (222 after the dead branches went)
    optimize   572 mutants,  73 survivors -> 0:0   (545 likewise)

**The premise held, and the survivors were the "could not fail" list enumerated.** What the six
runs added to it:

  - **A survivor can mean the mutant is the better program.** anthropic's `block()` rebuilt a text
    block as `{type, text}`; the rebuild's only observable effect was stripping `cache_control`,
    so a caller who asked for prompt caching was silently un-asked. The mutant that deleted the arm
    is now the code.
  - **A survivor can mean a branch that cannot be told from its neighbour**, and the tell is *both*
    mutants of a guard surviving. Three found and deleted rather than tested: `union`'s `Option<T>`
    case wrote byte-identical JSON to its general arm, `object`'s is_object guard could not change
    what `node` already answers, and `python_float`'s `is_finite` distinguishes nothing once nan is
    handled. Code that cannot be wrong still costs mutation sites — 250 -> 222 and 572 -> 545.
  - **"Needs an LM" had been standing in for "cannot be tested."** Thirty-seven survivors sat in
    two MIPRO files whose every line runs behind a model call; `DummyLM` is a public export and
    drives all of it.
  - **The distribution is itself a finding.** The byte-verified OpenAI chat wire contributed one
    survivor — `from_env`, which no captured byte can see — while eleven sat in the Responses API,
    the newest wire with the least golden history.
  - **Re-measurement grades the fixer.** Three times a pass's own tests were the next pass's
    survivors: a block-list test on a *user* turn covered `content_and_images` while looking like
    it covered `content_str`; a three-row corpus could not reach a bound that bites at batch ten;
    `asked` had never run while `len` and `is_empty` had. A floor is only trustworthy after the
    run that produced it has been re-run.
  - **A level floor is not evidence the survivors are the same survivors.** The adapter slice read
    1 before and after the json-repair merge, and the set had completely turned over.

The hang class produced its own systematic fix: nine cursor-arithmetic loops hung or threatened to,
every one with the same repair, so the shape is a lint now — `scripts/lints/
cursor_arithmetic_loop.yml`, in `run_rust_gates.sh`.
"""

[[story]]
id = "mipro-remaining-proposers"
sprint = "api"
title = "Two of MIPROv2's four proposer switches are not wired"
state = "done"
shipped = "2026-08-01"
size = "M"
suites = []
plan = """
`compile` takes four `*_aware_proposer` flags. `tip_aware_proposer` and `program_aware_proposer` are
built; the other two are not, and until the parameter table landed nothing recorded that.

  - `data_aware_proposer` with `view_data_batch_size` — dspy shows the proposer a summary of the
    trainset, written by a model reading `view_data_batch_size` examples at a time
    (`DatasetDescriptor` / `DatasetDescriptorWithPriorObservations` in `propose/dataset_summary_generator.py`).
    That is two more signatures to byte-verify and a loop whose model calls draw off the shared RNG,
    so turning it on moves every later draw — it cannot be added as a prompt tweak.
  - `fewshot_aware_proposer` — shows the proposer the demo sets Step 1 bootstrapped, so an
    instruction can be written to suit the examples it will sit beside.

A run today matches dspy with both set to False, which is what the module doc says. The work is the
two signatures, their fixtures, and the RNG order around them.
"""
notes = """
**Two of the three are done.** `data_aware_proposer` and `view_data_batch_size` shipped: the three
signatures of `propose/dataset_summary_generator.py` byte-verified as rendered system prompts, the
batch loop with both of upstream's odd bounds (`max_calls = 10` tested *before* the call, so nine
batches are read; five `COMPLETE` replies end it early), and the swallowed exception that runs
without a summary rather than losing the compile. On by default, as upstream's argument is.

The samples reach the prompt as **Python source**, not JSON — `order_input_keys_in_string(repr(...))`
— and that turned up a defect well outside this story:

  **`repr` of a string picks its quote from what the string holds.** An apostrophe and no double
  quote switches CPython to `"` and leaves the apostrophe *unescaped*: `repr("it's")` is `"it's"`,
  not the single-quoted escaped form. The crate escaped unconditionally, so it disagreed with Python on every value
  carrying an apostrophe — and this was not new code. It was in the helper that renders a **tool's
  arguments** into the ReAct prompt and an **RLM submission**, both shipped. There were two copies of
  that helper, one handling containers and one only scalars; they are one `src/python.rs` now, and
  the quoting rule is measured against CPython rather than assumed.

**`augmented` is a prerequisite, and it was missing.** `gather_examples_from_sets` yields only demos
carrying `augmented`, which dspy sets on the per-predictor trace demos and nowhere else. The crate
never set it. Three things followed from that, found in order:

  - a compiled program's demos were missing a key dspy's carry, so what this crate saves and what
    Python saves differ on it;
  - `optimize/conformance.rs` **filtered the key out of dspy's side** before comparing, so nothing
    could see the absence;
  - and `generate_bootstrap_fixture.py` *invented* `augmented: False` on every demo that lacked it,
    which dspy does not write — whether the key is there at all is the distinction. The filter and
    the invention cancelled, which is why 19 recorded cases agreed.

Now set, recorded as dspy writes it, and compared rather than stripped.

**That pass closed only the traced arm, and this line overstated it for a week.** The projection
came back twice more, and the fix reached only demos earned through `forward_traced` — which the
`Module` trait does not require, so a caller's own module took the untraced fallback and got
*unmarked* demos, which `task_demos` then filtered out entirely. Settled 2026-08-07: every earned
demo is marked, and the comparison is whole-demo in all three places that had narrowed it
(`optimize/conformance.rs`, `mipro/demos.rs`, `generate_demo_sets_fixture.py`, whose
`demo_sets.json` had held zero occurrences of the key on either side). See the commit; the general
lesson is [[projections-hide-divergence]] and it took three sittings to actually land.

`fewshot_aware_proposer` is what remains: `use_task_demos` builds `task_demos` from the demo sets as
`[current] + [after] + [before]` and gathers examples up to `num_demos_in_context`, falling back to
"No task demos provided." when nothing was gathered *or* when `demo_set_i == 0`. The crate passes
that fallback unconditionally today. It needs the proposal loop to know which demo set a candidate
index corresponds to, which it does not thread through yet.
"""
outcome = """
All three shipped. `fewshot_aware_proposer` grounds candidate k in demo set k — dspy's `demo_set_i`
*is* the candidate index — reading its own set first and then the ones after and before it, taking
up to three **augmented** demos and rendering each as `create_example_string` does. Candidate zero
gets the fallback whatever the flag says, which is upstream's `or demo_set_i == 0`: the baseline
proposal is deliberately ungrounded.

**The first golden for it could not fail, and recording what the model was shown is what said so.**
Turning the flag on in two new cases changed nothing: every proposal still read "No task demos
provided." The reason was in the corpus, not the port — the Coach's *baseline* instruction answers
nothing, so Step 1 bootstraps no traces, so every candidate set holds only labelled demos, and
`gather_examples_from_sets` yields only augmented ones. A port that ignored the flag entirely would
have passed.

Two things fixed it. The golden now records `task_demos` — what each proposal was actually shown,
in call order, which is the only place this flag is visible; comparing the proposals alone cannot
see it. And the Coach takes `baseline_solves`, so a case can give the baseline something to answer
and get real demos bootstrapped. Existing cases pass an empty set and are unchanged.

Both mutations go red: removing the adjacent-set rotation, and removing the `augmented` filter.

**The cross-check after writing found one more.** dspy walks
`range(num_demos)[:min(N, num_demos)]`, so the proposal count is capped by how many demo sets Step 1
built — `N` is `num_instruct_candidates` and `num_demos` is the set count. They are the same number
on the explicit path and `n/2` against `n` under a preset, where the instruction count is already the
smaller, so the cap has never bitten and no golden could have shown it. Reproduced anyway: without
it a caller whose counts disagree gets more candidates than dspy would, and indexes past the end of
the sets. The same re-read confirmed three things that were already right — `Signature.fields` is
inputs-then-outputs, the prefix is always resolved upstream (so the crate's `None` fallback to
`infer_prefix` lands on the same string), and the empty-gather case reaches the fallback through
`"\n\n".strip()` rather than by a separate branch.
"""

[[story]]
id = "optimizer-valset"
sprint = "api"
title = "The Optimizer trait takes no valset, and two optimizers need one"
state = "done"
shipped = "2026-07-31"
size = "M"
suites = []
plan = """
`Teleprompter.compile` takes `valset`; the Rust trait takes student, teacher and trainset. GEPA and
MIPROv2 both have one on their own inherent `compile` — GEPA requires it, MIPROv2 splits the
trainset 20/80 when it is not given — so the trait is the odd one out, and an optimizer reached
through `dyn Optimizer` cannot be given a validation set at all.

Widening it is a breaking change to a published trait, which is why it was left when MIPROv2 landed
and is why it wants doing before 1.0 rather than after. `Option<&[Example]>` matches upstream's
`valset=None` and keeps the split behaviour, which `_set_and_validate_datasets` already implements.

Noted in s6's own notes when the trait was designed; the parameter table is what turned it from a
note into three tracked entries.
"""
outcome = """
`Optimizer::compile` and `DynOptimizer::compile_dyn` take `valset: Option<&[Example]>`. The breaking
change is done before 1.0 rather than after, which was the whole reason to do it now.

What `None` means is deliberately each optimizer's own, because upstream's differ and a single trait
default would have to be wrong for one of them:

  - GEPA scores on the whole trainset — upstream's `valset = valset or trainset`, which its own
    docstring warns overfits and is what makes it usable as an inference-time search;
  - MIPROv2 splits — `_set_and_validate_datasets` keeps the first 20% to bootstrap from and scores
    on the last 80%;
  - LabeledFewShot, BootstrapFewShot and COPRO **refuse** one. They never score a candidate, and
    upstream's `compile` has no such keyword, so passing one there is a TypeError. Silently dropping
    it would be worse than refusing: a caller would believe their validation set was being used.

The refusal follows the precedent already in the trait — an optimizer with no use for a teacher
refuses rather than ignores — and `an_optimizer_that_never_scores_refuses_a_valset` holds it.

GEPA's `Optimizer` impl doc said it reuses the trainset as "dspy's default when none is given". That
read as the same mistake `mipro-auto-minibatch` had just found, and it is not: checked against the
pin, GEPA's default really is `valset or trainset`. Two optimizers, two defaults, and the doc now
says which is which so the next reader does not have to check again.

The three `Teleprompter.compile.valset` ledger entries that pointed here are `mapped`.
"""

