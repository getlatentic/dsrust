[package]
name = "dsrs-bridge"
version = "0.1.0"
edition = "2024"
publish = false

# A thin PyO3 shim so Python DSPy's own pytest suite can drive this crate's renderer. It
# exists only for conformance: nothing in `dsrs` depends on it.
[lib]
name = "dsrs_bridge"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dsrs = { path = ".." }
# No `extension-module` feature: current PyO3 recommends against it, because it disables
# Python linking for tests and binaries and produces undefined _Py symbols. build.rs supplies
# the macOS link arguments instead, scoped to this crate rather than the whole workspace.
pyo3 = "0.29"
serde_json = "1"

[build-dependencies]
pyo3-build-config = "0.29"
