# The pinned environment the conformance harness runs against. `uv sync` reconstructs it into
# .venv. Versions match scripts/DSPY_VERSION and scripts/pins.py.
[project]
name = "dsrust-conformance"
version = "0"
description = "Pinned dspy/gepa/optuna environment for DsRust's conformance harness."
requires-python = ">=3.12"
dependencies = [
    "dspy==3.3.0",
    "gepa==0.1.1",
    "optuna==4.9.0",
    "pytest",
    "pytest-asyncio",
    "maturin",
    "pillow",
    # dspy builds its evaluation display table with pandas, and `test_evaluate` compares the frame
    # it produced. Bounded below 3 because dspy 3.3 asks for `pandas>=2.1.1` and 3.0 renames a
    # column it reads back — an upstream/pandas mismatch, not this port's.
    "pandas>=2.1.1,<3",
]

[tool.uv]
package = false
