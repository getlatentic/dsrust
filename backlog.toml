rationale = """
Cross-cutting polish rather than a feature: dsrs uses anyhow throughout where dspy has ~18 error
types. The taxonomy stayed deliberately small — a caller branches on error *identity* in exactly
one place upstream, and that one is built. Adding the other seventeen would be API surface no
caller reaches, which is why only the reachable branch was ported.
"""
