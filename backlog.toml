[[story]]
id = "gepa-mutation-survivors"
sprint = "conformance"
title = "Twenty-seven lines of the flagship optimizer that no test constrains"
state = "done"
size = "M"
suites = ""
plan = """
Measured 2026-08-02 with `./scripts/run_mutants.sh dsrust-gepa`. **The floor is 24, not the 27
this said until 2026-08-07** — three were closed after the number was written here and the ratchet
moved without the story following. Read `run_mutants.sh` for the live figure; a count in prose is a
transcription, and this one had drifted. The number
was 46, re-measured at exactly 46 under the fixed methodology before anything was closed — so unlike
the adapter slice these are real gaps rather than an artifact of the shared build directory. Nineteen
were closed the same day; these are what is left, and they live in a shell-script comment until they
live here.

**`engine.rs` — 11.** Two clusters. The metric-call budget arithmetic at 222-252: `>` against `>=`
on the budget check, and the `-=`/`+=` on `merge.due` and `merge.total_tested`, which decide how
many merges a run attempts. And the candidate-selection comparisons — `select_with`'s `<` and the
three at 352 — which decide *which parent* a reflective step rewrites. Both are consequential and
neither has a case that separates the spellings: a merge schedule is only observable across several
accepted programs, and a selection tie only where two candidates score the same.

**`merge.rs` — 6** and **`instruction_proposal.rs` — 6.** The second is fence parsing on a
reflection reply, which is the same shape as the adapter's parse side and should be closed the same
way: a corpus of replies run through gepa's own parser, refusals included.

**`pyset.rs` — 3, all equivalent** and marked as such in the source. A wider probe bound is still a
bound; `minused` against `minused + 1` cannot differ because `add` only ever calls resize with
`fill * 4` where the tripping fill is 5, 19, 77 — never a power of two.

**`batch.rs` — 1.**

**What proves it.** The ratchet falls. It is a floor, not a target of zero: some of the 27 will turn
out equivalent like pyset's, and the work is to say which rather than to reach a number.
"""
outcome = """
2026-08-07. **46 -> 13 over three passes, and the thirteen left are every one a reasoned equivalent
with its note in the source** — the fence walks (4), the anti-stall guard (2), `merged_candidate`
and the pair swap (2), `select_eval_subsample`'s two `> 0` guards (2), and `pyset` (3). Floor
lowered to 13 in `run_mutants.sh`, which now carries the reason for each the way the other
baselines do; gepa was the one entry with a bare number and no note.

**Each pass graded the one before it, and both times the residue was the previous pass's own test.**

  - Pass two: the merge cap had never bitten — generator and test both hard-coded
    `max_merge_invocations=5` and no case accepts five merges, so the cap comparison, the `due`
    decrement and the `total_tested` increment were all unreachable. A capped case went in and
    killed *none* of its five, because at two components every cap from 1 to 5 reproduces the same
    run: the extra attempts a larger cap allows all come back with no mergeable pair. Sweeping the
    cap space found that three components discriminate — at seed 3, cap 1 accepts 2 merges over 12
    candidates, cap 5 accepts 4 over 14, cap 0 forbids merging. All three arms recorded, since the
    *pair* is what separates `total_tested < cap` from its neighbours.
  - Pass three: `num - selected.len()` against `num + selected.len()` in the subsample's take is
    **invisible in the returned ids**. The list is truncated to `num`, and CPython's `sample`
    returns the same prefix for a larger `k`, so a round taking one too many changes nothing that
    was being compared — only where the generator was left. Every subsample case now records the
    next draw, which is the assertion the selector fixture had and this one did not; the existing
    `balanced` case was already enough to kill it once the fixture looked.

**Two findings that were not tests.**

  - `select_eval_subsample`'s agreeing bucket was spelled `a == b`; gepa spells it as the
    *complement* of the two ordered buckets. The two disagree on nan — it compares false against
    everything, so a nan pair falls out of both orderings and into gepa's third bucket, where the
    `==` reading left it in no bucket at all. Reachable: `optimize/gepa/metric.rs` already handles
    a nan score on the way to a prompt. Fixed to upstream's spelling, with a `nan_pair` case
    carrying the value as a string because JSON has no nan, and the old spelling now fails it.
  - `MergeProposer.schedule_if_needed` looks like a second `merges_due` increment site and has
    **zero callers** — dead code upstream, which is why a cap of 1 can still accept two merges.

**And the coin exactly on epsilon.** `select_with`'s `<` needed `rng.random()` to equal epsilon,
which no fixed epsilon reaches by chance — so the fixture sets epsilon to a seed's own first draw.
gepa sends the tie to `idxmax`; a `<=` port takes the uniform draw instead. The golden records the
index that port would land on, and the generator refuses to write a tie where the two agree.
"""

