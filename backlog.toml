[[story]]
id = "gepa-reflective-dataset"
sprint = "conformance"
title = "GEPA reflects on the first turn where dspy draws a random one, and nothing pins either"
state = "done"
size = "M"
suites = ""
plan = """
Found 2026-08-23 while triaging `surface-the-other-way`: reading `gepa_utils.py` beside
`optimize/gepa/adapter.rs` to write one ledger entry for `Example::rendered`.

**Nothing has ever pinned `make_reflective_dataset`.** `generate_gepa_engine_fixture.py` stubs it —
the fake adapter it drives returns a canned dataset so the *engine* can be measured — so the
function that decides what the reflection model is shown has no oracle on either side. Every other
part of GEPA is compared against the package; this one is compared against nothing.

**The divergence that costs the most.** dspy picks which trace instance to reflect on with
`self.rng.choice(trace_instances)`; this crate takes `.find(|step| step.predictor == predictor)`,
the first. They agree only when a predictor ran once per example. **ReAct pushes one `TraceStep`
named `react` per turn**, so a multi-turn program has several, and GEPA over a ReAct is a supported
call here.

Measured against the real `DspyAdapter`, a two-hop module calling one `Predict` twice:

    seed 0: reflected on the SECOND hop  ['Paris', 'the Seine']
    seed 1: reflected on the first hop   ['capital of France?', 'capital of Germany?']
    seed 2: first        seed 3: first

So the port is right at three of those four seeds by coincidence and wrong at the fourth, and which
turn the reflection sees changes what the optimiser learns.

**Contained, which is the good news.** `gepa.py:553` builds `rng = random.Random(self.seed)` and
hands it to the adapter, but passes `optimize(..., seed=self.seed)` — the engine builds its *own*
generator from the same seed. Two streams from one seed, not one shared stream, so an adapter-side
draw does not desynchronise the engine. The fix is a second `Random` on `Adapter`, not a re-thread
of the run.

**Two smaller ones in the same function.**

  - **Match key.** dspy selects `[t for t in trace if t[0].signature.equals(module.signature)]` —
    by *signature equality*, so two distinct predictors sharing a signature both match. This crate
    matches the predictor's name. Closing it needs the signature on `TraceStep`, which is why it is
    separable from the draw.
  - **`History` is not hoisted.** dspy lifts a `History` input out of the field map into a fenced
    ```` ```json ```` block under a `Context` key and drops the original key; this crate renders it
    as an ordinary field. `adapter/types/history.rs` exists and `optimize/gepa/` never mentions it,
    so the shape reaching the reflection model differs whenever a signature carries history.

**The feedback callback was two arguments here and five upstream — closed 2026-08-23.** dspy calls the caller's metric
as `metric_fn(module_inputs, module_outputs, captured_trace, pred_name, trace_for_pred)`, where
`trace_for_pred` is `[(predictor, selected_inputs, selected_outputs)]` — the *selected* instance.
This crate's is `Fn(&Example, &Prediction) -> Feedback`, so which predictor is being reflected on
and what it saw never reach the metric, and the per-predictor feedback function that GEPA's own
docs treat as the idiom cannot be written. Upstream also calls it once per selected instance where
this crate computes one module-level feedback per example and reuses it. The bare-score default
(`This trajectory got a score of {o}.`) was already ported; the arity was not. Unrecorded anywhere
before 2026-08-23 — not in the ledger, not in the backlog, not in a source comment.

`MetricContext` carries dspy's last three arguments as one struct, since two are absent half the
time and an `Option` says which moment the metric is in. `Captured` now holds the example and the
prediction rather than a feedback sentence, because the text is computed at reflection time as
upstream computes it, once per record, from the instance that was drawn — and the score stays the
one scoring produced, which is what dspy's `fb["score"] = module_score` does. The conformance test
compares `Feedback` as well now: upstream's text names the hop that was drawn, so it is the
strictest witness that the same instance was picked, and the projection its doc used to declare is
gone. Confirmed red with a metric that ignores the context: `reflected on -` against
`reflected on Paris`.

**The `History` hoist and the signature-equality match — closed 2026-08-23**, and both wanted the
same missing thing: the predictor's signature on `TraceStep`. A name cannot answer either question.

  - **Signature matching.** Upstream filters `t[0].signature.equals(module.signature)`, and
    `equals` compares instructions *first* — so two identically-declared predictors pool their
    instances the moment their instructions agree, which is exactly the seed candidate, before GEPA
    has rewritten either. Measured against dspy at four seeds: **every one has a component
    reflecting on a step belonging to the other predictor**, which matching by name never does.
  - **The `History` hoist.** dspy lifts a `History` input into a fenced `Context` key and drops the
    original field; each message is `str(message)` on a Python dict, so the block holds
    single-quoted reprs inside a fence that says json. `python::repr` already rendered that for the
    prompts showing Python source. Upstream decides by `isinstance`; this decides by the
    signature's annotation, which `adapter::history::field_name` already answers.

**And `Signature.equals` was in the ledger as "reproduced as `PartialEq`", which it is not.**
Upstream compares the instructions and each field's `json_schema_extra` — side, prefix, description
— and **not** the annotation. Derived `PartialEq` compares the kind, the closed set and the
constraints too, which is stricter and would pool fewer instances than dspy pools. Written as
`Signature::equals` and reclassified `mapped`; the API gate then asked for its parameter, which is
the gate working.

**And one option, not a defect.** `add_format_failure_as_feedback` defaults to `False` upstream, so
dspy's default also drops format-failure traces — which is what this crate does unconditionally.
The gap is the missing knob, not a wrong answer; it belongs with `api-3`'s constructor audit.

**What proves it.** A generator driving the real `DspyAdapter.make_reflective_dataset` over a
program whose trace repeats a predictor, a `History` case beside it, and a Rust test comparing whole
records — not a projection of them, for the reason `projections-hide-divergence` gives.
"""

done = """
Found already built, recorded as `todo` — the shape this project keeps finding, a record that
stopped being true rather than work that was not done.

What is in the tree: `scripts/generate_gepa_reflective_fixture.py` drives the *real* `DspyAdapter`
rather than the engine fixture's stub, `Adapter` carries its own `Random` and draws with
`self.rng.choice_index(instances.len())` where it used to take the first match, and
`reflects_on_the_instance_dspy_draws` compares against the golden at four seeds.

The four seeds are the point. dspy's `rng.choice(trace_instances)` lands on the second hop at seed
0 and the first at 1–3, so a fixture at a single seed would have agreed with a port that never
draws, three times in four. `Feedback` is compared alongside the inputs because upstream's text
names the hop it drew — two records can share inputs and still disagree about which step the
feedback describes, so it is the strictest witness that the same instance was picked.

Verified by running it, not by remembering it: `optimize::gepa` is 14 tests, green, and the two
that carry this are `reflects_on_the_instance_dspy_draws` and
`the_reflective_dataset_carries_the_captured_trace`.
"""

