[[backlog]]
id = "b5"
title = "A predictor traced twice for one example takes its last trace"
kind = "known-divergence"
# Skipped, not deferred. Nothing here is pending and nothing should reopen it without new facts.
decision = "skipped"
state = "skipped"
closed = "2026-07-21"
detail = """
When one predictor produces several traces for a single example, dspy collapses them to one demo,
choosing evenly between the last trace and a random earlier one. The choice is seeded with
Hasher.hash(tuple(demos)), xxhash64 over pickle.dumps, and src/optimize/bootstrap.rs::file takes
the last trace instead. That agrees with upstream whenever upstream's coin lands on the last one.

The reason is NOT that the pickle bytes are unportable — they are a fixed template (protocol 4,
STACK_GLOBAL on dspy.primitives.example/Example, NEWOBJ, then a _store/_demos/_input_keys state
dict with memo refs) and xxhash64 has a Rust crate. It is that **upstream's own seed is not
reproducible across processes**. `_input_keys` is a Python set, so its pickled order follows
per-process randomized string hashing: with two or more input keys the digest changes run to run.
Measured on unmodified dspy — five processes, same code and data, and the fifth disagreed with
the other four.

Two things settle it beyond "it is hard".

**The RNG is not the gap.** `src/optimize/rng.rs` already reproduces this exact generator —
CPython's Mersenne Twister, held to `tests/conformance/rng/cpython_random.json`. Pickle sits
*outside* it: object → bytes → xxhash64 → hex digest → seed → two draws. Even the seeding path
is well defined; measured, `random.Random("a6311e…")` equals `random.Random(int.from_bytes(s +
sha512(s)))`, a 639-bit key through `init_by_array`. All of that is portable. The one input that
is not is the pickled order of `_input_keys`, a Python `set` — deterministic *within* a process
(1000 hashes in one run gave one value) and different between processes, because CPython seeds
string hashing per interpreter.

**Porting it anyway would make agreement worse.** A Rust pickle would yield a deterministic seed,
but our own rather than upstream's, so it is an independent coin. Two independent coins agree less
often than one fixed choice matching a coin — measured over 400k trials: always-last holds 0.500
at any size, while an own coin gives 0.501 at two traces, 0.376 at three, 0.314 at five, 0.287 at
eight. Taking the last trace is the *optimal* strategy once the seed is unreachable, not a
shortfall. Taking the last trace is at least deterministic. This is the one place in the port
where byte-faithfulness is unreachable, and it is upstream's nondeterminism rather than a gap
here. Revisit only if upstream reseeds on something stable.

Only reachable when a predictor is called more than once per example, which means a loop: ReAct's
per-turn predictor is the case in this crate. A pipeline whose predictors each run once never
reaches the branch, and neither does any single-predictor program.
"""

[[backlog]]
id = "b7"
title = "PythonInterpreter, and the modules that need it"
kind = "unscoped"
detail = """
dspy runs generated code in a Pyodide sandbox by shelling out to `deno run`. Deno is not a dspy
dependency — it is a prerequisite a user installs — so a Rust port carries the same external
requirement and std::process::Command does what subprocess does. Portable, in other words, and
earlier notes calling it blocked were wrong.

What it actually waits on is purpose: PythonInterpreter exists for rlm.py, code_act.py and
program_of_thought.py. Port those and the interpreter comes with them; port the interpreter
alone and nothing uses it. Size the three modules before scheduling any of it.

Decided 2026-07-21: a trait with two implementations, not one choice.

`deno` + pyodide is the default and the conformance target, because it is literally the sandbox
upstream runs — identical behaviour by construction, and the external prerequisite is one dspy
already imposes rather than one this crate adds. `rustpython` rides alongside as an opt-in for a
caller who will not install deno.

It has to be a seam rather than a swap because the interpreter's output *reaches the model*:
`ProgramOfThought` feeds it back as `code_output`, an InputField desc'd "output of
previously-generated python code". Float formatting, exception text and dict ordering all land in
the next prompt, so a second interpreter is a documented divergence a caller opts into — the same
shape as `LM::without_cache`, and the same seam pattern as ChatModel/Adapter/Optimizer.

The options, and why the default is the default:

  deno + pyodide   what dspy does. Same external prerequisite, and identical behaviour because
                   it is literally the same sandbox.
  wasmtime         pyodide's wasm hosted directly, no deno. Pyodide is Emscripten-built and
                   expects JS glue for its syscalls, so this needs proving before it is planned.
  rustpython       a Python interpreter in Rust, in-process, no external runtime at all. Buys
                   the dependency back at the cost of a different interpreter's behaviour.
  pyo3             rejected. It embeds CPython with full host access, which removes the sandbox
                   that is the whole point. It stays what it already is here: the test bridge.
"""

[[backlog]]
id = "b3"
title = "Streaming, callbacks, clients"
kind = "scoped"
state = "next"
detail = """
Sized against dspy 3.3.0b1 (2026-07-22). Key finding: dspy 3.3's LIVE streaming is litellm-based —
streaming/streaming_listener.py imports litellm's ModelResponseStream and reads
chunk.choices[0].delta.content. The TYPED streaming vocabulary (LMStreamEvent, LMDelta, LMStream,
LMOutputBuilder) is STAGED and unwired: grep for its importers outside core/types.py returns
nothing. So it is the same situation as LMRequest/LMResponse were — dspy defines the typed
streaming design but does not ship an implementation. Wiring it puts us ahead of 3.3 again.

We already ported the typed vocabulary (commit d76b9c9): LmStreamEvent (Start/Delta/OutputEnd/End/
Error), LmDelta (six), LmOutputBuilder (assembly, mutation-tested), LmStream (over an Iterator).
None is wired to a live call. There is NO dspy reference for provider-SSE -> LmStreamEvent (dspy
uses litellm), so that mapping is ours to design faithfully to OpenAI's SSE + the typed events.

STREAMING SHIPPED — layers 1 and 2, both providers and streamify:
- 903576d: LM::forward_stream, OpenAI SSE -> typed events, LmOutputBuilder assembly, socket test.
- d0013fb: incremental (reqwest bytes_stream), over a shared byte-framing core (src/lm/streaming.rs)
  a provider drives with only its Framing (separator + frame->events map). Buffered read gone.
- 95f160e: native Anthropic (SSE, usage split across message_start/message_delta) and ollama
  (line-delimited JSON), each frame-mapper unit-tested; the synthesised fallback is gone.
- faabebe: layer 2 — adapter::stream_field (dspy's StreamListener): watch a field's
  [[ ## name ## ]] marker in the delta stream and yield that field's tokens (marker-split-across-
  deltas handled, partial-marker held back). Runs over an LM event stream.

REMAINING (streaming): the program-level streamify wrapping — thread forward_stream through
Predict and across sub-predicts so a whole program streams, plus the JSONAdapter `"field":` marker
(stream_field is ChatAdapter-only). callbacks and tests/clients still unsized.

(historical sizing below.) Remaining under layer
1: incremental read (production is buffered — body read whole before events handed out; no stub
test can tell), and native SSE for Anthropic/ollama (they use the synthesised-from-forward
fallback today). Layer 2 (streamify) is untouched.

Original sizing, for the rest:

1. LM-level typed streaming. A streaming method on ChatModel — forward_stream returning an async
   Stream<Item = Result<LmStreamEvent>> + a DynChatModel boxed form (the object-safety pattern,
   same as forward/forward_dyn). Each provider does a stream:true request over reqwest
   bytes_stream, buffers SSE frames (split on blank line, `data: {json}` / `data: [DONE]`), maps
   each chunk to events: content delta -> LmDelta::text under choice.index; finish_reason ->
   OutputEnd (truncated = finish_reason=="length"); the stream frames Start{model} first and
   End{usage} last (usage from the include_usage final chunk). LmOutputBuilder assembles the
   final LmResponse. Anthropic/ollama each have their own SSE shape. NOTE the dead-code wall: the
   streaming method must land WITH a public entry (LM::forward_stream) or its first caller, or it
   trips the 0-warning gate — so slice 1 ships the trait method + OpenAI impl + a public LM entry
   together, tested against a stub emitting a canned SSE body.

2. streamify (program-level field streaming). dspy's StreamListener watches a signature field by
   its marker — `[[ ## field ## ]]` for ChatAdapter, `"field":` for JSONAdapter — and yields that
   field's tokens as they arrive (streaming/streaming_listener.py). Port StreamListener +
   streamify over the layer-1 stream: a stateful watcher scanning the assembled text for the
   field's start/end markers, emitting the field's delta tokens. This is adapter-aware and builds
   on layer 1.

Async note: dspy has sync forward + async aforward; Rust needs only the one async forward (a sync
caller uses block_on), so there is nothing to unify — the single async ChatModel::forward already
is both. callbacks and tests/clients remain unsized; size separately.
"""

[[backlog]]
id = "b4"
title = "Publish to crates.io"
kind = "release"
detail = """
Not blocked by scope — blocked by deciding what the 0.1 API surface promises. Adapter::format
became fallible once already; another such change after publishing is a breaking release.

**Restated 2026-08-27, because the entry no longer described the state.** An alpha is already
published: `dsrust`, `dsrust-gepa`, `dsrust-tpe`, `dsrust-derive` and `pyrng` all went out on
2026-07-24 at the versions this tree carries, with this project's own descriptions. The naming
question this was written around is settled — `dsrust*` rather than the taken `dsrs`/`gepa`/`tpe`
— and the API-promise worry it names is about the *next* release, not the first.

What is actually blocking a fresh publish, checked rather than assumed:

  - **`dsrust-json-repair` has never been published**, and `dsrust` depends on it by both path and
    version. It has to go up first or `dsrust` will not resolve. `cargo publish --dry-run` on it is
    clean: 39 files, 322 KiB, verifies and builds.
  - **The published alpha is a month and 255+ commits stale.** Everything since — the typed LM
    boundary, the reasoning-model split, `Flex`, the completion-temperature rule — is unreleased, so
    a republish is a version bump rather than a re-cut of the same tree.

Publishing is outward-facing and irreversible, so it waits on the owner saying go. What no longer
waits on anything: which names, whether the metadata is complete (it is, on all six), and whether
the one unpublished crate packages cleanly (it does).
"""

