id = "api-5"
sprint = "api"
title = "Re-read every ledger classification, assuming the author was wrong"
state = "done"
size = "L"
suites = []
plan = """
Four classifications were checked by the owner in one session and four were wrong. That is the
prior to work from: an entry says what its author believed when they wrote it, and nothing since
has re-read it against either side.

The three found by reading:

`num_retries` and `provider` were divergences describing what exists rather than justifying an
absence. dspy retries three times with backoff by default and this crate retries zero.

`callbacks` was worse: its reason asserted that dspy's six callback points "emit tracing spans
here", and there is not one span in the tree. A claim that was never true, reading as resolved for
as long as nobody looked.

The fourth was found by scanning divergence reasons for asserted capabilities, and it runs the
other way: fourteen `LM*Error` entries said "the message carries it; nothing branches", written
before `LmErrorKind` existed. Every one is a variant now and `is_retryable` branches on four of
them. Classified as missing while present — the safer direction to be wrong in, and still wrong.

Two lessons for the pass:

An entry goes stale when the crate *gains* something, not only when it loses it. Nothing rereads a
divergence after the gap it describes is closed.

The automatic checks do not find this. Grepping a reason for identifiers it names found two hits,
both benign, both naming Python. The callbacks reason named no identifier at all; it claimed a
capability in prose. Thirty-four reasons currently assert one, and each has to be read.

Work them in that order — asserted capability first, then every divergence written before the
feature it disclaims, then the mapped entries whose identifier resolves to something too generic
for the grep to be evidence.

**What proves it.** A reading pass over a ledger, so nothing green proves it. What can be gated is the result: every
reason that asserts a capability names a Rust identifier the gate greps for, and the thirty-four
asserting one today become zero unverified.

---

**Closed 2026-08-24.** All four detection methods were run, three of them are now gates, and every
one found something on its first use. What the pass actually found, in the order the story
prescribed:

  1. **A module's `__all__` against the tree** — already `check_pinned_all.py`, and it was resolving
     the pin by *tag name*, which `actions/checkout` does not fetch. It reads the gitlink now.
  2. **Generic `rust` values** — the story's own "do it first". The Rust-surface check matched by
     identifier *part*, so a bare `new` accounted for all thirty-five constructors: 408 of 830
     items rested on a word, 117 of them genuinely ambiguous. A bare name now counts only where
     exactly one public item ends in it, which reopened 104 entries an hour after they read as
     classified. Then the same shape on the other side: 59 `mapped` entries whose whole `rust` was
     one ambiguous word, the `LMRequest.from_call → new` failure. 59 qualified.
  3. **Capability claims** — `check_ledger_claims.py`, new. Substitutions are held to the tree,
     qualified paths are checked on every entry and every status, and `with_`-prefixed names are
     checked against *both* trees. Four capability claims naming nothing checkable are a floor, and
     each describes dspy's behaviour or an absence here.
  4. **Reading** — all 128 constructor/parameter divergences and all 158 symbol/method ones.

**The defect tally: 39 dead names, 8 false claims, 1 self-contradiction, 3 parameters naming a
Python method, and 1 substitute a caller cannot reach.** Every one had *stopped* being true rather
than never being true — which is the argument for gating prose at all: no test catches a rename,
and no test catches a substitute that got built somewhere else.

Three findings worth keeping:

  - **"Tracing carries the event" appeared four times and was false three of them.** `GEPA.log_dir`,
    `MIPROv2.log_dir`, `GEPA.warn_on_score_mismatch` and `MIPROv2.verbose` all claimed it; neither
    optimizer emits a single span. It is the same shape as the `callbacks` entry this story opens
    with, written four more times by someone who had read that story.
  - **One refactor, 35 stale references.** Builder setters dropped their `with_` prefix to match
    dspy's parameter names, and 23 distinct names across 35 references never followed —
    `with_max_iters`, `with_fail_count`, `with_breadth`, `with_lm`. None was qualified, so no
    `::`-based check could see them.
  - **`Example.without` pointed at `subset`, which is private.** A substitute a caller cannot reach
    is the same failure as one that does not exist.

And the instrument was the defect four times over: an empty `git grep` set made 19 correct entries
look wrong, a `pub`-only walk reported a private helper missing, a walk without struct fields
reported three `pub` fields missing, and a parser keyed on the implementing type could not see that
a trait owns its own methods. Each time, trusting the check would have meant "fixing" what was
right.

**A third pattern, found while filing lm-from-call.** `LMRequest.from_call` was mapped to `new`, and
`LmRequest::new` implements one of its three input shapes. The gate passed because `new` exists — the
most generic identifier in Rust. Sixteen mapped entries name one from that class: `new`, `get`,
`items`, `args`, `name`, `metric`, `score`, `timeout`, `message`. For each, the grep proves the word
appears somewhere in the tree and nothing more.

That one is mechanisable rather than a reading pass: refuse a bare generic name as a `rust` value and
require `Type::method`, so the grep has something specific to find. Do it first — it turns a
sixteen-entry reading list into a gate, and it is how `from_call` was caught.

**A fourth, and the check that found it.** Running `core/types.py`'s own `__all__` — twenty-nine
names — against the tree found twenty-eight present and two constructor helpers absent. One of the
two, `Developer`, was classified `divergence` because it is "reproduced via Role + LmMessage", and
`Role` has User, Assistant, System and Tool. No fourth variant. The same untrue-substitution shape as
`callbacks`, and inconsistent with `LM.use_developer_role` which was already `todo` — one gap wearing
two classifications.

Running a module's `__all__` against the tree is the cheapest check here and it is not automated.
Do that for every module in `PORTED_MODULES` before reading anything: it is mechanical, it needs no
judgement, and it found a bad entry on its first use.
"""

