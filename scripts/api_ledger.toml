"adapters/base.py::Adapter.callbacks" = { status = "divergence", reason = "dspy fires a BaseCallback at six points and all six are ported: `Callback` in src/callback.rs, fired from src/observe.rs, this adapter's format and parse included. What has no counterpart is the *per-instance list*. Upstream stores one on every Adapter through the base class and unions it with the configured ones; a Rust Adapter is a trait an implementor writes, with no shared __init__ to hold a list. So the list is per process (configure_callbacks) or per model (LM::with_callbacks), and a handler is told which adapter it is watching, which is what a per-instance list is read for here. tests/callback.rs holds the sequence to dspy's own" }
