# The rest of `dsrust`'s invented surface, and it has three recurring causes.
#
# **No object identity.** dspy's trace holds the predictor itself and its types stay live across a
#   program's turns; this crate keeps data, so a name or an id has to be carried (`relabel`,
#   `TraceStep`'s signature, `to_value_with_ids`).
# **No reflection at run time.** `inspect.getsource` for a reward function, a pydantic `FieldInfo`
#   for a description — the caller states what Python reads for free (`Refine::code`).
# **A trait cannot decorate its implementors.** `__init_subclass__` watches every dspy subclass on
#   its way into existence, so the Rust answer is to watch the *caller* (`formatting`, `tool_call`).
