"utils/constants.py" = { status = "no_surface", reason = "one string constant, `IS_TYPE_UNDEFINED`, marking a signature field whose type was never declared" }

# ── shipped, but raises before doing anything ─────────────────────────────────────────────────
"predict/avatar/avatar.py" = { status = "upstream_dead", evidence = "api/upstream_dead_api.json", reason = "`Avatar.__init__` calls `dspy.TypedPredictor`, removed in dspy 2.6. Constructing one raises `AttributeError`, so the module has no behaviour a port could match — the tool loop, the per-iteration `action_1`/`result_1` signature growth and the `Finish` tool have never run in this release" }
"predict/avatar/models.py" = { status = "dead_consumer", only_for = ["predict/avatar/avatar.py", "predict/avatar/signatures.py", "teleprompt/avatar_optimizer.py"], reason = "`Tool`, `Action` and `ActionOutput` are plain pydantic models and build fine; nothing live reaches them. Their importers in the pinned tree are `Avatar`, the `Actor` signature and `AvatarOptimizer`, and all three raise. `Tool` here is unrelated to the one in `adapters/types/tool.py`, which is ported" }
"predict/avatar/signatures.py" = { status = "dead_consumer", only_for = ["predict/avatar/avatar.py"], reason = "`Actor`, the signature `Avatar` grows a field at a time. A class like any other, and never rendered: the only importer in the pinned tree is `Avatar`, which cannot be built" }
"teleprompt/avatar_optimizer.py" = { status = "upstream_dead", evidence = "api/upstream_dead_api.json", reason = "exported in `dspy.teleprompt.__all__` and unconstructable: `__init__` reaches `dspy.TypedPredictor` for its `Comparator`. Its student must be an `Avatar`, which also raises, so neither half of the pair can run" }
"teleprompt/signature_opt.py" = { status = "upstream_dead", evidence = "api/upstream_dead_api.json", reason = "deprecated in favour of COPRO and broken by that same move: `COPRO.__init__` dropped `verbose`, and this subclass still forwards seven positional arguments to a constructor taking six, so every call shape raises `TypeError`. COPRO itself is ported" }

