**What the 150 resolved to.** 104 are the thirteen `LM*Error` classes × the eight fields they inherit
from `DSPyError.__init__`, all on `LmFailure` — `code` landing on `kind`, since here the class *is*
the code. The rest are field-for-field: the media types, the REPL types, `LmMessage`, `LmRequest`.
Four divergences: `callbacks` and `native_response_types` on both adapters (the same answer their
base classes already carry), and `Tool.has_kwargs`, which dspy sets by finding a `VAR_KEYWORD`
parameter on the wrapped callable — a Rust function has none, and an argument the schema does not
name is an error here, which is upstream's `has_kwargs=False` arm.

**What proves it.** Three controls, all run: a `mapped` entry naming a Rust item that does not exist
fails the gate; a parameter with no entry fails it; and `assert_pinned` fires on a tree that is not
the pin. The third found a bug in the guard itself — it checked only the installed side, so a missing
*pinned* file raised `FileNotFoundError` instead of saying which tree was wrong.
"""

