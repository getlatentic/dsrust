[[sprint]]
id = "s3"
name = "Optimizer conformance"
state = "done"
shipped = "2026-07-21"
outcome = """
The crate's own optimizer is held to upstream's behaviour, not just to its own tests.
This is the sprint that closed the project's one known blind spot.
"""

[[story]]
id = "s3-1"
sprint = "s3"
title = "Prove the crate's BootstrapFewShot makes upstream's decisions"
state = "done"
size = "L"
done = """
Trace replay, chosen over routing compile into Rust and recorded in src/optimize/conformance.rs.
scripts/generate_bootstrap_fixture.py runs upstream's optimizer against a DummyLM answering from
a fixed table, so a compile is a pure function of trainset, metric and configuration. Nineteen
single-predictor cases compare demo for demo; a second check compares what every attempt was
*shown*, which is where withholding and teacher priming live; and five two-predictor cases
compare each predictor's demos, which is what makes the raw_demos rebinding visible — upstream's
own answer hands the second predictor the first's sample in a different order.

Mutation testing drove the shape of all three. Of the deliberate wrong decisions tried, every one
that changes behaviour is caught by a named check; the survivors were equivalent rather than
missed, and one of them turned out to mark a branch that could never fire, which was then removed.
"""
remaining = """
Unasserted, and not assertable here: max_rounds forcing a *different* answer (b2). A
deterministic model cannot distinguish a re-ask that was forced from one that was not, so the
attempt count matches upstream while the forcing does not exist. b5 records the other limit.
"""
narrative = """
As someone trusting dsrs to compile a program, I want the crate's optimizer held to dspy's
own behaviour, so that a compiled program is the one dspy would have produced.
"""
problem = """
teleprompt/test_bootstrap.py is green and every test crosses into Rust — through the ADAPTER,
while running dspy's Python optimizer. src/optimize/ is not reachable from the bridge at all.
The crossing counter cannot catch this: a crossing proves some Rust ran, not the right Rust.
"""
acceptance = [
  "A failing check exists BEFORE the fix: a deliberate wrong decision in src/optimize/bootstrap.rs is caught",
  "Identical traces drive both implementations and the demos kept match — same examples, same order, same count",
  "Divergences upstream owns are asserted, not smoothed: raw_demos rebinding, and any-non-zero-metric-succeeds",
  "Documented limits stay documented and are asserted as limits, not quietly passed",
]
subtasks = [
  "Choose between trace-replay and routing compile into Rust; record the reasoning where the choice lives",
  "Capture upstream traces for a fixed trainset and metric via generate_fixtures.py",
  "Compare kept demos across both, including max_labeled_demos and max_rounds boundaries",
  "Mutation-test: break each ported decision, confirm a named check fails",
]
notes = """
Routing compile into Rust is hard — upstream drives model calls from Python, so Rust would
call back mid-loop. Trace replay is tractable because the optimizer's decisions are pure
logic given traces even though the driving is I/O.

Comparing demos by identity is only possible because src/optimize/rng.rs reproduces CPython's
Mersenne Twister. A demo list is a deterministic bootstrapped prefix followed by a tail drawn
by random.sample; under the xorshift generator that preceded it the tail could never match
dspy's, and the acceptance criterion below would have had to be weakened to a structural
comparison. Anything that changes the generator reopens that.
"""

[[story]]
id = "s3-2"
sprint = "s3"
title = "Per-predictor demos for a multi-predictor program"
state = "done"
size = "M"
blocked_by = "s3-1"
done = """
Module::forward_traced carries a Vec<TraceStep> the caller owns, so attribution is a parameter
rather than dspy's thread-local settings.trace. A composed module passes it down and relabels
what its children recorded, the same way named_predictors relabels theirs. Predict, ChainOfThought
and ReAct implement it; ReAct's episode moved into one private run() so forward and forward_traced
cannot drift. BootstrapFewShot files demos under the predictor that earned them, falls back to
program-level only when nothing was traced, and counts solved examples rather than demos — with
several predictors one example earns several demos and the two part company.
"""
remaining = """
s3-1's raw_demos rebinding is exercised by a Rust test but still not compared against upstream;
that needs a two-predictor dspy program in generate_bootstrap_fixture.py. b5 records the one
decision that cannot be compared at all.
"""
narrative = """
As someone compiling a program with several predictors, I want each predictor to receive the
demos its own calls earned, so that compiling a pipeline is worth more than compiling one step.
"""
problem = """
dspy keys name2traces by id(predictor) off a thread-local settings.trace. Module::forward
returns only the finished Prediction, so every predictor currently receives the program-level
demo. For a single-predictor program the two coincide exactly; beyond that they do not.
"""
acceptance = [
  "A two-predictor program gives each predictor demos from its own calls",
  "A single-predictor program's output is unchanged — pinned by a test that fails if it moves",
  "No ambient thread-local state: the seam is explicit in the Module signature",
]

