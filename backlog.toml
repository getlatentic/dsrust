outcome = "The declaration layer is held to upstream directly, not only through adapters."
suites = [
  "signatures/test_signature.py", "signatures/test_custom_types.py",
  "signatures/test_adapter_file.py", "signatures/test_adapter_image.py",
  "primitives/test_example.py",
]
rationale = """
Signature behaviour was proven only where an adapter happened to render it. These suites test
it head-on.

Not the cheap win it was filed as. The bridge substituted adapters and nothing else, so these
files ran dspy's Python against itself; a suite added without more would have grown the pass
count and left the crossing count flat, which is the lie the counter exists to catch. Earning
them means giving the crate decisions to make below the wire.
"""
done = """
infer_prefix is the crate's, held to a 45-name golden covering the boundaries upstream's four
expressions disagree about: its letter classes are ASCII while its digit class is not, so
text٢number splits where ПриветМир does not. Mutation testing drove three of those names.

The crossing counter split in two. Rendering and parsing is one fact; deciding a signature is
another, and it moves during almost any signature construction, so folding them together would
have reported coverage no assertion backs. Both are printed.
"""
remaining = """
signatures/ is complete: all four files run. What they leave declared rather than crossing is
dspy.File, dspy.Image and custom-annotation resolution — a value building and describing itself,
which is Python answering about its own type system rather than anything this crate renders.
Four tests in test_signature.py raise while a declaration is still being validated; two of those
are structural and portable (exactly one arrow, no name claimed by both sides).

primitives/test_example.py runs: the record's one real decision — which fields are inputs and
which are labels — is the crate's, and the rest of that file is Python's data model on a Python
object.

test_base_module.py and test_module.py moved out to s7. They are not a suite to triage but a
feature to build — saving a compiled program and loading it back — and bundling a feature into a
coverage sprint is what made this one read as unfinished when its coverage was complete.

test_python_interpreter.py is NOT blocked by deno, which was a wrong reading. Deno is not a dspy
dependency at all; it is an external runtime a user installs, and PythonInterpreter shells out to
it exactly as this crate would with std::process::Command. What gates it is that it exists to
serve rlm.py, code_act.py and program_of_thought.py, none of which are ported — so it belongs
with those modules rather than here. See b7.
"""

[[sprint]]
id = "s8"
name = "The modules that compose others"
state = "next"
outcome = """
The modules a program is built out of rather than the one it ends at: retrying, sampling more
than once, and running branches side by side.
"""
suites = [
  "predict/test_aggregation.py", "predict/test_multi_chain_comparison.py",
  "predict/test_parallel.py",
]
rationale = """
dspy ships thirteen modules and three are ported. These three need nothing this crate lacks:
majority reconciles several answers, MultiChainComparison shows a model its own prior attempts,
and Parallel runs branches at once.

Scoped down from six by reading upstream rather than by its file list. Retry is a dead file —
zero non-comment lines, and `dspy.Retry` does not exist in 3.2.1 — so porting it would mean
porting a comment. BestOfN and Refine moved to s11 because both vary attempts with
`lm.copy(rollout_id=..., temperature=1.0)`, which is b2: a per-call LM override this crate has
no seam for. That is the same limit that leaves max_rounds unable to force a different answer.
"""
constraint = """
tokio is a dev-dependency, not a dependency: this crate is async but runtime-agnostic, and
nothing in src/ spawns or joins anything today. Parallel therefore cannot reach for
tokio::spawn or a JoinSet without forcing a runtime on every caller, which is a promise the
crate has so far declined to make.

What fits instead is concurrency without parallelism — polling many futures on one task, the
way join_all does — which suits network-bound model calls and keeps the crate runtime-free.
dspy's Parallel is thread-based because Python's calls are blocking; that reason does not carry
over. The open question is whether to take a futures dependency for the join or write it, and
Evaluate wants the same answer, so whichever lands first decides for both.
"""

[[sprint]]
id = "s11"
name = "Trying more than once"
state = "planned"
outcome = "A program can attempt something several times and keep the best attempt."
suites = ["predict/test_best_of_n.py", "predict/test_refine.py"]
rationale = """
BestOfN and Refine are one module with a feedback step added, so they arrive together. Both need
b2 first — a per-call LM override, since every attempt is `lm.copy(rollout_id=idx,
temperature=1.0)` and without it a second attempt re-asks identically. Closing b2 also makes
max_rounds assertable in BootstrapFewShot, so this sprint pays a debt as well as adding modules.

Refine carries a real portability problem beyond that, and upstream gives no oracle for it: its
feedback step reads the Python source of the wrapped module and of the reward function with
inspect.getsource and puts that text in a prompt. Rust has no runtime source introspection. The
feedback half is also entirely untested upstream, so whatever is built there needs its own tests
rather than a suite to answer to. Decide between a caller-supplied description and a macro that
captures source at compile time.
"""

