[[story]]
id = "bridge-wont-load"
sprint = "api"
title = "The upstream suite cannot run: this toolchain emits a 4-aligned LINKEDIT pool and dyld wants 8"
state = "done"
size = "M"
suites = []
done = """
`[profile.release] strip = "none"` in the **workspace root** Cargo.toml. rustc's post-link LLVM strip
leaves `LC_SYMTAB.stroff` at `4 mod 8` and macOS 27's dyld refuses the image — rust-lang/rust#157750,
llvm/llvm-project#203678, fixed upstream for Rust 1.98. Drop the profile once the toolchain is past it.

Verified end to end rather than by the error going away: `stroff mod 8 = 0` from `otool -l`,
`ctypes.CDLL` dlopens it, the built wheel imports with its 24 names, and the suite runs —
**897 passed, 479 crossing into Rust**, which is the first time it has run at all in this session.

**Why seven experiments missed it.** Every one of strip, clean, `-ld_classic`, `linker=/usr/bin/cc`,
Python 3.12, `opt-level=z` and an older rustc passed through the same post-link strip, so none could
move the residue — and the constant `4 mod 8` across three builds was the tell that they were all
downstream of one defect. The first attempt at the actual fix was written to
`crates/dsrs-bridge/Cargo.toml` because a preceding `cd` left the shell there, and Cargo **ignores
`[profile.*]` in a workspace member**. It appeared to change nothing, so stripping was ruled out on
evidence that never existed. `git checkout Cargo.toml` reporting "Updated 0 paths" while
`git status` showed the member modified was on screen at the time and went unread.

The lesson is narrower than "check your edits landed": an experiment whose *negative* result rules
something out deserves a positive control. Nothing here confirmed the setting was in force, so a
no-op read as a refutation.
"""
plan = """
`./scripts/run_upstream_tests.sh` exits 1 without running a single upstream test. The bridge builds
and installs, and then the dynamic loader refuses it:

    ImportError: dlopen(.../dsrs_bridge.cpython-313-darwin.so):
      mis-aligned LINKEDIT string pool, fileOffset=0x00256F7C

**Diagnosed, not fixed.** The offset is the whole of it: `0x00256F7C` is 2453372, which is 4-aligned
and *not* 8-aligned. dyld on macOS 27 requires the LINKEDIT string pool to be 8-aligned and refuses
the image when it is not. Every binary this toolchain produces lands on a 4-aligned offset.

Ruled out, each by testing rather than reasoning:

* **Not the install.** Importing the `.so` straight out of the freshly built wheel fails identically,
  so it is bad before pip sees it.
* **Not the signature.** `codesign -f -s -` re-signs it; the error is unchanged.
* **Not maturin.** `target/release/libdsrs_bridge.dylib` — cargo's own artifact, which maturin only
  copies — fails identically. This is the finding that moved it from a packaging problem to a
  toolchain one.
* **Not stripping.** `cargo clean -p dsrs-bridge` then a real rebuild (it recompiled, 4.05s):
  same offset.
* **Not the new linker.** `RUSTFLAGS="-C link-arg=-Wl,-ld_classic"`: same offset.
* **Not the Python version.** Built against 3.12 instead of 3.13: a *different* offset,
  `0x0025AF0C` = 2469644, and 2469644 % 8 = 4. Still misaligned. So the binary really does change
  and every variant lands wrong.

Toolchain: rustc 1.96.0 (2026-05-25), maturin 1.14.1, macOS 27 (Darwin 27.0.0), arm64.

Two more ruled out since:

* **Not a shadowed linker.** Homebrew's LLVM clang precedes Apple's on PATH, which looked like the
  answer. `RUSTFLAGS="-C linker=/usr/bin/cc"` forces Apple's driver: same offset. `cc` was already
  Apple's anyway — only `clang` is shadowed, and rustc does not use it.
* **Not an old rustc, and it cannot be.** 1.85 and 1.86 are installed but the crate uses let-chains
  (stable since 1.88), so they do not compile it. Downgrading is not available as a fix even if it
  were the diagnosis.

**The lead worth following, and it reframes the problem.** `/usr/bin/ld` is `ld-27036.1`, built
10 July. The working `.so` is dated 24 July — *after* that linker. So the linker has not changed
since it last produced a loadable binary. What has changed is the crate: 1.6 MB then against 2.9 MB
now, and today alone added the observe module, retry, the items path and the whole `Sampling` rename.

That fits every observation a toolchain-regression story does not: the same `ld` worked in July,
the offset moves with the binary's content (3.12 and 3.13 give different ones), and no flag shifts
it. A size- or symbol-count-dependent alignment bug in `ld` would look exactly like this.

That test was run and the size hypothesis is **wrong**. `-C opt-level=z` gives 2.75 MB against
2.89 MB and lands at `0x001F6034`, still misaligned.

**The sharpest fact, and where the next person should start.** Three independent builds — 3.13,
3.12, and opt-level=z — give three different offsets, and every one is exactly `4 mod 8`:

    0x00256F7C = 2453372  mod 8 = 4
    0x0025AF0C = 2469644  mod 8 = 4
    0x001F6034 = 2056244  mod 8 = 4

Chance would scatter the residue. A constant 4 means something emits a structure with a 4-byte
element where the pool wants 8-byte alignment after it, every time, whatever the binary contains.
That is a single structural defect, not a threshold — so look for what precedes the string pool in
the LINKEDIT segment and is 4-aligned, rather than for a flag.

`otool -l` on the failing `.so` against `.dspy-venv`'s working one, comparing the LINKEDIT load
commands and what sits immediately before the pool in each, is the read that should settle it.

**A retracted claim, recorded because it nearly shipped.** `target/release/libdsrs_bridge.dylib`
appeared to load while the wheel's `.so` did not, which looked like maturin corrupting the file.
It was a false positive: `.dylib` is not in `importlib.machinery.EXTENSION_SUFFIXES`, so
`spec_from_file_location` chose a non-extension loader and never dlopen'd anything. The two files
are byte-identical (`cmp` agrees), which should have made "one loads, one does not" impossible on
its face. Copy to a `.so` name before testing.

Note the two virtualenvs. `run_upstream_tests.sh` uses `$ROOT/.venv`; HANDOFF talks about
`.dspy-venv`, which also exists. Only `.venv` has the broken bridge — `.dspy-venv` imports one
fine, presumably built by an older toolchain. Whether two are meant to exist is its own question,
and the answer changes what "rebuild" means.

**What this costs meanwhile.** Everything in `run_upstream_tests.sh` is dark: dspy's own 897 tests,
the crossing counter, the strict-xfail backlog, the API-surface gate, and the two checks added on
2026-07-30 (`check_pinned_all.py`, `check_pin_drift.py`) which have only ever been run by hand.
`run_rust_gates.sh` is unaffected and green, so the crate's own 1002 tests still hold — but the
"tested against dspy itself" claim in README.md is, right now, not being re-checked by anything.

**What proves it.** The suite runs and the counts in `backlog.toml`'s `[status]` are written by a
real run rather than carried over from the last green one.
"""

