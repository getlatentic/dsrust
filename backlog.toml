[[story]]
id = "lm-from-call"
sprint = "api"
title = "ChatModel has forward and not call: the public LM entry was never ported"
state = "done"
size = "L"
suites = ["tests/clients/test_lm.py"]
done = """
All four parts, in the order the plan set. `tests/lm_direct_call.rs` holds them by asserting on the
*conversation that reached the wire* rather than on the answer — the whole of `call` is the
normalisation between what a caller wrote and what a provider is sent, so a case reading only the
reply would pass for a `call` that discarded its input.

`ChatModel::call` is dspy's `BaseLM.__call__`, and it is **defaulted** on the trait: a provider gets
it by implementing `forward` and nothing else, which is the same reason upstream puts `__call__` on
the base class. `where Self: Sync` is on it because the returned future captures `&self`.

**`call` is main's `__call__`, not the pin's, and that was not noticed while building it.** At
3.3.0b1 the signature is `__call__(prompt=None, messages=None, **kwargs) -> list[dict | str]` — no
variadic items, and a list of strings back. Main changed it to
`__call__(*items, prompt=None, messages=None, request=None, **kwargs) -> LMResponse | list[...]`,
which is what landed here. So `lm(dspy.User(...), dspy.Assistant(...))` is a **main** form; the pin
cannot express it.

What *is* at the pin, and is what this is built on: `LMRequest.from_call(model=, items=, ...)`,
`_messages_from_items` with all three of its branches, and `User`/`Assistant`/`System`/`Developer`
exported at the top level. So the vocabulary and the normalisation are the pin's; only the *entry
that takes them variadically* is ahead of it.

The consequence is the one the rule names: no upstream test covers `call`, because the suite runs at
the pin and the pin has no such call. `tests/lm_direct_call.rs` is its only oracle, and it is a
transcription of main's semantics rather than a golden generated by running anything. Worth
re-deriving when the pin moves — `_messages_from_items` is unchanged between the two, so the risk is
in the entry rather than in the normalisation.

`LmRequest::from_items` and `from_messages` are the two doors. Upstream is one `from_call` that
raises on "messages plus direct-call inputs"; two constructors make that unwritable, which is more
faithful to the intent than to the signature. `src/lm/api/items.rs` reproduces
`_messages_from_items`'s three branches — nothing at all is one empty user turn (upstream's
`items = ("",)`), every item a turn or a reply is a conversation with each `LmResponse` expanded per
output, and anything else is one user message whose parts are the items, which is what makes
`lm("Describe this.", image)` a single multimodal question.

One upstream branch has deliberately no counterpart: `_messages_from_items` unwraps a single item
that is itself a list, because Python cannot tell `lm(messages)` from `lm(message)`. Two constructors
leave nothing to disambiguate.

`items!` was not in the plan and turned out to be necessary. A Rust array holds one type, so
`[msg.into(), response.into()]` cannot infer `impl Into<LmItem>` — the compiler said so. The macro
converts each element, for the same reason `call!` and `input!` exist.

The vocabulary is now reachable: `LmMessage`, `LmPart`, `LmItem`, `LmRequest` and `LmResponse` at the
crate root, where before `LmMessage` was only at `dsrust::lm::api::LmMessage`. The role constructors
take `impl IntoIterator<Item = impl Into<LmPart>>` with `From<&str> for LmPart` beside them, which is
dspy's own coercion — `LmMessage::user(["Hello?"])` rather than `vec![LmPart::text("Hello?")]`.

`Developer` is `LmMessage::developer`, and `LM(use_developer_role=True)` is
`LmBuilder::use_developer_role` — the system→developer rename, on the Responses wire only, as
upstream's is. Both were todo; the ledger's stated reason for `Developer` was itself wrong, claiming
`Role` has a `System` variant. It has User, Assistant and Tool.

**A gate hole closed on the way, and it was the cause of the audit's method 2.** `check_api_surface.py`
only accepted a bare identifier, so mapping `LMRequest.from_call` to `LmRequest::from_items` *failed*
while mapping it to `new` passed. Being specific broke the gate, which is what pushed sixteen entries
toward generic values. `is_defined` now splits `Type::method` and checks both halves. Constructor
coverage read 81% before this story and reads 85% after.
"""
remaining = """
`ChatModel::call` names no HTTP client, as dspy's does not — it reaches `global::client()`, which
already existed for modules carrying their own model. `forward` still takes one and should not; that
is lm-shared-client, and it is now the only place the parameter survives.

dspy's `__call__` also returns the *processed* outputs (`list[dict | str]`) on the legacy contract,
where this returns `LmResponse`. That is the typed contract's own answer and the right one here, but
it means `_process_lm_response` has no counterpart — nothing needs it while adapters read the typed
response directly.
"""
plan = """
`dspy.LMRequest.from_call` is the constructor the migration guide tells adapter authors to use, and
it exists at the pinned tag rather than being part of the plan. Kw-only, three mutually exclusive
input shapes plus config:

    from_call(*, model, items=(), prompt=None, messages=None, tools=None, **kwargs)

`messages` is a list of dicts or `LMMessage`s. `prompt` is a bare string. `items` is the variadic
direct-call form, and `_messages_from_items` accepts a single message sequence, a run of `LMMessage`s,
*or a run mixing `LMMessage` and `LMResponse`* — which is what lets a caller pass a previous response
straight back into the next turn. Passing `messages` alongside either of the others raises rather
than picking one. `**kwargs` becomes config through `LMConfig.from_kwargs`.

`LmRequest::new(model, messages).configured(config)` covers the `messages` path and nothing else. A
caller with a string writes the `LmMessage` themselves, and a caller continuing from a previous
response has no route at all — the response would have to be taken apart and rebuilt by hand.

Two decisions rather than transcriptions. Rust has no `*items`, so the variadic form is either a slice
of an enum over `LmMessage | LmResponse` or a small builder; the enum is closer to what the Python
accepts and reads worse at a call site. And `from_call` raising on `messages` plus `items` is a
runtime check Rust can make impossible instead, by giving each shape its own constructor — more
faithful to the intent than to the signature, and worth saying which was chosen.

Read `_messages_from_items` before starting: this plan comes from its branches, not from the guide.
The guide describes stages for 3.4 through 4.0 that do not exist yet — `dspy.context(experimental=True)`,
the `forward_contract` warning, the default flip. Do not port those. `forward_contract` itself is
correctly a divergence: it exists so a Python subclass can choose between two `forward` shapes, and
this crate has one.

**What proves it.** `tests/clients/test_lm.py` is already in SUITES and exercises the direct-call
forms. The three `test_base_lm_forward_contract_*` tests in it stay declared, since a class-attribute
switch between two shapes has no counterpart where there is one shape.

**Checked against main.** `core/types.py` on the main branch has an identical class and method
surface to the pinned 3.3.0b1 — the diff is docstrings plus one field. So the typed vocabulary this
story builds on is not moving, and the whole nine-variant `LmPart` set is already ported: Text,
Image, Audio, Video, Binary, Document, ToolCall, ToolResult, Thinking. Only the constructor is
missing, which makes this cheaper than it reads.

Main's docstrings are the planning signal. Where the beta documents
`dspy.LanguageModel(...).normalize_request(...)`, main documents
`LMRequest.from_call(model=..., items=(...))` — and `LanguageModel` is not a class at the beta at all,
so those examples referenced something that did not exist. `from_call` is the surviving constructor,
which is the one to build.

One field arrived after the pin and is deliberately not in scope: `LMToolSpec.strict`, OpenAI's
structured-output strict mode for function calling. Note it when the pin next moves; do not port it
ahead of the pin.

**The constructors, not only the request.** Checking what a caller can *write* rather than what
exists: `LmPart` is re-exported at `dsrust::lm::LmPart`, and `LmMessage` is not — it is reachable
only as `dsrust::lm::api::LmMessage`. Nothing is at the crate root. And `LmMessage::user` takes
`Vec<LmPart>` with no coercion, where dspy's is variadic and turns a bare string into an
`LMTextPart` itself. So:

    dspy.User("Describe this image.", dspy.Image(url))
    LmMessage::user(vec![LmPart::Text { .. }, LmPart::Image { .. }])   // today

Same capability, and not the same thing to write. Three parts to close, in this order:

Re-export `LmMessage` beside `LmPart`, and both at the crate root, so a caller writes
`dsrust::LmMessage` rather than reaching through `api`.

Make the three role constructors take `impl IntoIterator<Item = impl Into<LmPart>>` with
`From<&str> for LmPart` beside it, which is the coercion dspy does and the reason its call sites read
as prose.

Add the `Developer` role, which `Role` has no variant for. Tracked twice already —
`core/types.py::Developer` and `clients/lm.py::LM.use_developer_role`, both todo.

Then `call` and `from_call` on top of those, since the `items` branch is a list of exactly these.

**Two entrances, one request.** `adapters/base.py` builds its request with `from_call(model=,
messages=, **lm_kwargs)` and no adapter anywhere passes `items=`. So the variadic form is not how a
signature reaches the model: a signature renders to messages and enters through `messages=`, while a
caller writing `lm(User(...), Assistant(...))` enters through `items=`. Both converge on `LMRequest`
and share everything below it.

That settles the design here. `Predict` already produces `LmRequest` and needs no change; the
constructors are a second door to the same type, for a caller who wants the model without a
signature. Do not thread them through the adapters.

**What this actually is.** dspy's `BaseLM` has two methods and this crate ported one.
`forward` is the hook a provider implements, and `ChatModel::forward` is it, faithfully.
`__call__` is the public entry a caller uses: it normalises the input, and `from_call` is the
constructor it normalises through. There is no `ChatModel::call` here, which is why the direct-call
UX has nowhere to live and why `from_call` looked like a free-standing gap.

So the scope is porting `__call__`, not designing an API:

    fn call(&self, items: impl IntoIterator<Item = impl Into<LmItem>>) -> ...   // the items path
    fn call_messages(&self, messages: Vec<LmMessage>) -> ...                    // what adapters use

`lm(...)` itself is impossible on stable Rust and this is not a compromise to argue about: manually
implementing `FnOnce` needs `fn_traits`, the `rust-call` ABI and two more unstable features, checked
rather than assumed. A struct cannot be called. `call` is the name because it is upstream's.

`forward` stays exactly as it is. Adding `call` above it is the same layering dspy has, and it keeps
the provider contract untouched.
"""

[[story]]
id = "callback-trait"
sprint = "api"
title = "BaseCallback is a base class with no-op methods, which is a Rust trait, and spans were chosen without weighing it"
state = "done"
size = "M"
done = """
`src/callback.rs`: `Callback`, twelve defaulted methods, one per handler upstream declares.
`configure_callbacks` is dspy's `configure(callbacks=[…])`; `LM::with_callbacks` and
`LmBuilder::callbacks` are its `LM(model, callbacks=[…])`, read through a defaulted
`ChatModel::callbacks` in the blanket `forward_dyn` — the one place a model's call cannot avoid,
which is where upstream decorates `BaseLM.__call__`. Both lists are told, the process-wide ones
first, as `_get_active_callbacks` orders them. A handler that panics is caught and logged, which is
upstream's `try/except` around each one.

`src/callback/context.rs` is `ACTIVE_CALL_ID`: a `CallId` carries the call it was born under, so
`parent()` answers what upstream needs a second lookup for. The context is entered *per poll* rather
than for the whole future, which is what makes it right where a `ContextVar` would not be —
`Evaluate` interleaves its rows inside one task with `buffered`, and a value set once and left would
be read by whichever row was polled next.

The two are not exclusive, which was the point: `src/observe.rs` fires the handlers and opens the
span at the same six points, and each point is one function that opens and closes together. A caller
who wants the properties a span has and a handler list does not — cannot mutate what it sees, cannot
break the run — registers nothing and keeps the subscriber.

**What proved it, and it was not the upstream file.** Reading `tests/callback/test_callback.py`
changed the measure. Six of its eight tests drive the `@with_callbacks` decorator over a Python
function: what they assert on is `inspect.getcallargs` reading a call's arguments back, a ContextVar,
and an attribute list on a Python object — none of which has a Rust surface, so routing them through
the bridge would have bought eleven declarations and two tests whose crossing is the *adapter*. The
two that assert something portable assert a *sequence*: the fourteen handlers one
`ChainOfThought(n=3)` call fires. So `scripts/generate_callback_fixture.py` records that sequence and
three more by running the pinned dspy under a recording `BaseCallback`, and `tests/callback.rs` holds
the crate to them — including the nesting, which is the half a transcription gets wrong by counting.

It caught one on the first run: an evaluation's rows were not children of the evaluate call. The
span was instrumented onto the rows' future and the call id was not, so every row reported itself as
an outermost call. `observe::evaluated_within` now carries both.

Two findings filed rather than folded in: `predict-completions` (the fixture's `n=3` case fires three
parses where the crate fires one, because `Predict::forward` reads one output whatever `n` is) and
`callbacks-per-module` (upstream's per-instance list on `Module`, which a Rust trait has no shared
constructor to hold).

Ledger: `utils/callback.py` is now a ported module — `BaseCallback` and its twelve handlers mapped,
`with_callbacks` a divergence naming what replaced it — and `BaseLM.callbacks`/`LM.callbacks` moved
from divergence to mapped.
"""

