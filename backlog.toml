One finding worth keeping, because it decides how this is verified. **Upstream's own suite cannot
catch a regression here.** `test_baml_adapter_formats_pydantic_input_as_clean_json` passes a real
`PatientDetails` model and then asserts only `'"name": "John Doe"' in user_message` — a substring
true of the inline form as well as the laid-out one. Measured: inverting the bridge flag so every
value crosses as non-record leaves all 380 upstream tests passing. What pins the rule is the byte
literal in `baml.rs::a_record_input_is_laid_out_over_lines_and_everything_else_is_not`, whose
expected value was read off dspy 3.2.1 directly.

A golden fixture would be the usual answer and does not fit: a BAML signature with a model-typed
field needs the Python reflection tree for its *schema* block, which no Rust-declared signature
has, so the fixture would fail on the system message for reasons unrelated to this rule.
"""
history = """
Confirmed a prompt-byte divergence, not a theoretical one. Measured against dspy 3.2.1: the same
record-declared field renders

  model instance          loose dict
  {                       {"name": "Dad", "age": 61}
    "name": "Dad",
    "age": 61
  }

because dspy asks `isinstance(value, BaseModel)` — a fact about the value — where
`src/adapter/baml.rs::input_value` asks whether the *field* was declared a record. We render the
pretty form for both, so a loose map handed to a record-declared field puts bytes in the prompt
that dspy would not. Reachable: a record kind only comes from a derived signature, but a derived
signature can still be asked through `Module::forward` with an `Example` built by `input!`.

No value-based rule can close it. A struct serialized by serde and a hand-written map with the
same keys are identical `Value`s, so the distinction has to be carried, not recovered.

The chain, which is the whole cost:
  - the derive knows the Rust type, so `emit.rs::pair_value` is where the flag originates;
  - `SignatureSpec::input_pairs` has to carry it, so its return type changes;
  - `Predict` passes it through `call_with_inputs`;
  - `Adapter::format` takes it — `&[(&str, Value)]` becomes `&[Input<'_>]` carrying
    `{ name, value, record }`, which is the honest model since a value and its provenance belong
    together;
  - only `baml.rs::input_value` reads it. The other four adapters pass it through untouched.

Two call sites in `src/predict.rs` and one in `bridge/src/lib.rs`, six `format` impls, ~11 test
sites. The bridge is the payoff as well as a cost: Python *can* do `isinstance`, so the shim sets
the flag truthfully and upstream's own BAML suite then exercises our exact rule rather than a
declaration-shaped approximation of it.

Widening `Adapter::format` is a promise to callers writing their own adapter, which is goal #2,
so it is worth doing once and deliberately rather than twice.
"""
title = "BAML record inputs branch on the declaration, not the value"
kind = "known-divergence"
decision = "accepted"
detail = """
dspy branches on isinstance(value, BaseModel); we branch on the field's declared type. The two
agree whenever a value matches its declaration, and disagree only when a caller passes a loose
mapping to a field declared as a record. Closing it means putting per-call value provenance into
the public Adapter::format — a worse trade than the divergence. Reasoning lives at
src/adapter/baml.rs::input_value. Reopen only if a real caller hits it.
"""

[[backlog]]
id = "b2"
title = "max_rounds re-asks but nothing forces a different answer"
kind = "known-limit"
state = "done"
closed = "2026-07-21"
detail = """
Closed by s12. Sampling travels on the request — temperature, max_tokens, n and rollout_id on
`LmRequest` — and reaches every predictor in a program through `Module::set_sampling`, the
widened `NamedPredictor` walk. `BootstrapFewShot` asks each round after the first as
`Sampling::rollout(round)`, so a re-ask is a genuinely different ask; `Cached` gives rollout_id
the cache it exists to miss. Asserted by
`optimize::bootstrap::tests::every_round_after_the_first_is_asked_as_a_fresh_rollout`, and by
`the_teacher_is_left_asking_the_way_it_was_found` for the restore.

What follows is the reasoning as it stood while this was open.

"""
history = """
Upstream forces divergence with lm.copy(rollout_id=round_idx, temperature=1.0), which is two
things and only one is now built.

Built: a module can be given its own model — Predict::with_lm, dspy's set_lm — so an optimizer
can hand each attempt a different one instead of every call reaching a process-wide default.

Not built: anything to differ. ChatModel::chat carries no sampling parameters at all, and
temperature is a hardcoded 0.7 on the ollama path only, so two models cannot yet be made to
disagree. rollout_id has no equivalent either; upstream uses it purely to miss a provider cache.

The shape is settled and not by us. dspy is normalising its LM API: forward(request: LMRequest)
-> LMResponse, with model, messages, temperature, max_tokens, n and rollout_id inside the
request, and text, outputs, usage, cache_hit and provider_data inside the response. Opt-in at
3.3, default at 3.5, legacy removed by 3.6/4.0.

So sampling belongs to a request rather than to a model, and the option of hanging temperature
off an LM value is the one upstream is moving away from — building it would be porting a shape
with a removal date. See s12.
"""

[[backlog]]
id = "b6"
title = "One call spelling across declared and derived signatures"
kind = "ergonomics"
state = "done"
detail = """
dspy builds and asks both signature forms identically, so a difference here was a defect rather
than a trade-off. predict! takes a spelling or a task type, and call! asks either.

What does NOT collapse is the answer, and that is the point of the Ask trait: a task declared by
its field names has only fields to hand back, while a derived one hands back its own outputs, so
result.answer keeps meaning the field. Ask is written per module rather than blanket over Module,
because a derived task is a Module too and one blanket impl would make its better answer
unreachable. A module of a caller's own opts in with asks_with_a_prediction!.
"""

[[backlog]]
id = "b5"
title = "A predictor traced twice for one example takes its last trace"
kind = "known-divergence"
# Skipped, not deferred. Nothing here is pending and nothing should reopen it without new facts.
decision = "skipped"
state = "skipped"
closed = "2026-07-21"
detail = """
When one predictor produces several traces for a single example, dspy collapses them to one demo,
choosing evenly between the last trace and a random earlier one. The choice is seeded with
Hasher.hash(tuple(demos)), xxhash64 over pickle.dumps, and src/optimize/bootstrap.rs::file takes
the last trace instead. That agrees with upstream whenever upstream's coin lands on the last one.

The reason is NOT that the pickle bytes are unportable — they are a fixed template (protocol 4,
STACK_GLOBAL on dspy.primitives.example/Example, NEWOBJ, then a _store/_demos/_input_keys state
dict with memo refs) and xxhash64 has a Rust crate. It is that **upstream's own seed is not
reproducible across processes**. `_input_keys` is a Python set, so its pickled order follows
per-process randomized string hashing: with two or more input keys the digest changes run to run.
Measured on unmodified dspy — five processes, same code and data, and the fifth disagreed with
the other four.

Two things settle it beyond "it is hard".

**The RNG is not the gap.** `src/optimize/rng.rs` already reproduces this exact generator —
CPython's Mersenne Twister, held to `tests/conformance/rng/cpython_random.json`. Pickle sits
*outside* it: object → bytes → xxhash64 → hex digest → seed → two draws. Even the seeding path
is well defined; measured, `random.Random("a6311e…")` equals `random.Random(int.from_bytes(s +
sha512(s)))`, a 639-bit key through `init_by_array`. All of that is portable. The one input that
is not is the pickled order of `_input_keys`, a Python `set` — deterministic *within* a process
(1000 hashes in one run gave one value) and different between processes, because CPython seeds
string hashing per interpreter.

**Porting it anyway would make agreement worse.** A Rust pickle would yield a deterministic seed,
but our own rather than upstream's, so it is an independent coin. Two independent coins agree less
often than one fixed choice matching a coin — measured over 400k trials: always-last holds 0.500
at any size, while an own coin gives 0.501 at two traces, 0.376 at three, 0.314 at five, 0.287 at
eight. Taking the last trace is the *optimal* strategy once the seed is unreachable, not a
shortfall. Taking the last trace is at least deterministic. This is the one place in the port
where byte-faithfulness is unreachable, and it is upstream's nondeterminism rather than a gap
here. Revisit only if upstream reseeds on something stable.

Only reachable when a predictor is called more than once per example, which means a loop: ReAct's
per-turn predictor is the case in this crate. A pipeline whose predictors each run once never
reaches the branch, and neither does any single-predictor program.
"""

[[backlog]]
id = "b7"
title = "PythonInterpreter, and the modules that need it"
kind = "unscoped"
detail = """
dspy runs generated code in a Pyodide sandbox by shelling out to `deno run`. Deno is not a dspy
dependency — it is a prerequisite a user installs — so a Rust port carries the same external
requirement and std::process::Command does what subprocess does. Portable, in other words, and
earlier notes calling it blocked were wrong.

What it actually waits on is purpose: PythonInterpreter exists for rlm.py, code_act.py and
program_of_thought.py. Port those and the interpreter comes with them; port the interpreter
alone and nothing uses it. Size the three modules before scheduling any of it.

Decided 2026-07-21: a trait with two implementations, not one choice.

`deno` + pyodide is the default and the conformance target, because it is literally the sandbox
upstream runs — identical behaviour by construction, and the external prerequisite is one dspy
already imposes rather than one this crate adds. `rustpython` rides alongside as an opt-in for a
caller who will not install deno.

It has to be a seam rather than a swap because the interpreter's output *reaches the model*:
`ProgramOfThought` feeds it back as `code_output`, an InputField desc'd "output of
previously-generated python code". Float formatting, exception text and dict ordering all land in
the next prompt, so a second interpreter is a documented divergence a caller opts into — the same
shape as `LM::without_cache`, and the same seam pattern as ChatModel/Adapter/Optimizer.

The options, and why the default is the default:

  deno + pyodide   what dspy does. Same external prerequisite, and identical behaviour because
                   it is literally the same sandbox.
  wasmtime         pyodide's wasm hosted directly, no deno. Pyodide is Emscripten-built and
                   expects JS glue for its syscalls, so this needs proving before it is planned.
  rustpython       a Python interpreter in Rust, in-process, no external runtime at all. Buys
                   the dependency back at the cost of a different interpreter's behaviour.
  pyo3             rejected. It embeds CPython with full host access, which removes the sandbox
                   that is the whole point. It stays what it already is here: the test bridge.
"""

