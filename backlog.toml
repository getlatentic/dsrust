of per token fails on the sigma, skipping only `\\p{Z}` fails on a tab, treating unassigned
codepoints as printable fails on `x\\u0378y`, and dropping the empty-answer branch fails on `the`
against `theatre`. Each was reverted after.

Two things the reading turned up that the reason had not:

- Rust's `str::to_lowercase` applies the final-sigma rule and `char::to_lowercase` does not, so
